/* =========================================================
   Event handling (delegated)
   ========================================================= */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const view = el.getAttribute('data-nav');
      const id = el.getAttribute('data-id');
      const deck = el.getAttribute('data-deck');
      if(view === 'activate' || view==='landing' || view==='dashboard-continue'){
        if(view==='dashboard-continue'){ if(STATE.activated) nav('dashboard'); else nav('activate'); return; }
        nav(view); return;
      }
      if(view === 'topic'){ nav('topic', {id}); return; }
      if(view === 'flashcards'){ currentDeckId = deck || "all"; deckMode = deck ? 'all' : deckMode; deckQueue=[]; deckIdx=0; cardFlipped=false; nav('flashcards'); return; }
      nav(view);
    });
  });
  document.querySelectorAll('[data-scroll]').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.getElementById(el.getAttribute('data-scroll'))?.scrollIntoView({behavior:'smooth'});
    });
  });
  const actBtn = document.getElementById('activateBtn');
  if(actBtn) actBtn.addEventListener('click', tryActivate);
  const codeInput = document.getElementById('stuCode');
  const nameInput = document.getElementById('stuName');
  if(codeInput) codeInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryActivate(); });
  if(nameInput){
    nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); codeInput?.focus(); } });
    if(ROUTE.view === 'activate') setTimeout(()=>nameInput.focus(), 60);
  }
  const toggleCodeBtn = document.getElementById('toggleCodeBtn');
  if(toggleCodeBtn){
    toggleCodeBtn.addEventListener('click', ()=>{
      const input = document.getElementById('stuCode');
      const show = document.getElementById('eyeIconShow');
      const hide = document.getElementById('eyeIconHide');
      const nowText = input.type === 'password';
      input.type = nowText ? 'text' : 'password';
      show.classList.toggle('hide', nowText);
      hide.classList.toggle('hide', !nowText);
      toggleCodeBtn.setAttribute('aria-label', nowText ? 'Hide access code' : 'Show access code');
    });
  }
  if(ROUTE.view === 'admin') attachAdminHandlers();

  /* Topic quiz */
  document.querySelectorAll('.opt[data-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const topicId = el.getAttribute('data-topic');
      const qi = el.getAttribute('data-qi');
      const key = topicId+'-'+qi;
      if(quizAnswers[key]!==undefined) return;
      const oi = parseInt(el.getAttribute('data-oi'));
      const t = findTopic(topicId); const q = t.testYourself[qi];
      quizAnswers[key] = oi;
      const group = document.querySelector(`.opt-list[data-qidx="${qi}"]`);
      group.querySelectorAll('.opt').forEach((o,idx)=>{
        if(idx===q.answer) o.classList.add('correct');
        else if(idx===oi) o.classList.add('wrong');
      });
      const exp = document.getElementById(`explain-${topicId}-${qi}`);
      exp.classList.remove('hide');
      exp.textContent = (oi===q.answer? "Correct — ":"Not quite — ") + q.explain;
      STATE.stats.questionsAnswered += 1;
      if(oi===q.answer) STATE.stats.correctAnswered += 1;
      markActivityToday();
      saveState();
      checkAchievements();
    });
  });
  const markBtn = document.getElementById('markCompleteBtn');
  if(markBtn) markBtn.addEventListener('click', ()=>{
    const id = markBtn.getAttribute('data-id');
    if(!STATE.stats.topicsCompleted.includes(id)){
      STATE.stats.topicsCompleted.push(id);
      markActivityToday(); saveState();
      checkAchievements();
      showToast("Topic marked as completed 🎉");
      nav('topic', {id});
    }
  });
  const bmBtn = document.getElementById('bookmarkBtn');
  if(bmBtn) bmBtn.addEventListener('click', ()=>{
    const id = bmBtn.getAttribute('data-id');
    const idx = STATE.bookmarks.indexOf(id);
    if(idx>-1) STATE.bookmarks.splice(idx,1); else STATE.bookmarks.push(id);
    saveState(); nav('topic', {id});
  });

  /* Learn subject tabs */
  document.querySelectorAll('[data-subjtab]').forEach(el=>{
    el.addEventListener('click', ()=>{ learnSubject = el.getAttribute('data-subjtab'); nav('learn'); });
  });

  /* Trivia */
  const revealBtn = document.getElementById('revealTriviaBtn');
  if(revealBtn) revealBtn.addEventListener('click', ()=>{ triviaRevealed = true; nav('trivia'); });
  const nextTrivia = document.getElementById('nextTriviaBtn');
  if(nextTrivia) nextTrivia.addEventListener('click', ()=>{ triviaIdx = Math.floor(Math.random()*BODY_FACTS.length); triviaRevealed=false; nav('trivia'); });

  /* Flashcards */
  document.querySelectorAll('[data-fcmode]').forEach(el=>{
    el.addEventListener('click', ()=>{
      deckMode = el.getAttribute('data-fcmode');
      deckQueue = []; deckIdx = 0; cardFlipped = false;
      nav('flashcards');
    });
  });
  const fcEl = document.getElementById('flashcardEl');
  if(fcEl) fcEl.addEventListener('click', ()=>{ cardFlipped = !cardFlipped; nav('flashcards'); });
  document.querySelectorAll('[data-rate]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const rate = el.getAttribute('data-rate');
      const prev = STATE.stats.flashcardReviews[id] || {};
      STATE.stats.flashcardReviews[id] = nextReview(prev, rate);
      STATE.stats.totalFlashcardReviews = (STATE.stats.totalFlashcardReviews||0) + 1;
      markActivityToday(); saveState();
      checkAchievements();
      // remove the just-reviewed card from a "due" session so it doesn't reappear until due again
      if(deckMode === 'due'){
        deckQueue.splice(deckIdx % deckQueue.length, 1);
      } else {
        deckIdx += 1;
      }
      cardFlipped = false;
      nav('flashcards');
    });
  });

  /* Brain Lab */
  document.querySelectorAll('[data-braincat]').forEach(el=>{
    el.addEventListener('click', ()=> startBrainGame(el.getAttribute('data-braincat')));
  });
  document.querySelectorAll('[data-brainopt]').forEach(el=>{
    el.addEventListener('click', ()=> submitBrainAnswer(parseInt(el.getAttribute('data-brainopt'))));
  });
  const brainSubmitText = document.getElementById('brainSubmitText');
  if(brainSubmitText) brainSubmitText.addEventListener('click', ()=>{
    const val = document.getElementById('brainTextInput').value;
    submitBrainAnswer(val);
  });
  const brainTextInput = document.getElementById('brainTextInput');
  if(brainTextInput) brainTextInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitBrainAnswer(brainTextInput.value); });
  const brainNextBtn = document.getElementById('brainNextBtn');
  if(brainNextBtn) brainNextBtn.addEventListener('click', ()=>{
    if(brainSession.index < brainSession.questions.length-1){
      brainSession.index += 1; brainSession.answered = false; brainSession.selected = null;
      nav('brainlab-run');
    } else {
      finishBrainGame();
    }
  });

  /* CBT setup */
  document.querySelectorAll('[data-cbtsubj]').forEach(el=>{
    el.addEventListener('click', ()=>{ cbtSetupSubject = el.getAttribute('data-cbtsubj'); nav('cbt'); });
  });
  document.querySelectorAll('[data-cbtcount]').forEach(el=>{
    el.addEventListener('click', ()=>{ cbtQuestionCount = parseInt(el.getAttribute('data-cbtcount')); nav('cbt'); });
  });
  document.querySelectorAll('[data-cbtdur]').forEach(el=>{
    el.addEventListener('click', ()=>{ cbtDurationMin = parseInt(el.getAttribute('data-cbtdur')); nav('cbt'); });
  });
  const startCbtBtn = document.getElementById('startCbtBtn');
  if(startCbtBtn) startCbtBtn.addEventListener('click', startCbt);

  /* CBT run */
  document.querySelectorAll('[data-cbtopt]').forEach(el=>{
    el.addEventListener('click', ()=>{
      cbtSession.answers[cbtSession.index] = parseInt(el.getAttribute('data-cbtopt'));
      nav('cbt-run');
    });
  });
  const cbtPrev = document.getElementById('cbtPrev');
  if(cbtPrev) cbtPrev.addEventListener('click', ()=>{ cbtSession.index = Math.max(0, cbtSession.index-1); nav('cbt-run'); });
  const cbtNext = document.getElementById('cbtNext');
  if(cbtNext) cbtNext.addEventListener('click', ()=>{ cbtSession.index = Math.min(cbtSession.questions.length-1, cbtSession.index+1); nav('cbt-run'); });
  const cbtFlag = document.getElementById('cbtFlag');
  if(cbtFlag) cbtFlag.addEventListener('click', ()=>{ cbtSession.flags[cbtSession.index] = !cbtSession.flags[cbtSession.index]; nav('cbt-run'); });
  const cbtSubmit = document.getElementById('cbtSubmit');
  if(cbtSubmit) cbtSubmit.addEventListener('click', submitCbt);
  document.querySelectorAll('[data-cbtjump]').forEach(el=>{
    el.addEventListener('click', ()=>{ cbtSession.index = parseInt(el.getAttribute('data-cbtjump')); nav('cbt-run'); });
  });
}

/* =========================================================
   Boot
   ========================================================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
render();
</script>
</body>
</html>
