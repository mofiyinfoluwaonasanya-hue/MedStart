<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEDSTART — Your Foundation Before Med School</title>
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B1220'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle' fill='%2312B3A8'%3E%2B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1220;
  --navy-2:#121B2E;
  --navy-3:#1B2740;
  --teal:#12B3A8;
  --teal-light:#5FE3D6;
  --blue:#4C8DFF;
  --purple:#8A7FFF;
  --amber:#F2A93B;
  --paper:#F5F7FA;
  --white:#FFFFFF;
  --ink:#0E1526;
  --muted:#5B6B85;
  --line:#E3E8F0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 10px 30px -12px rgba(11,18,32,.18);
  font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;line-height:1.1;letter-spacing:-0.01em}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--teal-light);color:var(--navy)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:'JetBrains Mono',monospace}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.hide{display:none !important}

/* status pill */
.status-pill{
  position:fixed;top:12px;right:12px;z-index:80;
  display:flex;align-items:center;gap:6px;
  background:rgba(11,18,32,.92);color:#fff;
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
  box-shadow:var(--shadow);
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.status-pill.offline .dot{background:var(--amber)}

/* ---------- Landing ---------- */
.landing-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,5vw,64px);
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--navy)}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:var(--navy);
  color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
}
.landing-nav .cta-small{
  background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
}
.hero{
  background:radial-gradient(120% 140% at 15% 0%,#16233d 0%,var(--navy) 55%,#080D18 100%);
  color:#fff;padding:40px clamp(20px,5vw,64px) 70px;
  display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;
}
.hero-eyebrow{color:var(--teal-light);font-size:14px;font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(34px,5.2vw,58px);color:#fff;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--teal-light)}
.hero p.lede{margin-top:18px;font-size:17px;color:#C7D2E5;max-width:46ch}
.hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{
  padding:13px 24px;border-radius:999px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--teal);color:#04211E}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-dark{background:var(--navy);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy)}
.btn-full{width:100%;justify-content:center}

.focus-card{
  background:var(--navy-2);border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
}
.focus-card .fc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.focus-card .fc-head span{font-size:12px;letter-spacing:.02em;color:var(--teal-light);font-weight:700}
.focus-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.focus-row:first-of-type{border-top:none}
.focus-row .ic{font-size:18px;width:26px}
.focus-row .txt b{display:block;font-size:13px;color:#9FB0CC;font-weight:600}
.focus-row .txt span{font-size:14.5px;color:#fff}

.section{padding:64px clamp(20px,5vw,64px)}
.section-head{max-width:640px;margin-bottom:36px}
.section-head .kicker{color:var(--teal);font-weight:700;font-size:13px;margin-bottom:8px}
.section-head h2{font-size:clamp(26px,3.4vw,36px)}
.section-head p{color:var(--muted);margin-top:12px;font-size:16px}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.feat-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;
}
.feat-card .ic{font-size:22px;margin-bottom:10px}
.feat-card h4{font-size:16.5px;margin-bottom:6px}
.feat-card p{color:var(--muted);font-size:14px}

.who-strip{
  background:var(--navy);color:#fff;border-radius:24px;padding:40px clamp(20px,4vw,50px);
  display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;
}
.who-strip h3{font-size:24px;color:#fff;margin-bottom:14px}
.who-strip ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.who-strip li{display:flex;gap:10px;color:#C7D2E5;font-size:15px}
.who-strip li::before{content:"—";color:var(--teal-light)}

.faq-item{border-bottom:1px solid var(--line);padding:18px 0}
.faq-item summary{cursor:pointer;font-weight:600;font-size:15.5px;list-style:none;display:flex;justify-content:space-between}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";color:var(--teal);font-size:20px}
.faq-item[open] summary::after{content:"–"}
.faq-item p{margin-top:10px;color:var(--muted);font-size:14.5px}

.disclaimer-bar{background:#EFF3F8;color:var(--muted);font-size:13px;text-align:center;padding:14px 20px}
.landing-footer{padding:30px clamp(20px,5vw,64px);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line)}

/* ---------- Auth ---------- */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 140% at 85% 100%,#16233d 0%,var(--navy) 55%,#080D18 100%);
  padding:24px;
}
.auth-card{
  background:#fff;border-radius:22px;max-width:400px;width:100%;
  padding:34px 28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);
}
.auth-card .brand{margin-bottom:6px}
.auth-card h2{font-size:22px;margin:14px 0 4px}
.auth-card .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--navy)}
.field input{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;font-family:inherit;background:var(--paper);
}
.field input:focus{border-color:var(--teal);background:#fff}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px}
.auth-links{text-align:center;margin-top:16px;font-size:13.5px;color:var(--muted)}
.auth-links button{color:var(--blue);font-weight:600}
.access-note{
  margin-top:18px;background:#F0FBFA;border:1px solid #BEEAE6;border-radius:12px;
  padding:14px;font-size:12.8px;color:#0E5A55;line-height:1.55;
}
.access-note b{color:#0B3E3A}
.request-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.request-row a{
  flex:1;min-width:120px;text-align:center;background:var(--navy);color:#fff;
  padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:600;
}
.request-row a.alt{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.auth-lock{
  display:inline-flex;align-items:center;gap:6px;background:#EEF2F8;color:var(--muted);
  padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:600;margin-top:12px;
}
.field input.code-input{letter-spacing:.06em;font-weight:600}
.btn-full[disabled]{opacity:.6;cursor:progress}
.pw-field{position:relative}
.pw-field input{padding-right:44px}
.pw-eye{
  position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--muted);
}
.pw-eye:hover{background:#EEF2F8;color:var(--navy)}
.footer-admin-link{color:var(--muted);font-size:12px;text-decoration:underline;opacity:.7}
.footer-admin-link:hover{opacity:1}

/* ---------- Admin panel ---------- */
.admin-wrap{min-height:100vh;background:var(--paper);padding:24px 16px 60px}
.admin-shell{max-width:640px;margin:0 auto}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.admin-header h2{font-size:20px}
.admin-header a{font-size:13px;color:var(--muted);text-decoration:underline}
.admin-gate{background:#fff;border-radius:18px;padding:30px 26px;max-width:380px;margin:80px auto 0;box-shadow:0 20px 50px -25px rgba(11,18,32,.3)}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.admin-stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.admin-stat{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.admin-stat .num{font-size:22px;font-weight:700;color:var(--navy);font-family:'Fraunces',serif}
.admin-stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.admin-search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;margin-bottom:14px;font-family:inherit}
.admin-search:focus{outline:none;border-color:var(--teal)}
.admin-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.admin-row:last-child{border-bottom:none}
.admin-row .code{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--navy);min-width:150px}
.admin-row .who{flex:1;font-size:13.5px;color:var(--ink)}
.admin-row .who.unassigned{color:var(--muted);font-style:italic}
.admin-row input.name-input{
  flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;
}
.admin-row .row-btn{
  padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;
}
.admin-row .row-btn.assign{background:var(--navy);color:#fff}
.admin-row .row-btn.send{background:#25D366;color:#fff}
.admin-row .row-btn.clear{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.admin-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:24px 0}
.admin-note{font-size:12px;color:var(--muted);background:#FFF7EA;border:1px dashed #E9C27A;border-radius:10px;padding:12px 14px;margin-bottom:16px;line-height:1.55}
.err-msg{background:#FDECEC;color:#B3261E;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:14px}

/* ---------- App (post-activation) layout ---------- */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:240px;background:var(--navy);color:#fff;padding:22px 16px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.sidebar .brand{color:#fff;margin-bottom:22px;padding:0 8px}
.sidebar .brand .mark{background:var(--teal);color:var(--navy)}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  color:#AEBBD3;font-weight:600;font-size:14.5px;
}
.nav-item .ic{font-size:17px;width:20px;text-align:center}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff}
.nav-item:hover{color:#fff}
.sidebar-foot{margin-top:auto;padding:10px 8px;color:#7D8CA8;font-size:12px}

.main-col{flex:1;min-width:0;padding-bottom:90px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px clamp(16px,3vw,34px) 0;
}
.view{padding:14px clamp(16px,3vw,34px) 40px;max-width:980px}

.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:#fff;border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  justify-content:space-around;box-shadow:0 -6px 20px rgba(11,18,32,.06);
}
.bottom-nav .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;padding:4px 10px;border-radius:10px}
.bottom-nav .bn-item.active{color:var(--teal)}
.bottom-nav .bn-item .ic{font-size:19px}

/* Dashboard */
.greet h1{font-size:clamp(22px,3vw,30px)}
.greet p{color:var(--muted);margin-top:6px;font-size:15px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}
.stat{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
}
.stat .num{font-family:'Fraunces',serif;font-size:24px;font-weight:600}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:2px}

.focus-panel{
  background:linear-gradient(135deg,var(--navy) 0%,#1C2A47 100%);color:#fff;
  border-radius:20px;padding:24px;margin-bottom:24px;
}
.focus-panel .fp-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.focus-panel .fp-title h3{color:#fff;font-size:18px}
.focus-panel .fp-title span{font-size:12.5px;color:var(--teal-light);font-weight:700}
.focus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.focus-item{
  background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:background .15s;
}
.focus-item:hover{background:rgba(255,255,255,.12)}
.focus-item .ic{font-size:18px}
.focus-item b{display:block;font-size:11.5px;color:#9FB0CC;text-transform:none}
.focus-item span{font-size:14px}
.challenge-strip{
  margin-top:14px;background:rgba(242,169,59,.15);border:1px solid rgba(242,169,59,.35);
  border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;
}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}
.section-title h3{font-size:18px}
.section-title a{font-size:13.5px;color:var(--blue);font-weight:600}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.quick-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:8px;
}
.quick-card .ic{font-size:24px}
.quick-card h4{font-size:15px}
.quick-card p{font-size:12.5px;color:var(--muted)}

/* Subject / topic list */
.subject-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.subject-tab{
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;
  background:#fff;border:1.5px solid var(--line);color:var(--muted);
}
.subject-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.topic-list{display:grid;gap:10px}
.topic-row{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;
}
.topic-row .chk{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
}
.topic-row .chk.done{background:var(--teal);border-color:var(--teal)}
.topic-row .ti{flex:1;min-width:0}
.topic-row .ti h4{font-size:15px;margin-bottom:2px}
.topic-row .ti p{font-size:12.5px;color:var(--muted)}
.topic-row .go{color:var(--blue);font-weight:700;font-size:13px}

/* Topic detail */
.topic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.topic-head h1{font-size:clamp(24px,3.4vw,32px)}
.topic-head .tag{font-size:12.5px;color:var(--teal);font-weight:700;margin-bottom:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card p{font-size:15px;color:#26314A}
.card .analogy{background:#F0F9F8;border-left:3px solid var(--teal);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14.5px;color:#0E4741;margin-top:10px}
.key-terms{display:flex;flex-wrap:wrap;gap:8px}
.key-terms span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.mistake-card{background:#FFF6EC;border:1px solid #F5D9A8}
.mistake-card h3{color:#9A6300}
.memory-card{background:#F3F1FF;border:1px solid #DCD6FF}
.memory-card h3{color:#5A4CD9}
.med-card{background:#EFF6FF;border:1px solid #C9DFFF}
.med-card h3{color:#1D5FCC}

.quiz-q{margin-bottom:22px}
.quiz-q .qtext{font-weight:600;font-size:15px;margin-bottom:10px}
.opt-list{display:grid;gap:8px}
.opt{
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;
  display:flex;justify-content:space-between;align-items:center;
}
.opt:hover{border-color:var(--blue)}
.opt.selected{border-color:var(--blue);background:#EEF4FF}
.opt.correct{border-color:var(--teal);background:#EAFBF8;color:#0E4741}
.opt.wrong{border-color:#E85D5D;background:#FDECEC;color:#8C2323}
.opt-explain{font-size:13px;color:var(--muted);margin-top:8px;background:var(--paper);padding:10px 12px;border-radius:10px}
.topic-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* Flashcards */
.deck-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.fc-stage{display:flex;flex-direction:column;align-items:center;padding:20px 0}
.flashcard{
  width:100%;max-width:420px;min-height:230px;border-radius:20px;
  background:linear-gradient(135deg,var(--navy),#1E2C4A);color:#fff;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:30px;font-size:19px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;
  position:relative;
}
.flashcard .fc-cat{position:absolute;top:14px;left:18px;font-size:11px;color:var(--teal-light);font-weight:700}
.flashcard .fc-hint{position:absolute;bottom:14px;font-size:12px;color:#9FB0CC;font-weight:500}
.flashcard.back{background:linear-gradient(135deg,#122B2A,#0D3A38)}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;width:100%;margin-top:18px}
.rate-btn{padding:12px 4px;border-radius:12px;font-weight:700;font-size:13px;text-align:center}
.rate-again{background:#FDECEC;color:#B3261E}
.rate-hard{background:#FFF3E0;color:#9A6300}
.rate-good{background:#EAFBF8;color:#0E4741}
.rate-easy{background:#EEF4FF;color:#1D5FCC}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .ic{font-size:38px;margin-bottom:12px}

/* CBT */
.cbt-setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.cbt-subject-card{
  background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px;text-align:center;
}
.cbt-subject-card.selected{border-color:var(--teal);background:#F0FBFA}
.cbt-subject-card .ic{font-size:26px;margin-bottom:8px}
.cbt-topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:18px;position:sticky;top:10px;z-index:10}
.cbt-topbar .qcount{font-weight:700}
.cbt-topbar .timer{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--navy);background:var(--paper);padding:6px 12px;border-radius:10px}
.cbt-topbar .timer.low{color:#B3261E;background:#FDECEC}
.cbt-nav-grid{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
.qnum{width:32px;height:32px;border-radius:8px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.qnum.answered{background:var(--navy);color:#fff;border-color:var(--navy)}
.qnum.flagged{border-color:var(--amber);color:#9A6300}
.qnum.current{outline:2px solid var(--blue)}
.result-hero{text-align:center;padding:20px 0 30px}
.result-hero .score{font-family:'Fraunces',serif;font-size:56px;font-weight:700;color:var(--navy)}
.result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:20px 0}
.review-item{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.review-item .qa-line{font-size:13.5px;margin-top:4px}
.review-item .qa-line.wrong{color:#B3261E}
.review-item .qa-line.right{color:#0E7A6C}

/* Progress */
.bar-track{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px}
.prog-row{margin-bottom:16px}
.prog-row .pr-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:2px}
.weak-list{display:grid;gap:8px;margin-top:10px}
.weak-item{display:flex;justify-content:space-between;align-items:center;background:var(--paper);padding:12px 14px;border-radius:12px;font-size:14px}

/* Study hacks */
.hack-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.hack-item summary{font-weight:700;font-size:15.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.hack-item summary::-webkit-details-marker{display:none}
.hack-item summary::after{content:"↓";color:var(--teal)}
.hack-item[open] summary::after{content:"↑"}
.hack-item .body{margin-top:12px;font-size:14.5px;color:#26314A}
.hack-item .body ul{margin:8px 0 0;padding-left:20px}
.hack-item .body li{margin-bottom:6px}

/* Roadmap */
.roadmap-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.roadmap-item:first-child{border-top:none}
.roadmap-phase{background:var(--paper);border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted);flex:none}

/* misc */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--paper);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--navy)}

@media (max-width: 880px){
  .hero{grid-template-columns:1fr}
  .who-strip{grid-template-columns:1fr}
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .main-col{padding-bottom:80px}
  .view{padding:14px 16px 30px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>

const TOPICS = {
biology: [
  {id:"bio-cell", subject:"biology", title:"Cell Structure & Organelles", icon:"🧬",
   tag:"Cell Biology",
   explanation:"Every living thing is built from cells — tiny, self-contained units that carry out the jobs of life. Inside each cell, organelles act like specialised departments: the nucleus stores instructions (DNA), mitochondria generate energy, ribosomes build proteins, and the cell membrane controls what enters and leaves.",
   goingDeeper:"Each organelle's structure closely matches its job. The rough endoplasmic reticulum is studded with ribosomes and feeds proteins toward the Golgi apparatus, which then packages and addresses them — much like a shipping department labelling parcels for their final destination inside or outside the cell. Lysosomes act as the cell's clean-up crew, containing enzymes that break down waste and worn-out parts, while the cytoskeleton is an internal scaffolding of protein fibres that gives the cell shape and lets structures move within it. A cell with a fault in any one of these departments — say, a lysosome that can't break down waste — can build up damage over time, which is the basis of several rare inherited storage disorders.",
   analogy:"Think of a cell like a small factory: the nucleus is the head office holding the blueprints, mitochondria are the power plant, and the membrane is the security gate.",

     {front:"Where is DNA stored in a human cell?", back:"In the nucleus."}
   ]},
  {id:"bio-osmosis", subject:"biology", title:"Osmosis & Membrane Transport", icon:"💧",
   tag:"Cell Biology",
   explanation:"Osmosis is the movement of water molecules from a region of higher water concentration to a region of lower water concentration, through a selectively permeable membrane, until equilibrium is reached.",
   goingDeeper:"Osmosis is really just diffusion applied specifically to water, so the same 'high to low' logic applies — but because water usually moves opposite to where the solute is concentrated, it can be easy to get direction confused. A useful check: water always moves toward the side with more dissolved particles, because that side has proportionally less free water. This is why doctors are so precise about IV fluid concentrations — a solution that's isotonic to blood plasma (roughly matching the body's own solute concentration) keeps cells at a stable size, while getting the concentration wrong in either direction can cause real harm within minutes.",
   analogy:"Imagine two rooms connected by a door only water molecules can pass through. Water moves from the crowded room to the emptier one until both feel similarly balanced.",
   keyTerms:["Solvent","Solute","Concentration gradient","Selectively permeable membrane","Isotonic","Hypertonic","Hypotonic"],
   example:"When red blood cells are placed in pure water (hypotonic), water moves into the cells by osmosis, and the cells can swell or burst.",
   medicalConnection:"Osmosis explains why IV fluids must be carefully balanced — an incorrectly concentrated fluid can cause red blood cells to swell or shrink dangerously.",
   memoryTrick:"\"Osmosis moves water to where the solute is boss\" — water follows the higher solute concentration.",
   commonMistake:"Many students think osmosis moves solutes; it specifically describes the movement of water (solvent) across a membrane.",
   testYourself:[
     {q:"Osmosis describes the movement of:", options:["Solutes","Water","Proteins","Gases"], answer:1, explain:"Osmosis is specifically about water movement across a selectively permeable membrane."},
     {q:"A red blood cell placed in a hypertonic solution will most likely:", options:["Swell","Shrink","Stay the same","Divide"], answer:1, explain:"Water leaves the cell toward the higher solute concentration outside, causing it to shrink."},
     {q:"Which term describes a membrane that allows some substances through but not others?", options:["Impermeable","Selectively permeable","Rigid","Elastic"], answer:1, explain:"A selectively permeable membrane allows certain molecules (like water) through while restricting others."}
   ],
   flashcards:[
     {front:"Define osmosis.", back:"Movement of water across a selectively permeable membrane from high to low water concentration."},
     {front:"What happens to a cell in a hypotonic solution?", back:"Water enters the cell, causing it to swell (and potentially burst)."},
     {front:"What is a hypertonic solution?", back:"A solution with a higher solute concentration than the cell's interior."}
   ]},
  {id:"bio-dna", subject:"biology", title:"DNA Replication", icon:"🧬",
   tag:"Genetics & Molecular Biology",
   explanation:"Before a cell divides, it must copy its DNA so each new cell receives a complete set of genetic instructions. DNA replication is semi-conservative: each new DNA molecule contains one original strand and one newly made strand.",
   goingDeeper:"Replication doesn't happen at just one spot along the DNA molecule — in a human chromosome, it starts simultaneously at thousands of points called origins of replication, then spreads outward in both directions from each one, like several photocopiers working through the same book at once from different starting pages. This is what allows a cell to copy roughly 3 billion DNA base pairs during a single cell cycle without running out of time. DNA polymerase also has a limited 'proofreading' ability, catching and correcting many of its own mistakes as it goes — one reason why replication is remarkably accurate, with only about one uncorrected error per billion bases copied.",
   analogy:"It's like photocopying a two-page contract by using each original page as a template for a new matching page — the new document keeps one old page and one fresh copy.",
   keyTerms:["DNA polymerase","Base pairing","Semi-conservative","Template strand","Helicase"],
   example:"Helicase unwinds the double helix, and DNA polymerase adds new complementary bases (A-T, C-G) to build two new strands.",
   medicalConnection:"Errors during DNA replication can cause mutations; understanding this process underlies how some cancers develop and how certain drugs target rapidly dividing cells.",
   memoryTrick:"\"Semi-conservative = save one, make one\" — each new molecule keeps one old strand.",
   commonMistake:"Students sometimes think replication creates two entirely new strands; in fact, one strand from the original molecule is always conserved.",
   testYourself:[
     {q:"DNA replication is described as semi-conservative because:", options:["No original strands remain","Each new molecule has one old and one new strand","Only RNA is produced","Replication only occurs once"], answer:1, explain:"Semi-conservative replication means each daughter molecule retains one parental strand."},
     {q:"Which enzyme unwinds the DNA double helix during replication?", options:["DNA polymerase","Helicase","Ribosome","Ligase"], answer:1, explain:"Helicase breaks the hydrogen bonds between base pairs to unwind the helix."},
     {q:"Adenine pairs with which base?", options:["Cytosine","Guanine","Thymine","Uracil"], answer:2, explain:"In DNA, adenine (A) pairs with thymine (T)."}
   ],
   flashcards:[
     {front:"What does 'semi-conservative' mean in DNA replication?", back:"Each new DNA molecule contains one original strand and one newly synthesised strand."},
     {front:"What enzyme adds new bases during replication?", back:"DNA polymerase."},
     {front:"Which bases pair together in DNA?", back:"Adenine–Thymine and Cytosine–Guanine."}
   ]},
  {id:"bio-membrane", subject:"biology", title:"The Cell Membrane", icon:"🧫",
   tag:"Cell Biology",
   explanation:"The cell membrane (plasma membrane) is a thin, flexible boundary made mainly of a phospholipid bilayer with embedded proteins. It separates the cell's internal environment from the outside while controlling what substances can pass through — this is often described by the fluid mosaic model, since the membrane behaves like a flexible, moving mosaic of lipids and proteins.",
   goingDeeper:"Not every protein embedded in the membrane does the same job. Some act as channels, forming a pore that lets specific ions pass through; others are carriers, changing shape to shuttle a molecule across; and some act purely as receptors, recognising a signal without transporting anything at all. Cholesterol molecules are also woven into the membrane of animal cells, sitting between the phospholipids to keep the membrane from becoming too stiff in the cold or too fluid in the heat — a kind of built-in temperature buffer.",
   analogy:"Think of it as a security fence with a phospholipid \"wall\" and protein \"gates\" that decide what's allowed in or out, rather than a solid, unmoving barrier.",
   keyTerms:["Phospholipid bilayer","Fluid mosaic model","Membrane protein","Hydrophobic tail","Hydrophilic head"],
   example:"Water-soluble glucose needs a specific transport protein to cross the membrane, while fat-soluble hormones can pass directly through the lipid bilayer.",
   medicalConnection:"Whether a drug is lipid-soluble (crosses membranes directly) or needs a transport protein affects how it is absorbed and dosed — a concept that becomes important throughout pharmacology.",
   memoryTrick:"\"Heads love water, tails hide from it\" — phospholipid heads face outward toward water, tails face inward away from it.",
   commonMistake:"Thinking of the membrane as a solid, unmoving wall — it is actually fluid, with proteins and lipids able to drift within it.",
   testYourself:[
     {q:"The cell membrane is mainly composed of a bilayer of:", options:["Proteins","Phospholipids","Carbohydrates","Nucleic acids"], answer:1, explain:"The phospholipid bilayer forms the basic structure of the cell membrane."},
     {q:"The 'fluid mosaic model' describes the membrane as:", options:["A rigid, fixed wall","A flexible structure with moving proteins and lipids","A solid protein sheet","A single layer of carbohydrate"], answer:1, explain:"The fluid mosaic model reflects the membrane's flexible, ever-shifting arrangement of components."},
     {q:"Why do phospholipid heads face outward toward water?", options:["They are hydrophobic","They are hydrophilic","They contain no charge","They repel all molecules"], answer:1, explain:"Phospholipid heads are hydrophilic (water-loving), so they orient toward watery environments inside and outside the cell."}
   ],
   flashcards:[
     {front:"What is the main structural component of the cell membrane?", back:"A phospholipid bilayer with embedded proteins."},
     {front:"What does the fluid mosaic model describe?", back:"A flexible membrane where proteins and lipids can move within the layer."},
     {front:"Why can fat-soluble substances cross the membrane easily?", back:"They can pass directly through the hydrophobic lipid bilayer without needing a transport protein."}
   ]},
  {id:"bio-diffusion", subject:"biology", title:"Diffusion", icon:"💨",
   tag:"Cell Biology",
   explanation:"Diffusion is the movement of particles (such as gases or dissolved substances) from an area of higher concentration to an area of lower concentration, down their concentration gradient, until the particles are evenly spread out. It requires no energy input from the cell.",
   goingDeeper:"Diffusion rate isn't constant — it depends on the steepness of the concentration gradient, the temperature, and the surface area available for exchange. This is exactly why the lungs are built the way they are: millions of tiny alveoli create an enormous total surface area (roughly the size of a tennis court, folded into the chest), which dramatically speeds up how quickly oxygen and carbon dioxide can diffuse across. Diseases that damage or thicken alveolar walls reduce that effective surface area, which is one reason conditions like pneumonia or emphysema leave patients short of oxygen even though the diffusion process itself hasn't changed.",
   analogy:"It's like a drop of ink spreading through a glass of water — the ink molecules naturally spread from where they're concentrated to where they're not, without anyone stirring.",
   keyTerms:["Concentration gradient","Passive process","Partial pressure","Equilibrium"],
   example:"Oxygen diffuses from the air in the lungs (high concentration) into the blood (lower concentration) across the thin walls of the alveoli.",
   medicalConnection:"Gas exchange in the lungs and the movement of nutrients between blood and tissues both rely on diffusion — conditions that thicken these exchange surfaces (like some lung diseases) can slow diffusion and reduce oxygen delivery.",
   memoryTrick:"\"Diffusion needs no fuel — high to low is the rule.\"",
   commonMistake:"Confusing diffusion with active transport — diffusion is passive (no energy required) and always moves substances down their concentration gradient.",
   testYourself:[
     {q:"Diffusion moves particles from:", options:["Low to high concentration","High to low concentration","Only sideways","Only through active transport"], answer:1, explain:"Diffusion moves particles down their concentration gradient, from high to low concentration."},
     {q:"Diffusion is best described as a:", options:["Passive process needing no energy","Active process requiring ATP","Process only found in animals","Type of active transport"], answer:0, explain:"Diffusion happens naturally without the cell needing to supply energy."},
     {q:"Oxygen diffusing from the lungs into the blood is an example of movement:", options:["Against the concentration gradient","Down the concentration gradient","Requiring a carrier protein always","Using ATP"], answer:1, explain:"Oxygen moves from an area of higher concentration (the alveoli) to lower concentration (the blood), down its gradient."}
   ],
   flashcards:[
     {front:"Define diffusion.", back:"The passive movement of particles from high to low concentration until evenly spread."},
     {front:"Does diffusion require energy?", back:"No — it is a passive process."},
     {front:"Give a medical example of diffusion.", back:"Oxygen diffusing from the alveoli into the blood in the lungs."}
   ]},
  {id:"bio-activetransport", subject:"biology", title:"Active Transport", icon:"🔋",
   tag:"Cell Biology",
   explanation:"Active transport is the movement of substances across a membrane from a region of lower concentration to a region of higher concentration — against the concentration gradient. Because this goes against the natural flow, it requires energy, usually supplied by ATP, and uses carrier proteins.",
   goingDeeper:"Active transport comes in two flavours. Primary active transport (like the sodium-potassium pump) uses ATP directly to move a substance against its gradient. Secondary active transport instead uses the energy stored in one substance's gradient (often sodium, built up by the sodium-potassium pump) to drag a second substance along with it — a bit like using the momentum of water flowing downhill to also pull a smaller object uphill alongside it. Glucose absorption in the small intestine largely works this second way, which is part of why sodium and glucose are often given together in oral rehydration solutions.",
   analogy:"If diffusion is water flowing downhill on its own, active transport is a pump pushing water uphill — it takes real energy to work against the natural direction.",
   keyTerms:["Carrier protein","ATP","Concentration gradient","Sodium-potassium pump"],
   example:"The sodium-potassium pump actively moves sodium ions out of a nerve cell and potassium ions in, both against their concentration gradients, using ATP.",
   medicalConnection:"The sodium-potassium pump is essential for nerve impulse transmission and muscle contraction — many drugs and toxins affect the body by disrupting this pump.",
   memoryTrick:"\"Active transport = against the current, costs some fuel.\"",
   commonMistake:"Assuming any movement across a membrane needing a protein is automatically active transport — some protein-assisted movement (facilitated diffusion) is still passive and needs no energy.",
   testYourself:[
     {q:"Active transport moves substances:", options:["Down their concentration gradient","Against their concentration gradient","Only within the nucleus","Only in plant cells"], answer:1, explain:"Active transport moves substances against their concentration gradient, from low to high concentration."},
     {q:"Active transport requires energy typically supplied by:", options:["Water","ATP","Oxygen alone","Glucose directly, unconverted"], answer:1, explain:"ATP supplies the energy needed for active transport processes."},
     {q:"The sodium-potassium pump is an example of:", options:["Diffusion","Osmosis","Active transport","Passive transport"], answer:2, explain:"This pump moves ions against their gradients and requires ATP, making it active transport."}
   ],
   flashcards:[
     {front:"How does active transport differ from diffusion?", back:"Active transport moves substances against their concentration gradient and requires energy (ATP); diffusion is passive."},
     {front:"What does the sodium-potassium pump do?", back:"Actively moves sodium out and potassium into a cell, against their gradients, using ATP."},
     {front:"What is required for active transport to occur?", back:"A carrier protein and a source of energy (usually ATP)."}
   ]},
  {id:"bio-cellcycle", subject:"biology", title:"The Cell Cycle & Mitosis", icon:"🔁",
   tag:"Cell Biology",
   explanation:"The cell cycle is the series of stages a cell goes through as it grows and divides: interphase (growth and DNA replication), followed by mitosis (division of the nucleus) and cytokinesis (division of the cytoplasm). Mitosis produces two genetically identical daughter cells, used for growth and repair.",
   goingDeeper:"Interphase itself has three distinct sub-stages: a growth phase, a phase where DNA is actually copied, and a second growth phase where the cell prepares the proteins and structures it will need to divide. The cell cycle is also tightly monitored by internal 'checkpoints' that pause the cycle if something is wrong — for example, if DNA damage is detected, or if not all chromosomes are properly attached before division. Cancer frequently involves a fault in these checkpoint systems, which is why cells can end up dividing even when they shouldn't.",
   analogy:"Think of the cell cycle like preparing and running a relay race: interphase is training and getting ready (growing, copying DNA), and mitosis is the actual handover, splitting everything evenly into two new runners (cells).",
   keyTerms:["Interphase","Mitosis","Cytokinesis","Chromatid","Daughter cell"],
   example:"Skin cells constantly go through the cell cycle to replace damaged or dead cells, producing genetically identical new cells through mitosis.",
   medicalConnection:"Cancer often results from a loss of control over the cell cycle, causing cells to divide uncontrollably — many cancer treatments specifically target dividing cells during mitosis.",
   memoryTrick:"\"Interphase grows it, mitosis shows it (splits it) into two.\"",
   commonMistake:"Thinking mitosis is the entire cell cycle — mitosis is only one phase; most of a cell's time is actually spent in interphase.",
   testYourself:[
     {q:"During which phase does a cell spend most of its time and copy its DNA?", options:["Mitosis","Cytokinesis","Interphase","Meiosis"], answer:2, explain:"Interphase is when the cell grows and replicates its DNA before division."},
     {q:"Mitosis produces daughter cells that are:", options:["Genetically identical to the parent","Half the chromosome number of the parent","Always mutated","Only found in bacteria"], answer:0, explain:"Mitosis creates two genetically identical daughter cells, useful for growth and repair."},
     {q:"Cytokinesis refers to:", options:["Copying of DNA","Division of the nucleus","Division of the cytoplasm","Formation of chromosomes"], answer:2, explain:"Cytokinesis is the physical splitting of the cytoplasm into two separate cells after the nucleus has divided."}
   ],
   flashcards:[
     {front:"What are the main stages of the cell cycle?", back:"Interphase, mitosis, and cytokinesis."},
     {front:"What is produced by mitosis?", back:"Two genetically identical daughter cells."},
     {front:"Why is uncontrolled cell cycle progression medically important?", back:"It is a key feature of cancer, where cells divide without normal control."}
   ]},
  {id:"bio-meiosis", subject:"biology", title:"Meiosis", icon:"🧬",
   tag:"Cell Biology",
   explanation:"Meiosis is a special type of cell division that produces gametes (sperm and egg cells) with half the number of chromosomes of the parent cell. It involves two rounds of division, resulting in four genetically varied daughter cells, which restores the full chromosome number when two gametes combine at fertilisation.",
   goingDeeper:"Genetic variation in meiosis comes from two separate sources working together. Crossing over shuffles segments of DNA between paired chromosomes early in the process, creating new combinations that weren't in either parent. Independent assortment then randomly determines which chromosome from each pair ends up in a given gamete. Together, these two mechanisms mean that, aside from identical twins, no two gametes — and no two siblings — end up with exactly the same genetic combination, even from the same two parents.",
   analogy:"If mitosis is photocopying a document exactly, meiosis is more like splitting a deck of cards in half twice and shuffling along the way — the result is four different, smaller hands rather than one identical copy.",
   keyTerms:["Gamete","Haploid","Diploid","Genetic variation","Crossing over"],
   example:"Human body cells are diploid (46 chromosomes), but through meiosis, sperm and egg cells become haploid (23 chromosomes each), so fertilisation restores the full 46.",
   medicalConnection:"Errors during meiosis can lead to gametes with an incorrect number of chromosomes, which is the basis of some genetic conditions, such as those involving an extra or missing chromosome.",
   memoryTrick:"\"Meiosis halves it, mitosis matches it\" — meiosis reduces chromosome number by half; mitosis keeps it the same.",
   commonMistake:"Confusing meiosis with mitosis — meiosis specifically produces gametes with half the chromosome number and genetic variation; mitosis does not.",
   testYourself:[
     {q:"Meiosis produces cells with:", options:["The same chromosome number as the parent","Half the chromosome number of the parent","Double the chromosome number","No chromosomes at all"], answer:1, explain:"Meiosis is a reduction division, halving the chromosome number to produce haploid gametes."},
     {q:"How many daughter cells are produced by meiosis?", options:["One","Two","Four","Eight"], answer:2, explain:"Meiosis involves two divisions, producing four genetically varied daughter cells."},
     {q:"Human gametes (sperm and egg) are described as:", options:["Diploid","Haploid","Triploid","Non-nucleated only"], answer:1, explain:"Gametes are haploid, carrying half the chromosome number, so fertilisation restores the full diploid number."}
   ],
   flashcards:[
     {front:"What is the purpose of meiosis?", back:"To produce gametes (sperm and egg cells) with half the chromosome number, for sexual reproduction."},
     {front:"What does 'haploid' mean?", back:"Having a single set of chromosomes (half the normal diploid number)."},
     {front:"How many chromosomes are in a human gamete?", back:"23 (half of the usual 46 in body cells)."}
   ]},
  {id:"bio-cellcomm", subject:"biology", title:"Cell Communication", icon:"📡",
   tag:"Cell Biology",
   explanation:"Cells communicate with each other using chemical signals, such as hormones or neurotransmitters, which bind to specific receptor proteins on or inside a target cell. This binding triggers a response inside the cell, allowing coordinated activity across tissues and organs.",
   goingDeeper:"Receptors themselves generally fall into two broad locations: some sit on the outer cell membrane, binding signals (like most hormones and neurotransmitters) that can't cross the membrane on their own; others sit inside the cell, in the cytoplasm or nucleus, and bind signals (like steroid hormones) that are small and fat-soluble enough to diffuse straight through the membrane. The type and location of a receptor affects how fast a response happens — membrane receptors typically trigger changes within seconds, while receptors that act inside the nucleus (switching genes on or off) tend to produce effects over hours.",
   analogy:"It's like sending a key (the signal molecule) that only fits one specific lock (the receptor) — only cells with the matching receptor will respond to that particular signal.",
   keyTerms:["Signal molecule","Receptor","Target cell","Hormone","Neurotransmitter"],
   example:"Insulin released by the pancreas travels through the blood and binds to insulin receptors on muscle and liver cells, signalling them to take up glucose.",
   medicalConnection:"Many diseases and drug treatments work at the level of cell communication — for example, some medications work by blocking or mimicking specific receptors to change how cells respond.",
   memoryTrick:"\"Signal, receptor, response\" — the three-step chain of every cell communication event.",
   commonMistake:"Assuming every cell responds to every signal — only cells with the matching receptor for a specific signal molecule will respond.",
   testYourself:[
     {q:"A signal molecule triggers a response by binding to a:", options:["Ribosome","Receptor","Nucleus directly","Cell wall"], answer:1, explain:"Signal molecules bind to specific receptor proteins on or in the target cell to trigger a response."},
     {q:"Insulin is an example of a:", options:["Receptor","Signal molecule (hormone)","Structural protein","Nucleic acid"], answer:1, explain:"Insulin is a hormone — a chemical signal molecule that travels through the blood to target cells."},
     {q:"Why does only a specific target cell respond to a given hormone?", options:["All cells respond equally","Only cells with the matching receptor respond","Hormones only affect the cell that made them","Receptors are found only in the nucleus"], answer:1, explain:"A hormone can only trigger a response in cells that carry its specific matching receptor."}
   ],
   flashcards:[
     {front:"What is a receptor's role in cell communication?", back:"It recognises and binds a specific signal molecule, triggering a response in the target cell."},
     {front:"Give an example of a chemical signal used in cell communication.", back:"A hormone (e.g. insulin) or a neurotransmitter."},
     {front:"Why don't all cells respond to every hormone?", back:"Only cells with the matching receptor for that hormone will respond."}
   ]},
  {id:"bio-dnarna", subject:"biology", title:"DNA & RNA Structure", icon:"🧬",
   tag:"Genetics & Molecular Biology",
   explanation:"DNA (deoxyribonucleic acid) stores genetic information as a sequence of bases along a double-stranded helix. RNA (ribonucleic acid) is usually single-stranded and helps carry out the instructions stored in DNA, particularly in making proteins. Both are built from repeating units called nucleotides.",
   goingDeeper:"Beyond storing the blueprint, RNA turns out to come in several specialised forms beyond the messenger RNA that carries copied instructions. Transfer RNA (tRNA) physically ferries amino acids to the ribosome during protein building, and ribosomal RNA (rRNA) forms much of the ribosome's own structure. This means DNA is best thought of as the single master archive, while different types of RNA each play a distinct working role in actually turning that archived information into a working protein.",
   analogy:"DNA is like a master recipe book kept safely in the kitchen (nucleus); RNA is like a photocopied recipe card carried out to the workstation (ribosome) so the original book doesn't have to leave.",
   keyTerms:["Nucleotide","Double helix","Base pairing","Ribose","Deoxyribose"],
   example:"DNA contains the bases adenine, thymine, cytosine and guanine, while RNA replaces thymine with uracil.",
   medicalConnection:"Some viruses (like many that cause the common cold) store their genetic material as RNA instead of DNA, which affects how quickly they mutate and how vaccines and treatments are designed against them.",
   memoryTrick:"\"DNA is Double and stays Down (in the nucleus); RNA Roams (out to the ribosome) and is single.\"",
   commonMistake:"Thinking DNA and RNA are interchangeable — DNA is typically double-stranded and stores information long-term, while RNA is usually single-stranded and more short-lived, used to carry out instructions.",
   testYourself:[
     {q:"DNA is typically described as:", options:["Single-stranded","Double-stranded (a double helix)","Triple-stranded","Not stranded at all"], answer:1, explain:"DNA forms a double helix made of two complementary strands."},
     {q:"Which base is found in RNA but not DNA?", options:["Adenine","Thymine","Uracil","Guanine"], answer:2, explain:"RNA uses uracil in place of the thymine found in DNA."},
     {q:"The repeating building blocks of both DNA and RNA are called:", options:["Amino acids","Nucleotides","Fatty acids","Monosaccharides"], answer:1, explain:"Nucleotides are the basic repeating units that make up both DNA and RNA."}
   ],
   flashcards:[
     {front:"What shape does DNA typically form?", back:"A double helix."},
     {front:"What base replaces thymine in RNA?", back:"Uracil."},
     {front:"What are DNA and RNA built from?", back:"Repeating units called nucleotides."}
   ]},
  {id:"bio-geneexpression", subject:"biology", title:"Transcription & Translation", icon:"🧫",
   tag:"Genetics & Molecular Biology",
   explanation:"Gene expression is the process of using DNA instructions to build a protein. It happens in two main steps: transcription, where a gene's DNA sequence is copied into messenger RNA (mRNA), and translation, where that mRNA is read at the ribosome to assemble a specific chain of amino acids, according to the genetic code.",
   goingDeeper:"Not every part of a gene's initial RNA copy ends up in the final protein-coding message. In human cells, genes typically contain 'introns' (non-coding sections) mixed between 'exons' (coding sections); after transcription, a process called splicing removes the introns and joins the exons together before the mRNA leaves the nucleus. This splicing step also allows a single gene to sometimes produce more than one version of a protein, depending on which exons are included — one reason the human genome can produce a far greater variety of proteins than its total gene count alone would suggest.",
   analogy:"Transcription is like copying a recipe from a cookbook (DNA) onto a notecard (mRNA) to take to the kitchen; translation is the chef reading that notecard and actually assembling the dish (protein) from the ingredients (amino acids).",
   keyTerms:["mRNA","Ribosome","Genetic code","Codon","Amino acid"],
   example:"A sequence of three mRNA bases (a codon) specifies one amino acid — the codon AUG signals the start of translation and codes for the amino acid methionine.",
   medicalConnection:"Many genetic disorders result from errors in the DNA sequence that disrupt transcription or translation, producing a faulty or missing protein.",
   memoryTrick:"\"Transcription: DNA to RNA. Translation: RNA to protein.\" Follow the order alphabetically: transcription before translation.",
   commonMistake:"Mixing up the two steps — transcription happens first (making mRNA from DNA), and translation happens second (making protein from mRNA).",
   testYourself:[
     {q:"Transcription involves copying information from DNA into:", options:["A protein","mRNA","An amino acid","A ribosome"], answer:1, explain:"Transcription produces a messenger RNA (mRNA) copy of a gene's DNA sequence."},
     {q:"Translation takes place at the:", options:["Nucleus","Mitochondria","Ribosome","Cell membrane"], answer:2, explain:"Ribosomes read the mRNA sequence and assemble the corresponding protein during translation."},
     {q:"A codon is a sequence of how many mRNA bases coding for one amino acid?", options:["One","Two","Three","Four"], answer:2, explain:"Each codon consists of three mRNA bases, specifying a single amino acid (or a stop signal)."}
   ],
   flashcards:[
     {front:"What is transcription?", back:"Copying a gene's DNA sequence into messenger RNA (mRNA)."},
     {front:"What is translation?", back:"Reading mRNA at the ribosome to assemble a chain of amino acids into a protein."},
     {front:"How many bases make up one codon?", back:"Three."}
   ]},
  {id:"bio-geneschromosomes", subject:"biology", title:"Genes & Chromosomes", icon:"🧬",
   tag:"Genetics & Molecular Biology",
   explanation:"A gene is a section of DNA that contains the instructions for a specific trait or protein. Genes are organised along chromosomes, which are tightly coiled structures of DNA found in the nucleus. Humans typically have 46 chromosomes, arranged in 23 pairs.",
   goingDeeper:"Chromosomes aren't just loose DNA — the roughly two metres of DNA in a single human cell is tightly wound around proteins called histones, like thread wrapped around a spool, then coiled further into the compact structure visible under a microscope during cell division. This packaging isn't just for storage efficiency: how tightly a region of DNA is wound can switch nearby genes on or off, since tightly packed DNA is harder for the cell's machinery to access and read.",
   analogy:"If DNA is a long string of text, a chromosome is like a whole chapter of a book, and a gene is one specific instruction within that chapter.",
   keyTerms:["Gene","Chromosome","Allele","Locus","Homologous pair"],
   example:"Humans have 23 pairs of chromosomes — one member of each pair inherited from each parent — for a total of 46 chromosomes in most body cells.",
   medicalConnection:"Some genetic conditions, such as Down syndrome, result from having an abnormal number of chromosomes (an extra chromosome 21), showing how chromosome number directly affects health.",
   memoryTrick:"\"Genes are sentences, chromosomes are chapters\" — a helpful scale for remembering how the two relate.",
   commonMistake:"Thinking genes and chromosomes are the same thing — a chromosome contains many genes, not just one.",
   testYourself:[
     {q:"A gene is best described as:", options:["An entire chromosome","A section of DNA coding for a trait or protein","A type of protein","A cell organelle"], answer:1, explain:"A gene is a specific segment of DNA containing instructions for a particular trait or protein."},
     {q:"How many chromosomes are typically found in a human body cell?", options:["23","46","92","4"], answer:1, explain:"Human body cells typically contain 46 chromosomes, arranged in 23 pairs."},
     {q:"Down syndrome is caused by:", options:["A missing gene","An extra copy of chromosome 21","A mutation in mitochondria only","A missing chromosome"], answer:1, explain:"Down syndrome results from an extra copy of chromosome 21 (trisomy 21)."}
   ],
   flashcards:[
     {front:"What is the relationship between genes and chromosomes?", back:"A chromosome is a coiled structure of DNA containing many genes."},
     {front:"How many chromosomes do humans typically have?", back:"46, arranged in 23 pairs."},
     {front:"What causes Down syndrome?", back:"An extra copy of chromosome 21."}
   ]},
  {id:"bio-mendelian", subject:"biology", title:"Mendelian Genetics & Inheritance", icon:"🌱",
   tag:"Genetics & Molecular Biology",
   explanation:"Mendelian genetics describes how traits are passed from parents to offspring through alleles — different versions of a gene. A dominant allele will show its effect even if only one copy is present, while a recessive allele only shows its effect when two copies are present.",
   goingDeeper:"Not all inheritance follows a simple dominant/recessive pattern. In incomplete dominance, neither allele fully masks the other, producing a blended intermediate trait; in codominance, both alleles are fully expressed at once, side by side (as seen with certain blood types). Punnett squares remain a useful tool for predicting the probability of offspring genotypes and phenotypes in all of these cases, by laying out every possible combination of parental alleles in a simple grid.",
   analogy:"Think of a dominant allele as a louder voice in a room — even with just one person speaking (one dominant allele), it's heard over everything else; a recessive allele only \"speaks up\" when it's the only voice left (two recessive copies).",
   keyTerms:["Allele","Dominant","Recessive","Genotype","Phenotype","Punnett square"],
   example:"If brown eye colour is dominant (B) and blue is recessive (b), a person with genotype Bb will have brown eyes (phenotype), since the dominant allele masks the recessive one.",
   medicalConnection:"Understanding dominant and recessive inheritance helps explain how certain genetic conditions, like cystic fibrosis (recessive), are passed through families even when parents show no symptoms themselves.",
   memoryTrick:"\"Dominant shouts, recessive whispers\" — one dominant allele is enough to be heard (expressed).",
   commonMistake:"Assuming a recessive trait is automatically rare or weak — recessive simply means it needs two copies to be expressed, not that it is uncommon.",
   testYourself:[
     {q:"A dominant allele shows its effect when:", options:["Two copies are present","At least one copy is present","No copies are present","Only in females"], answer:1, explain:"A dominant allele is expressed even with just one copy present."},
     {q:"A recessive trait appears in the phenotype only when:", options:["One dominant allele is present","Two recessive alleles are present","The gene is on a chromosome","The trait is common"], answer:1, explain:"Recessive traits require two copies of the recessive allele to be expressed."},
     {q:"Genotype refers to:", options:["The physical appearance of a trait","The genetic makeup for a trait","The chromosome number","The type of cell division"], answer:1, explain:"Genotype describes the specific combination of alleles an organism carries for a trait."}
   ],
   flashcards:[
     {front:"What is the difference between genotype and phenotype?", back:"Genotype is the genetic makeup (alleles); phenotype is the observable trait it produces."},
     {front:"When is a recessive trait expressed?", back:"Only when two copies of the recessive allele are present."},
     {front:"Give a medical example of recessive inheritance.", back:"Cystic fibrosis, which requires two recessive alleles to be expressed."}
   ]},
  {id:"bio-mutations", subject:"biology", title:"Mutations & Genetic Variation", icon:"🧬",
   tag:"Genetics & Molecular Biology",
   explanation:"A mutation is a change in the DNA sequence. Mutations can occur naturally or be caused by external factors, and can be harmless, harmful, or occasionally beneficial. Genetic variation refers to the differences in DNA sequence between individuals, which arises partly from mutations and partly from how genes are combined during reproduction.",
   goingDeeper:"Mutations are usually grouped by their effect on the DNA sequence: substitutions swap one base for another, insertions add extra bases, and deletions remove bases. Insertions and deletions are often more disruptive than substitutions, because unless they occur in multiples of three, they shift the 'reading frame' used to translate the sequence into amino acids — causing everything downstream of the mutation to be misread, similar to deleting one letter from a sentence and watching every word after it scramble.",
   analogy:"A mutation is like a single typo in a very long instruction manual — most typos don't change much, but sometimes one small change alters the meaning of an entire instruction.",
   keyTerms:["Mutation","Genetic variation","Mutagen","Point mutation"],
   example:"Sickle cell disease is caused by a single point mutation in the gene coding for haemoglobin, which changes the shape of red blood cells.",
   medicalConnection:"Some mutations directly cause genetic diseases, while others simply contribute to normal variation between people, such as differences in eye colour or blood type.",
   memoryTrick:"\"A mutation is a change in the code, not always a problem to decode\" — most mutations are neutral, not harmful.",
   commonMistake:"Assuming all mutations are harmful — many have no noticeable effect, and a small number can even be beneficial.",
   testYourself:[
     {q:"A mutation is best defined as:", options:["A normal cell division","A change in the DNA sequence","A protein produced by cells","A type of hormone"], answer:1, explain:"A mutation is any change in the sequence of DNA."},
     {q:"Sickle cell disease results from:", options:["A missing chromosome","A single point mutation in the haemoglobin gene","A viral infection","An enzyme deficiency only"], answer:1, explain:"Sickle cell disease is caused by a specific point mutation altering haemoglobin structure."},
     {q:"Most mutations are:", options:["Always harmful","Always beneficial","Often neutral, with no noticeable effect","Impossible to occur naturally"], answer:2, explain:"The majority of mutations have little to no effect on an organism."}
   ],
   flashcards:[
     {front:"Define a mutation.", back:"A change in the DNA sequence."},
     {front:"What causes sickle cell disease?", back:"A single point mutation in the gene coding for haemoglobin."},
     {front:"Are most mutations harmful?", back:"No — most are neutral, with some harmful and a few beneficial."}
   ]},
  {id:"bio-carbslipids", subject:"biology", title:"Carbohydrates & Lipids", icon:"🍞",
   tag:"Biomolecules",
   explanation:"Carbohydrates and lipids are two major classes of biomolecules that provide energy and structure. Carbohydrates (sugars and starches) are a quick energy source built from simple sugar units. Lipids (fats and oils) store energy long-term and form key structural components, like the cell membrane.",
   goingDeeper:"Carbohydrates themselves range from simple monosaccharides (like glucose) to complex polysaccharides built from thousands of linked sugar units (like starch and glycogen). Lipids are similarly varied: triglycerides store energy, phospholipids build membranes, and steroid-based lipids (like cholesterol) serve as the backbone for several hormones. This is why 'fat' and 'lipid' aren't quite synonyms — lipids are a much broader category that includes far more than just stored body fat.",
   analogy:"Carbohydrates are like cash in your pocket — quick and easy to spend (use for energy); lipids are like a savings account — a longer-term energy store that takes more effort to access.",
   keyTerms:["Monosaccharide","Polysaccharide","Fatty acid","Glycogen","Triglyceride"],
   example:"Glucose (a monosaccharide) is used immediately for energy, while excess glucose is stored as glycogen in the liver and muscles for later use.",
   medicalConnection:"Understanding carbohydrate and lipid metabolism underlies conditions like diabetes (glucose regulation) and cardiovascular disease (lipid levels in the blood).",
   memoryTrick:"\"Carbs = quick energy, Lipids = long-term storage\" — remember their differing roles.",
   commonMistake:"Assuming all fats are unhealthy — lipids are essential biomolecules with vital roles, including forming cell membranes and storing energy.",
   testYourself:[
     {q:"Which biomolecule is the body's primary source of quick energy?", options:["Lipids","Carbohydrates","Nucleic acids","Minerals"], answer:1, explain:"Carbohydrates, especially glucose, provide a fast, readily available source of energy."},
     {q:"Glycogen is a stored form of:", options:["Fat","Glucose","Protein","DNA"], answer:1, explain:"Glycogen is a polysaccharide made of stored glucose units, found in the liver and muscles."},
     {q:"Lipids are an important structural part of the:", options:["Nucleus","Cell membrane","Ribosome","Chromosome"], answer:1, explain:"Phospholipids, a type of lipid, form the structural basis of the cell membrane."}
   ],
   flashcards:[
     {front:"What is the primary role of carbohydrates in the body?", back:"To provide a quick, readily available source of energy."},
     {front:"What is glycogen?", back:"A stored form of glucose, kept in the liver and muscles."},
     {front:"Name one structural role of lipids.", back:"Forming the phospholipid bilayer of the cell membrane."}
   ]},
  {id:"bio-proteinsnucleic", subject:"biology", title:"Proteins & Nucleic Acids", icon:"🧬",
   tag:"Biomolecules",
   explanation:"Proteins are large molecules made of chains of amino acids, folded into specific shapes that determine their function — from structural support to enzymes to transport molecules. Nucleic acids (DNA and RNA) store and transmit genetic information, built from chains of nucleotides.",
   goingDeeper:"A protein's structure is often described in four levels: its primary structure is simply the order of amino acids; its secondary structure is local folding into coils or sheets, held by hydrogen bonds; its tertiary structure is the overall 3D shape formed as the chain folds further; and some proteins have a quaternary structure, where multiple folded chains combine into one functional unit — haemoglobin, for example, is built from four separate folded chains working together as a single molecule.",
   analogy:"If amino acids are individual beads, a protein is a uniquely shaped necklace — the exact order and folding of the beads determines what job that particular necklace can do.",
   keyTerms:["Amino acid","Peptide bond","Protein folding","Nucleotide"],
   example:"Haemoglobin is a protein made of folded amino acid chains that specifically binds and carries oxygen in red blood cells.",
   medicalConnection:"Many diseases result from misfolded proteins (such as in some neurological conditions) or from faulty proteins produced due to genetic mutations.",
   memoryTrick:"\"Shape decides the job\" — a protein's specific 3D folded shape determines exactly what it can do.",
   commonMistake:"Thinking all proteins are structural (like muscle) — proteins also act as enzymes, hormones, transporters, and antibodies, among many other roles.",
   testYourself:[
     {q:"Proteins are built from chains of:", options:["Fatty acids","Amino acids","Monosaccharides","Nucleotides"], answer:1, explain:"Proteins are polymers of amino acids linked by peptide bonds."},
     {q:"A protein's function is mainly determined by its:", options:["Colour","Folded 3D shape","Location in the body only","Molecular weight alone"], answer:1, explain:"A protein's specific folded shape determines how it interacts with other molecules and what job it performs."},
     {q:"Haemoglobin's main function is to:", options:["Digest food","Carry oxygen in the blood","Store genetic information","Break down toxins"], answer:1, explain:"Haemoglobin is a protein specialised for binding and transporting oxygen."}
   ],
   flashcards:[
     {front:"What are proteins made of?", back:"Chains of amino acids, linked by peptide bonds and folded into a specific shape."},
     {front:"Why is protein folding important?", back:"A protein's shape determines its specific function."},
     {front:"What is haemoglobin's role?", back:"Carrying oxygen in red blood cells."}
   ]},
  {id:"bio-enzymesatp", subject:"biology", title:"Enzymes & ATP", icon:"⚙️",
   tag:"Biomolecules",
   explanation:"Enzymes are proteins that speed up (catalyse) biochemical reactions without being used up themselves, by lowering the activation energy needed. ATP (adenosine triphosphate) is the cell's main energy currency, storing energy in its chemical bonds that can be quickly released to power cellular processes.",
   goingDeeper:"Enzymes are highly sensitive to their environment: each has an optimum temperature and pH at which it works fastest, and moving too far from that optimum can distort the enzyme's shape (denaturing it) so it no longer fits its substrate. This is exactly why a high fever can be dangerous — body proteins, including essential enzymes, start to lose function as temperature rises too far above the normal optimum. ATP itself is constantly being recycled rather than stored in large amounts: a resting adult recycles roughly their own body weight in ATP over the course of a day.",
   analogy:"An enzyme is like a key that helps unlock a reaction faster without being consumed, while ATP is like small, ready-to-spend cash the cell uses to pay for any energy-requiring task.",
   keyTerms:["Enzyme","Substrate","Active site","Activation energy","ATP"],
   example:"The enzyme amylase breaks down starch into simpler sugars in the mouth and small intestine, working best at body temperature and a specific pH.",
   medicalConnection:"Many drugs work by either inhibiting or enhancing specific enzymes — for example, some blood pressure medications work by blocking a particular enzyme involved in regulating blood vessel constriction.",
   memoryTrick:"\"Enzymes speed it up, ATP powers it up.\"",
   commonMistake:"Thinking enzymes are used up in the reactions they catalyse — enzymes are not consumed and can be reused repeatedly.",
   testYourself:[
     {q:"Enzymes function mainly by:", options:["Being used up in reactions","Lowering the activation energy of reactions","Increasing reaction temperature","Destroying substrates permanently"], answer:1, explain:"Enzymes are biological catalysts that lower activation energy without being consumed."},
     {q:"ATP is best described as the cell's:", options:["Genetic material","Main energy currency","Main structural protein","Waste product"], answer:1, explain:"ATP stores and supplies the energy cells use to power their processes."},
     {q:"The specific molecule an enzyme acts on is called its:", options:["Product","Substrate","Cofactor","Catalyst"], answer:1, explain:"An enzyme's substrate is the specific molecule it binds to and acts upon at its active site."}
   ],
   flashcards:[
     {front:"What is the role of an enzyme?", back:"To speed up a biochemical reaction by lowering its activation energy, without being consumed."},
     {front:"What is ATP?", back:"Adenosine triphosphate — the cell's main energy currency."},
     {front:"What is a substrate?", back:"The specific molecule an enzyme acts upon."}
   ]},
  {id:"bio-tissues", subject:"biology", title:"Tissues & Body Organisation", icon:"🧩",
   tag:"Human Biology",
   explanation:"The human body is organised in levels: cells group together to form tissues (groups of similar cells performing a shared function), tissues combine to form organs, and organs work together in organ systems. This hierarchy allows complex functions to be carried out efficiently.",
   goingDeeper:"The body recognises four broad categories of tissue, each combined in different proportions to build every organ: epithelial tissue covers surfaces and lines cavities, connective tissue supports and binds structures together (including bone and blood), muscle tissue generates movement, and nervous tissue transmits electrical signals. Almost every organ in the body is a working combination of several of these tissue types, rather than being made of just one.",
   analogy:"Think of it like a company's structure: cells are individual employees, tissues are departments of similar workers, organs are whole offices combining departments, and organ systems are entire divisions working toward a shared goal.",
   keyTerms:["Cell","Tissue","Organ","Organ system","Organisation levels"],
   example:"Muscle tissue, connective tissue, and nervous tissue all combine within the heart (an organ) to enable it to pump blood as part of the cardiovascular system.",
   medicalConnection:"Understanding this hierarchy helps explain how disease can affect the body at different scales — from a single cell type, to a whole tissue, to an entire organ system.",
   memoryTrick:"\"Cells build tissues, tissues build organs, organs build systems\" — a simple ladder of increasing complexity.",
   commonMistake:"Confusing 'tissue' with 'organ' — a tissue is a group of similar cells, while an organ is typically made of several different tissue types working together.",
   testYourself:[
     {q:"What is a tissue?", options:["A single cell","A group of similar cells performing a shared function","An entire organ","A full organ system"], answer:1, explain:"A tissue is a collection of similar cells working together to perform a specific function."},
     {q:"Which is the correct order of body organisation, from simplest to most complex?", options:["Organ → Tissue → Cell → System","Cell → Tissue → Organ → System","System → Organ → Cell → Tissue","Tissue → System → Cell → Organ"], answer:1, explain:"The correct hierarchy runs: cell → tissue → organ → organ system."},
     {q:"The heart is an example of a(n):", options:["Tissue","Organ","Cell","Organ system"], answer:1, explain:"The heart is an organ, made of multiple tissue types working together."}
   ],
   flashcards:[
     {front:"What is the order of body organisation from simplest to most complex?", back:"Cell → tissue → organ → organ system."},
     {front:"Define a tissue.", back:"A group of similar cells performing a shared function."},
     {front:"Give an example of an organ made of multiple tissue types.", back:"The heart, made of muscle, connective, and nervous tissue."}
   ]},
  {id:"bio-organsystems", subject:"biology", title:"Major Organ Systems & Physiological Processes", icon:"🫀",
   tag:"Human Biology",
   explanation:"The human body relies on several major organ systems working together, each responsible for specific physiological processes: the cardiovascular system circulates blood, the respiratory system exchanges gases, the digestive system breaks down food, and the nervous system coordinates rapid responses, among others.",
   goingDeeper:"While each organ system has a primary role, most everyday physiological events actually involve several systems cooperating in sequence. A simple example: exercising increases the muscles' oxygen demand, so the nervous system detects this and signals the cardiovascular system to raise heart rate, while the respiratory system increases breathing rate — three separate systems responding together to one change in demand, coordinated largely by the endocrine and nervous systems working in tandem.",
   analogy:"Think of the body as a well-run city: the cardiovascular system is the road network delivering supplies, the respiratory system is the ventilation system bringing in fresh air, and the nervous system is the communication network coordinating it all.",
   keyTerms:["Cardiovascular system","Respiratory system","Digestive system","Nervous system","Physiological process"],
   example:"After a meal, the digestive system breaks down food into nutrients, which the cardiovascular system then transports to cells throughout the body.",
   medicalConnection:"Nearly every area of clinical medicine is organised around organ systems — recognising which system underlies a set of symptoms is often the first step in understanding a patient's condition.",
   memoryTrick:"\"Different systems, one team\" — each organ system has its own job, but they constantly work together to keep the body functioning.",
   commonMistake:"Studying organ systems in complete isolation — in reality, systems are highly interconnected, and most physiological processes involve several systems working together.",
   testYourself:[
     {q:"Which organ system is primarily responsible for gas exchange?", options:["Digestive system","Respiratory system","Nervous system","Reproductive system"], answer:1, explain:"The respiratory system brings oxygen in and removes carbon dioxide."},
     {q:"Which system transports nutrients and oxygen throughout the body?", options:["Cardiovascular system","Digestive system","Endocrine system","Skeletal system"], answer:0, explain:"The cardiovascular system circulates blood, delivering oxygen and nutrients to tissues."},
