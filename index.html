     {q:"Coordinating rapid responses using electrical signals is mainly the job of the:", options:["Digestive system","Nervous system","Urinary system","Respiratory system"], answer:1, explain:"The nervous system uses electrical signals to coordinate fast responses throughout the body."}
   ],
   flashcards:[
     {front:"Which organ system handles gas exchange?", back:"The respiratory system."},
     {front:"Which organ system transports nutrients and oxygen around the body?", back:"The cardiovascular system."},
     {front:"Why do organ systems need to work together?", back:"Because most physiological processes rely on more than one system cooperating."}
   ]},
  {id:"bio-bacteriaviruses", subject:"biology", title:"Bacteria & Viruses", icon:"🦠",
   tag:"Microbiology Foundations",
   explanation:"Bacteria are single-celled living organisms that can reproduce independently and exist almost everywhere, with some causing disease and many being harmless or even beneficial. Viruses are much smaller, non-living particles that cannot reproduce on their own — they must infect a host cell and hijack its machinery to make copies of themselves.",
   goingDeeper:"Bacteria are classified partly by their cell wall structure, which is what a Gram stain test detects in a lab — Gram-positive bacteria retain a purple stain due to a thick outer wall, while Gram-negative bacteria do not, due to a different wall structure. This distinction matters clinically, since it affects which antibiotics will be effective against a particular infection. Viruses, meanwhile, are typically classified by their genetic material (DNA or RNA) and their structural shape, both of which influence how they infect cells and how quickly they can mutate.",
   analogy:"A bacterium is like a tiny, self-sufficient factory that can run on its own; a virus is more like a USB drive with harmful instructions — useless without plugging into someone else's computer (a host cell) to run.",
   keyTerms:["Bacterium","Virus","Host cell","Pathogen","Antibiotic"],
   example:"Antibiotics can kill or stop the growth of bacteria by targeting their cell structures, but they are ineffective against viruses, which don't have those same structures to target.",
   medicalConnection:"Understanding the difference between bacteria and viruses is essential in medicine, since it determines whether antibiotics (bacteria) or antivirals/supportive care (viruses) are the appropriate treatment approach.",
   memoryTrick:"\"Bacteria live alone, viruses need a home\" — bacteria are independent living cells; viruses require a host cell to reproduce.",
   commonMistake:"Assuming antibiotics work against viral infections — antibiotics only target bacteria and have no effect on viruses.",
   testYourself:[
     {q:"Which of these can reproduce independently, without needing a host cell?", options:["Virus","Bacterium","Neither can reproduce","Both require a host equally"], answer:1, explain:"Bacteria are independent living cells capable of reproducing on their own."},
     {q:"Antibiotics are effective against:", options:["Viruses only","Bacteria","Both equally","Neither"], answer:1, explain:"Antibiotics target structures found in bacteria and are not effective against viruses."},
     {q:"A virus requires what to reproduce?", options:["Sunlight","A host cell","Oxygen only","Nothing — it reproduces independently"], answer:1, explain:"Viruses must infect a host cell and use its machinery to make copies of themselves."}
   ],
   flashcards:[
     {front:"Can bacteria reproduce on their own?", back:"Yes — bacteria are independent living cells."},
     {front:"What does a virus need to reproduce?", back:"A host cell, whose machinery it hijacks to make copies of itself."},
     {front:"Why don't antibiotics work on viruses?", back:"Antibiotics target bacterial structures, which viruses do not have."}
   ]},
  {id:"bio-fungiprotozoa", subject:"biology", title:"Fungi & Protozoa", icon:"🍄",
   tag:"Microbiology Foundations",
   explanation:"Fungi are organisms (like yeasts and moulds) that absorb nutrients from their surroundings and can exist as single cells or complex multicellular structures; some cause infections in humans. Protozoa are single-celled organisms, often found in water, and some are parasites capable of causing disease in humans.",
   goingDeeper:"Fungal infections are generally divided into superficial infections (affecting skin, hair, or nails, like ringworm) and the much rarer but more serious systemic infections (affecting internal organs, usually only in people with a weakened immune system). Protozoal parasites often have complex life cycles involving more than one host — the malaria parasite, for instance, cycles between a human host and the Anopheles mosquito that transmits it, with different life stages occurring in each.",
   analogy:"Fungi are like tiny recyclers, breaking down and absorbing nutrients from their environment; protozoa are more like tiny, independent hunters or drifters, some of which can become uninvited guests in the human body.",
   keyTerms:["Fungus","Yeast","Mould","Protozoan","Parasite"],
   example:"Candida is a yeast (a type of fungus) that can cause infections, while Plasmodium is a protozoan parasite responsible for malaria.",
   medicalConnection:"Fungal and protozoal infections often require very different treatments from bacterial or viral infections, making correct identification of the pathogen type essential for effective treatment.",
   memoryTrick:"\"Fungi absorb, protozoa roam\" — a simple way to remember their basic lifestyles.",
   commonMistake:"Lumping fungi, protozoa, bacteria, and viruses together as \"germs\" without distinction — each group has a very different structure and requires a different category of treatment.",
   testYourself:[
     {q:"Yeasts and moulds both belong to which group of organisms?", options:["Bacteria","Viruses","Fungi","Protozoa"], answer:2, explain:"Yeasts and moulds are both types of fungi."},
     {q:"Malaria is caused by which type of organism?", options:["A bacterium","A virus","A protozoan parasite","A fungus"], answer:2, explain:"Malaria is caused by Plasmodium, a protozoan parasite."},
     {q:"Fungi primarily obtain nutrients by:", options:["Photosynthesis","Absorbing nutrients from their surroundings","Hunting prey","Producing their own DNA only"], answer:1, explain:"Fungi absorb nutrients from their environment rather than producing their own food or hunting."}
   ],
   flashcards:[
     {front:"Give an example of a fungal organism.", back:"Yeast (e.g. Candida) or mould."},
     {front:"What causes malaria?", back:"Plasmodium, a protozoan parasite."},
     {front:"How do fungi typically obtain nutrients?", back:"By absorbing them from their surrounding environment."}
   ]},
  {id:"bio-infection", subject:"biology", title:"Microbial Growth & Infection Basics", icon:"🧪",
   tag:"Microbiology Foundations",
   explanation:"Microbial growth refers to how micro-organisms multiply, often very rapidly under favourable conditions (warmth, moisture, nutrients). Infection occurs when a pathogen (a disease-causing micro-organism) enters the body, multiplies, and causes harm, potentially spreading from person to person through various routes of transmission.",
   goingDeeper:"Infectious disease spread is often described using the idea of a 'chain of infection': a pathogen needs a reservoir (where it lives), a way to exit that reservoir, a mode of transmission (like droplets, contact, or a vector), a way to enter a new host, and a susceptible host to infect. Public health measures — from hand-washing to vaccination to quarantine — each work by deliberately breaking one specific link in this chain, rather than trying to eliminate the pathogen directly.",
   analogy:"Favourable conditions for microbial growth are like a well-stocked, warm greenhouse — under the right conditions, a population can explode in size very quickly.",
   keyTerms:["Pathogen","Transmission","Incubation period","Infection"],
   example:"Washing hands reduces the transmission of many pathogens by physically removing micro-organisms before they can be transferred to the body via the mouth, nose, or a wound.",
   medicalConnection:"Understanding how infections spread underlies core public health practices such as hand hygiene, vaccination, and isolation of contagious patients.",
   memoryTrick:"\"Warm, wet, well-fed — microbes multiply best\" — a quick way to remember ideal growth conditions.",
   commonMistake:"Assuming all micro-organisms cause disease — most bacteria and fungi in and around the human body are harmless or even beneficial; only a minority are pathogenic.",
   testYourself:[
     {q:"A pathogen is defined as:", options:["Any micro-organism","A disease-causing micro-organism","Only a type of virus","A beneficial gut bacterium"], answer:1, explain:"A pathogen is specifically a micro-organism capable of causing disease."},
     {q:"Which of these conditions generally favours rapid microbial growth?", options:["Cold and dry","Warm and moist with nutrients available","No oxygen and no water","Extremely acidic with no nutrients"], answer:1, explain:"Warmth, moisture, and available nutrients generally support faster microbial growth."},
     {q:"Hand washing helps prevent infection mainly by:", options:["Killing all viruses instantly","Physically removing micro-organisms before transmission","Boosting antibody production","Replacing the need for vaccination"], answer:1, explain:"Hand washing physically removes many micro-organisms, reducing the chance of transmission."}
   ],
   flashcards:[
     {front:"What is a pathogen?", back:"A disease-causing micro-organism."},
     {front:"Name three conditions that favour rapid microbial growth.", back:"Warmth, moisture, and available nutrients."},
     {front:"Why is hand washing effective against infection?", back:"It physically removes micro-organisms before they can be transmitted."}
   ]},
  {id:"bio-evolution", subject:"biology", title:"Natural Selection & Adaptation", icon:"🦎",
   tag:"Evolution & Ecology",
   explanation:"Natural selection is the process by which individuals with traits better suited to their environment are more likely to survive and reproduce, passing those traits to the next generation. Over many generations, this leads to adaptation — populations becoming better suited to their environment — and is the main mechanism driving evolution.",
   goingDeeper:"Natural selection requires three ingredients to operate: variation (individuals differ in their traits), heritability (those traits can be passed to offspring), and differential survival or reproduction (some variants leave more offspring than others). It's worth noting that natural selection doesn't produce 'perfect' organisms or work toward any particular goal — it simply favours whatever traits happen to improve survival and reproduction in a specific environment at a specific time, which is why the same species can evolve in very different directions in different environments.",
   analogy:"Think of natural selection like a filter: individuals whose traits don't suit their environment are less likely to \"pass through\" to the next generation, while well-suited traits keep getting filtered forward.",
   keyTerms:["Natural selection","Adaptation","Variation","Survival of the fittest","Evolution"],
   example:"Antibiotic resistance in bacteria is a real-world example of natural selection: bacteria with a chance mutation for resistance survive antibiotic treatment and reproduce, while non-resistant bacteria die off.",
   medicalConnection:"Understanding natural selection is essential for understanding antibiotic resistance, a major challenge in modern medicine that arises directly from this evolutionary process.",
   memoryTrick:"\"Best-suited traits survive to thrive\" — a simple summary of natural selection.",
   commonMistake:"Thinking individual organisms 'evolve' during their lifetime — evolution happens at the population level over many generations, not within a single individual.",
   testYourself:[
     {q:"Natural selection favours individuals that are:", options:["Randomly chosen","Best suited to their environment","Always the largest","Always the fastest reproducers regardless of traits"], answer:1, explain:"Natural selection favours individuals whose traits make them better suited to survive and reproduce in their environment."},
     {q:"Antibiotic resistance in bacteria is an example of:", options:["Genetic engineering","Natural selection","Random chance with no pattern","A vaccine failure"], answer:1, explain:"Resistant bacteria survive antibiotic exposure and reproduce, passing on resistance — a clear case of natural selection."},
     {q:"Evolution through natural selection occurs at the level of:", options:["A single individual within its lifetime","An entire population over many generations","A single cell only","A single organ"], answer:1, explain:"Evolution is a population-level process occurring over many generations, not within one individual's lifetime."}
   ],
   flashcards:[
     {front:"Define natural selection.", back:"The process by which individuals with better-suited traits are more likely to survive and reproduce."},
     {front:"Give a medical example of natural selection in action.", back:"Antibiotic resistance in bacteria."},
     {front:"Does an individual organism evolve during its own lifetime?", back:"No — evolution occurs at the population level, over many generations."}
   ]},
  {id:"bio-ecology", subject:"biology", title:"Populations & Ecosystems", icon:"🌍",
   tag:"Evolution & Ecology",
   explanation:"A population is a group of the same species living in the same area, while an ecosystem includes all the living organisms (populations of different species) in an area, together with their non-living environment (like water, soil, and climate), all interacting with each other.",
   goingDeeper:"Populations within an ecosystem interact in several recurring patterns: predation (one species consumes another), competition (species compete for the same limited resource), and symbiosis (two species live in close association, which can benefit both, benefit one while harming the other, or benefit one with no effect on the other). These interactions mean that a change affecting just one population — such as a new predator being introduced — can ripple outward and affect the entire ecosystem, not just the species directly involved.",
   analogy:"A population is like all the members of one team; an ecosystem is like the entire stadium — every team, the field, the weather, and all the interactions happening at once.",
   keyTerms:["Population","Community","Ecosystem","Habitat","Interaction"],
   example:"All the fish of one species in a particular lake form a population, while the lake's fish, plants, insects, water, and nutrients together make up the ecosystem.",
   medicalConnection:"Ecosystem health has direct implications for human health — for example, disruptions to ecosystems can change the distribution of disease-carrying organisms, like mosquitoes.",
   memoryTrick:"\"Population = one species, Ecosystem = the whole scene\" — a simple way to keep the scale straight.",
   commonMistake:"Confusing 'population' and 'community' — a population is one species; a community includes all the different populations living together in one area.",
   testYourself:[
     {q:"A population refers to:", options:["All species in an area","One species living in the same area","The non-living parts of an environment only","An entire ecosystem"], answer:1, explain:"A population is a group of individuals of the same species living in the same area."},
     {q:"An ecosystem includes:", options:["Only living organisms","Only non-living factors like water and soil","Living organisms and their non-living environment together","Only a single species"], answer:2, explain:"An ecosystem includes both living organisms and the non-living environment they interact with."},
     {q:"Why is ecosystem health relevant to human medicine?", options:["It has no real connection to human health","Ecosystem changes can affect the spread of disease-carrying organisms","It only matters for veterinary medicine","It only affects plant diseases"], answer:1, explain:"Changes in ecosystems can shift the distribution of organisms like disease-carrying mosquitoes, directly affecting human health."}
   ],
   flashcards:[
     {front:"Define a population (in ecology).", back:"A group of individuals of the same species living in the same area."},
     {front:"What does an ecosystem include?", back:"Living organisms and their non-living environment, all interacting together."},
     {front:"How can ecosystem changes affect human health?", back:"They can shift the distribution of disease-carrying organisms, such as mosquitoes."}
   ]}
],
chemistry: [
  {id:"chem-atom", subject:"chemistry", title:"Atomic Structure", icon:"⚛️",
   tag:"General Chemistry",
   explanation:"An atom is made of a small, dense nucleus containing protons and neutrons, surrounded by electrons occupying energy levels (shells) around it. The number of protons defines the element.",
   analogy:"Picture the nucleus as a sun at the centre, with electrons like planets occupying specific orbits at set distances — they don't drift anywhere between shells.",
   keyTerms:["Proton","Neutron","Electron","Atomic number","Mass number","Isotope"],
   example:"Carbon-12 and Carbon-14 are isotopes of carbon: same number of protons (6), different numbers of neutrons.",
   medicalConnection:"Radioactive isotopes, like technetium-99m, are used in medical imaging because of predictable, safe patterns of radioactive decay.",
   memoryTrick:"\"PNE\" — Protons Positive, Neutrons Neutral, Electrons... Everywhere (in shells).",
   commonMistake:"Confusing atomic number (protons) with mass number (protons + neutrons) is one of the most common early errors.",
   goingDeeper:"The 'planetary' picture of electrons orbiting like tiny planets is a useful simplification, but it's not quite accurate — electrons don't follow neat, fixed paths at all. Instead, they exist in fuzzy regions of probability called orbitals, where an electron is likely to be found but never pinned to an exact location at an exact moment. This quantum-level uncertainty doesn't usually matter for basic chemistry calculations, but it's the real reason electron 'shells' are better thought of as probability zones than as solid orbital rings.",
   testYourself:[
     {q:"The atomic number of an element equals its number of:", options:["Neutrons","Protons","Electrons only","Protons + neutrons"], answer:1, explain:"Atomic number is defined by the number of protons in the nucleus."},
     {q:"Isotopes of the same element differ in their number of:", options:["Protons","Electrons","Neutrons","Charge"], answer:2, explain:"Isotopes have the same protons but different neutron counts, giving different mass numbers."},
     {q:"Which particle carries a negative charge?", options:["Proton","Neutron","Electron","Nucleus"], answer:2, explain:"Electrons are negatively charged and occupy shells around the nucleus."}
   ],
   flashcards:[
     {front:"What determines an element's identity?", back:"Its number of protons (atomic number)."},
     {front:"What is an isotope?", back:"Atoms of the same element with different numbers of neutrons."},
     {front:"Where are protons and neutrons located?", back:"In the nucleus at the centre of the atom."}
   ]},
  {id:"chem-mole", subject:"chemistry", title:"The Mole Concept", icon:"🧪",
   tag:"General Chemistry",
   explanation:"A mole is a counting unit for chemistry, like a 'dozen' but much larger: one mole of anything contains 6.02 × 10²³ particles (Avogadro's number). It lets chemists relate mass, particles and volume.",
   analogy:"Just as buying 'a dozen eggs' means exactly 12, buying 'a mole of atoms' means exactly 6.02 × 10²³ atoms — a fixed, agreed count.",
   keyTerms:["Avogadro's number","Molar mass","Moles","Concentration"],
   example:"One mole of carbon atoms has a mass of 12g (its molar mass), and contains 6.02 × 10²³ carbon atoms.",
   medicalConnection:"Drug dosing and IV fluid preparation often rely on molar concentration calculations to ensure the correct amount of active substance is delivered.",
   memoryTrick:"moles = mass ÷ molar mass — remember 'M over M'.",
   commonMistake:"Forgetting to convert mass into moles before comparing quantities in a chemical equation is a very common stoichiometry error.",
   goingDeeper:"Avogadro's number (6.02 × 10²³) isn't an arbitrary round figure — it was defined specifically so that the molar mass of a substance in grams matches its atomic or molecular mass in atomic mass units, making conversions between mass and moles seamless. This is why carbon's atomic mass of 12 directly gives a molar mass of 12 g/mol: the whole numbering system was built around keeping that relationship clean, which is what makes the mole such a genuinely convenient 'bridge' between the atomic scale and the measurable, everyday scale of a laboratory balance.",
   testYourself:[
     {q:"How many particles are in one mole of a substance?", options:["1,000","6.02 × 10²³","100","3.14 × 10⁸"], answer:1, explain:"This is Avogadro's number, the defined size of one mole."},
     {q:"To calculate moles from mass, you should:", options:["Multiply mass by molar mass","Divide mass by molar mass","Add mass and molar mass","Square the mass"], answer:1, explain:"Moles = mass ÷ molar mass."},
     {q:"What is the molar mass of carbon (approximately)?", options:["6 g/mol","12 g/mol","14 g/mol","24 g/mol"], answer:1, explain:"Carbon has an atomic mass of approximately 12, so its molar mass is 12 g/mol."}
   ],
   flashcards:[
     {front:"What is Avogadro's number?", back:"6.02 × 10²³ particles per mole."},
     {front:"Formula for moles from mass?", back:"moles = mass ÷ molar mass."},
     {front:"Why is the mole concept useful?", back:"It links mass, particle count and volume in chemical calculations."}
   ]},
  {id:"chem-acidbase", subject:"chemistry", title:"Acids, Bases & pH", icon:"🧫",
   tag:"Physical Chemistry",
   explanation:"Acids release hydrogen ions (H⁺) in solution, while bases accept them or release hydroxide ions (OH⁻). pH measures how acidic or basic a solution is, on a scale from 0 (strongly acidic) to 14 (strongly basic), with 7 being neutral.",
   analogy:"Think of the pH scale like a see-saw: more H⁺ tips it toward acidic, more OH⁻ tips it toward basic, and a perfectly balanced see-saw is neutral (pH 7).",
   keyTerms:["pH","Hydrogen ion","Hydroxide ion","Buffer","Neutralisation"],
   example:"Human blood is tightly maintained around pH 7.35–7.45 using buffer systems, since even small deviations can be dangerous.",
   medicalConnection:"Buffers such as the bicarbonate system keep blood pH stable; understanding acid-base balance is essential for interpreting conditions like acidosis and alkalosis later in medical training.",
   memoryTrick:"\"Lower pH = More H⁺\" — think of pH and H⁺ as opposites on a see-saw.",
   commonMistake:"Assuming pH 0 means 'no acidity' — actually pH 0 represents extremely strong acidity, not the absence of it.",
   goingDeeper:"Because the pH scale is logarithmic, each single-unit change represents a tenfold change in hydrogen ion concentration — meaning a solution of pH 4 isn't just 'a bit more acidic' than pH 5, it's ten times more acidic, and a hundred times more acidic than pH 6. This is exactly why small-looking pH shifts in the body are treated so seriously in medicine: a blood pH drop from 7.4 to 6.9 sounds tiny on paper, but represents more than a threefold increase in H⁺ concentration, which is a life-threatening change physiologically.",
   testYourself:[
     {q:"A solution with pH 7 is considered:", options:["Strongly acidic","Neutral","Strongly basic","Radioactive"], answer:1, explain:"pH 7 is the neutral point on the scale."},
     {q:"What ion do acids release in solution?", options:["OH⁻","H⁺","Na⁺","Cl⁻"], answer:1, explain:"Acids increase the concentration of hydrogen ions (H⁺) in solution."},
     {q:"A buffer's main role is to:", options:["Increase pH rapidly","Resist changes in pH","Remove all ions","Turn a base into a salt"], answer:1, explain:"Buffers resist significant changes in pH when small amounts of acid or base are added."}
   ],
   flashcards:[
     {front:"What does pH measure?", back:"How acidic or basic a solution is, on a 0–14 scale."},
     {front:"What ion is associated with bases?", back:"Hydroxide ion (OH⁻)."},
     {front:"What is a buffer?", back:"A system that resists changes in pH when acid or base is added."}
   ]},
  {id:"chem-econfig", subject:"chemistry", title:"Electronic Configuration & Orbitals", icon:"🌀",
   tag:"Atomic Structure",
   explanation:"Electrons fill energy levels (shells) around the nucleus in a predictable order, following sub-levels called orbitals (s, p, d, f). Electronic configuration shows exactly how many electrons occupy each shell and sub-shell, and it determines how an atom will bond with others.",
   analogy:"Think of electron shells like seats in a stadium: the front rows (lowest energy levels) fill up first before anyone sits further back, and each 'row type' (s, p, d) holds a set maximum number of people.",
   keyTerms:["Electron shell","Sub-shell (s,p,d,f)","Orbital","Valence electrons","Aufbau principle"],
   example:"Sodium (atomic number 11) has the configuration 2,8,1 — meaning 2 electrons in the first shell, 8 in the second, and 1 lone valence electron in the third, which is why sodium readily loses that one electron to form Na⁺.",
   medicalConnection:"The number of valence electrons in elements like sodium, potassium and calcium determines how they form the ions (Na⁺, K⁺, Ca²⁺) that drive nerve impulses and muscle contraction in the body.",
   memoryTrick:"\"Fill from the inside out\" — shells fill nearest the nucleus first, following 2, 8, 8, 18 as a rough capacity pattern for the first few shells.",
   commonMistake:"Assuming all shells hold exactly 8 electrons — only the second and third shells commonly hold 8 in simple exam-level configurations; capacities increase for higher shells.",
   goingDeeper:"Electron configuration follows a specific filling order (the Aufbau principle) that doesn't perfectly match the simple shell-by-shell picture once you reach larger atoms — for instance, the 4s sub-level actually fills before the 3d sub-level, even though shell 3 is 'closer' to the nucleus than shell 4. This slightly counterintuitive filling order is what explains many of the periodic table's less obvious patterns, including why transition metals (which involve the d sub-level) behave differently from the simpler main-group elements covered at foundational level.",
   testYourself:[
     {q:"Which sub-level fills immediately after the 1s sub-level?", options:["2s","2p","3s","1p"], answer:0, explain:"After 1s is full, the next lowest-energy sub-level is 2s."},
     {q:"Sodium (atomic number 11) has an electron configuration of:", options:["2,8,1","2,9","8,3","1,10"], answer:0, explain:"Sodium's 11 electrons fill as 2 in the first shell, 8 in the second, and 1 in the third (valence) shell."},
     {q:"Valence electrons are:", options:["Electrons in the nucleus","Electrons in the innermost shell only","Electrons in the outermost occupied shell","Neutrons in the outer shell"], answer:2, explain:"Valence electrons occupy the outermost shell and determine how an atom bonds."}
   ],
   flashcards:[
     {front:"What is a valence electron?", back:"An electron in the outermost occupied shell of an atom, which determines its bonding behaviour."},
     {front:"What is the electron configuration of sodium (11 electrons)?", back:"2, 8, 1"},
     {front:"In which order do shells generally fill with electrons?", back:"From the shell closest to the nucleus (lowest energy) outward."}
   ]},
  {id:"chem-periodic", subject:"chemistry", title:"The Periodic Table & Periodic Trends", icon:"📊",
   tag:"General Chemistry",
   explanation:"Elements are arranged in the periodic table by increasing atomic number, in rows (periods) and columns (groups). Elements in the same group share similar chemical properties because they have the same number of valence electrons. Moving across and down the table produces predictable trends in atomic size, ionisation energy and reactivity.",
   analogy:"The periodic table is like a well-organised class register grouped by 'family traits' — elements in the same column behave like siblings, sharing similar reactivity because they have the same outer-shell electron pattern.",
   keyTerms:["Group","Period","Atomic radius","Ionisation energy","Electronegativity","Metals/Non-metals"],
   example:"Group 1 metals (like sodium and potassium) all react vigorously with water because they each have a single, easily-lost valence electron.",
   medicalConnection:"Trace elements such as iron, zinc, iodine and calcium — all positioned in specific regions of the periodic table — are essential to processes like oxygen transport (iron in haemoglobin) and bone structure (calcium).",
   memoryTrick:"\"Right and up = tighter grip\" — electronegativity and ionisation energy generally increase moving right and up the table (excluding noble gases).",
   commonMistake:"Assuming atomic size increases across a period — it actually decreases, as increasing nuclear charge pulls electrons in more tightly.",
   goingDeeper:"The periodic table wasn't originally organised by atomic number at all — Mendeleev's 19th-century version arranged elements by atomic mass, and it was only decades later, once atomic structure was better understood, that atomic number became the true organising principle. Mendeleev's version was still remarkably successful because he deliberately left gaps for undiscovered elements, correctly predicting their properties based on the trends in the elements around them — a striking early demonstration of how powerful periodic trends really are for prediction, not just classification.",
   testYourself:[
     {q:"Elements in the same group of the periodic table have similar chemical properties mainly because they share the same:", options:["Number of neutrons","Number of valence electrons","Atomic mass","Number of protons"], answer:1, explain:"Elements in a group share the same number of valence electrons, which drives similar chemical behaviour."},
     {q:"Moving from left to right across a period, atomic radius generally:", options:["Increases","Decreases","Stays the same","Becomes negative"], answer:1, explain:"Increasing nuclear charge across a period pulls electrons closer, shrinking atomic radius."},
     {q:"Group 1 elements are known as:", options:["Halogens","Noble gases","Alkali metals","Transition metals"], answer:2, explain:"Group 1 elements, like sodium and potassium, are called alkali metals."}
   ],
   flashcards:[
     {front:"What determines an element's group in the periodic table?", back:"Its number of valence electrons."},
     {front:"How does atomic radius change across a period (left to right)?", back:"It generally decreases, due to increasing nuclear charge."},
     {front:"Name three trace elements essential to the human body found on the periodic table.", back:"Iron, zinc and iodine (calcium is another good example)."}
   ]},
  {id:"chem-bonding", subject:"chemistry", title:"Chemical Bonding (Ionic, Covalent & Metallic)", icon:"🔗",
   tag:"General Chemistry",
   explanation:"Atoms bond to achieve a more stable electron arrangement. Ionic bonds form when electrons transfer between atoms, creating oppositely-charged ions that attract each other. Covalent bonds form when atoms share electron pairs. Metallic bonds involve a 'sea' of shared, delocalised electrons among metal atoms.",
   analogy:"Ionic bonding is like one friend completely giving away a toy they don't need to another who wants it — a full transfer. Covalent bonding is like two friends sharing one toy between them — both hold on.",
   keyTerms:["Ionic bond","Covalent bond","Metallic bond","Electron transfer","Electron sharing","Lattice"],
   example:"Sodium chloride (table salt) forms through an ionic bond: sodium transfers its one valence electron to chlorine, forming Na⁺ and Cl⁻ ions held together by electrostatic attraction.",
   medicalConnection:"Covalent bonds hold together the atoms within biomolecules like glucose, proteins and DNA, while ionic interactions (like Na⁺ and Cl⁻ in blood plasma) are vital for nerve signalling and fluid balance.",
   memoryTrick:"\"Ionic = gIve, Covalent = Co-share\" — the letters hint at the mechanism.",
   commonMistake:"Believing ionic bonds only occur between two non-metals — ionic bonding typically occurs between a metal and a non-metal, while covalent bonding typically occurs between two non-metals.",
   goingDeeper:"The ionic-versus-covalent distinction is really a spectrum rather than a strict either/or split: even 'covalent' bonds between different elements usually involve some unequal sharing of electrons (called polarity), and even 'ionic' bonds retain a degree of electron sharing at very close range. Chemists often use the difference in electronegativity between two bonded atoms as a rough guide to where a particular bond sits on this spectrum, with a very large difference pointing toward more ionic character and a small or zero difference pointing toward a purer covalent bond.",
   testYourself:[
     {q:"An ionic bond typically forms between:", options:["Two non-metals","A metal and a non-metal","Two metals","Two noble gases"], answer:1, explain:"Ionic bonds usually form when a metal transfers electrons to a non-metal."},
     {q:"A covalent bond involves:", options:["Complete transfer of electrons","Sharing of electron pairs","A sea of delocalised electrons","No electron involvement"], answer:1, explain:"Covalent bonds form when atoms share pairs of electrons."},
     {q:"In sodium chloride (NaCl), sodium:", options:["Gains one electron","Loses one electron","Shares one electron","Loses two electrons"], answer:1, explain:"Sodium loses its one valence electron to chlorine, forming Na⁺."}
   ],
   flashcards:[
     {front:"What type of bond forms between a metal and a non-metal?", back:"An ionic bond."},
     {front:"What type of bond forms between two non-metals?", back:"A covalent bond."},
     {front:"What holds metal atoms together in metallic bonding?", back:"A 'sea' of shared, delocalised electrons."}
   ]},
  {id:"chem-molstruct", subject:"chemistry", title:"Molecular Shape & Structure", icon:"🧬",
   tag:"General Chemistry",
   explanation:"The 3D shape of a molecule is determined by how electron pairs around the central atom repel and arrange themselves as far apart as possible (VSEPR theory). Shape affects a molecule's properties, including how it interacts with other molecules and, in biology, how it fits into receptors and enzymes.",
   analogy:"Electron pairs behave like people holding umbrellas in a crowd — they naturally spread out to avoid bumping into each other, giving the molecule its characteristic shape.",
   keyTerms:["VSEPR theory","Bond angle","Lone pair","Linear","Tetrahedral","Bent"],
   example:"Water (H₂O) has a bent shape because its two lone electron pairs on oxygen repel the two bonding pairs, pushing the hydrogen atoms closer together than a straight line.",
   medicalConnection:"The specific 3D shape of a drug molecule determines whether it will fit into a receptor or enzyme active site — a concept central to pharmacology, often summarised as 'shape determines function.'",
   memoryTrick:"\"Pairs push apart\" — whether bonding or lone pairs, electron groups always arrange to minimise repulsion.",
   commonMistake:"Forgetting to count lone pairs when predicting shape — lone pairs influence shape even though they aren't 'seen' in a skeletal structure.",
   goingDeeper:"VSEPR theory's predictions become especially important once lone pairs are involved, because lone pairs actually repel more strongly than bonding pairs — they aren't 'shared' between two nuclei, so they take up more space around the central atom. This is exactly why ammonia (NH₃, with one lone pair) has a slightly smaller bond angle than a perfect tetrahedral shape would predict, and why water (H₂O, with two lone pairs) is compressed even further into its distinctively bent shape.",
   testYourself:[
     {q:"VSEPR theory predicts molecular shape based on:", options:["Atomic mass","Repulsion between electron pairs","Temperature","Colour of the molecule"], answer:1, explain:"VSEPR theory is based on electron pairs arranging to minimise repulsion."},
     {q:"Water (H₂O) has a bent shape mainly because of:", options:["Its high mass","Two lone pairs on oxygen repelling the bonding pairs","A triple bond","Its large size"], answer:1, explain:"Oxygen's two lone pairs push the two O-H bonds closer together, creating a bent shape."},
     {q:"A molecule with four bonding pairs and no lone pairs around the central atom typically has a:", options:["Linear shape","Bent shape","Tetrahedral shape","Trigonal planar shape"], answer:2, explain:"Four bonding pairs with no lone pairs arrange tetrahedrally to minimise repulsion."}
   ],
   flashcards:[
     {front:"What does VSEPR theory predict?", back:"The 3D shape of a molecule, based on electron pair repulsion."},
     {front:"Why is water's shape 'bent' rather than straight?", back:"Its two lone pairs on oxygen repel the bonding pairs, pushing them closer together."},
     {front:"Why does molecular shape matter in medicine?", back:"A drug's shape determines whether it fits into a receptor or enzyme active site."}
   ]},
  {id:"chem-equations", subject:"chemistry", title:"Writing & Balancing Chemical Equations", icon:"⚗️",
   tag:"General Chemistry",
   explanation:"A chemical equation represents a reaction using formulas for reactants and products. Because atoms are never created or destroyed (conservation of mass), an equation must be balanced so that the same number of each type of atom appears on both sides.",
   analogy:"Balancing an equation is like balancing a recipe: if you double the flour, you must also double the eggs and sugar so the ratios — and total ingredients — still make sense.",
   keyTerms:["Reactants","Products","Coefficient","Conservation of mass","Balanced equation"],
   example:"The unbalanced equation H₂ + O₂ → H₂O becomes balanced as 2H₂ + O₂ → 2H₂O, so that 4 hydrogen and 2 oxygen atoms appear on both sides.",
   medicalConnection:"Balanced equations underlie calculations for drug synthesis and reactions in the body, such as the equation for aerobic respiration, where balanced glucose and oxygen inputs match carbon dioxide, water and energy outputs.",
   memoryTrick:"\"Count, don't guess\" — always count atoms of each element on both sides before declaring an equation balanced.",
   commonMistake:"Changing a subscript (e.g. turning H₂O into H₂O₂) to try to balance an equation — subscripts define the substance itself and must never be changed; only coefficients in front of formulas can be adjusted.",
   goingDeeper:"Balancing more complex equations (especially ones involving polyatomic ions or multiple reactants) is often easier with a systematic approach: balance metals first, then non-metals, then hydrogen, then oxygen last, adjusting one coefficient at a time and rechecking the whole equation after each change. This step-by-step discipline matters more as equations get longer, since trying to balance everything at once by inspection becomes increasingly easy to get wrong, especially under exam time pressure.",
   testYourself:[
     {q:"In a balanced chemical equation, the numbers in front of formulas are called:", options:["Subscripts","Coefficients","Superscripts","Indices"], answer:1, explain:"Coefficients show the relative number of moles of each substance."},
     {q:"Which part of a chemical formula should NEVER be changed to balance an equation?", options:["Coefficients","Subscripts","Arrows","Plus signs"], answer:1, explain:"Subscripts define the substance itself; changing them creates a different compound entirely."},
     {q:"The balanced equation for hydrogen and oxygen forming water is:", options:["H2 + O2 → H2O","2H2 + O2 → 2H2O","H2 + 2O2 → H2O2","2H2 + 2O2 → 2H2O"], answer:1, explain:"2H2 + O2 → 2H2O balances 4 hydrogen and 2 oxygen atoms on both sides."}
   ],
   flashcards:[
     {front:"What law requires chemical equations to be balanced?", back:"The law of conservation of mass."},
     {front:"What can you adjust to balance an equation?", back:"Only the coefficients in front of formulas, never the subscripts."},
     {front:"Balance: H2 + O2 → H2O", back:"2H2 + O2 → 2H2O"}
   ]},
  {id:"chem-stoichiometry", subject:"chemistry", title:"Stoichiometry & Reacting Masses", icon:"🧮",
   tag:"Physical Chemistry",
   explanation:"Stoichiometry uses the mole ratios in a balanced equation to calculate the amounts of reactants needed or products formed in a reaction — converting between mass, moles and particles using molar mass and Avogadro's number.",
   analogy:"If a recipe says 2 cups of flour make 12 cookies, stoichiometry is the skill of scaling that ratio up or down to know exactly how much flour you need for 30 cookies.",
   keyTerms:["Mole ratio","Limiting reactant","Excess reactant","Theoretical yield","Molar mass"],
   example:"From the equation 2H₂ + O₂ → 2H₂O, if 4 moles of H₂ react completely, stoichiometry shows exactly 2 moles of O₂ are needed and 4 moles of H₂O will form.",
   medicalConnection:"Pharmacists and lab scientists use stoichiometric reasoning to calculate correct reagent quantities when preparing solutions, compounding medicines or running diagnostic assays.",
   memoryTrick:"\"Mass → Moles → Ratio → Moles → Mass\" — the standard four-step pathway for any stoichiometry problem.",
   commonMistake:"Using the mass ratio from the equation directly instead of converting to moles first — coefficients in a balanced equation represent mole ratios, not mass ratios.",
   goingDeeper:"Real laboratory reactions rarely produce exactly the theoretical yield calculated from stoichiometry, because some product is inevitably lost to side reactions, incomplete reactions, or handling losses during the process. Chemists express this using percentage yield (actual yield ÷ theoretical yield × 100), and comparing percentage yields between different reaction conditions is one of the main ways industrial and pharmaceutical chemists judge whether a synthesis process is efficient enough to be worth scaling up.",
   testYourself:[
     {q:"Stoichiometric calculations rely on ratios found in:", options:["The periodic table","A balanced chemical equation","The density of reactants","Room temperature"], answer:1, explain:"Balanced equations give the mole ratios needed for stoichiometry."},
     {q:"The standard stoichiometry pathway converts:", options:["Mass → Moles → Ratio → Moles → Mass","Moles → Mass → Ratio → Mass","Mass → Ratio → Mass directly","Volume → Mass directly, skipping moles"], answer:0, explain:"The standard pathway is mass to moles, apply the mole ratio, then moles back to mass."},
     {q:"A limiting reactant is the reactant that:", options:["Is in excess","Runs out first, limiting how much product forms","Is not involved in the reaction","Has the highest molar mass"], answer:1, explain:"The limiting reactant is used up first and determines the maximum amount of product formed."}
   ],
   flashcards:[
     {front:"What is a limiting reactant?", back:"The reactant that runs out first, limiting the amount of product formed."},
     {front:"What is the standard stoichiometry conversion pathway?", back:"Mass → moles → mole ratio → moles → mass."},
     {front:"Why do coefficients in an equation matter for stoichiometry?", back:"They give the mole ratio between reactants and products."}
   ]},
  {id:"chem-concentration", subject:"chemistry", title:"Concentration & Solutions", icon:"🧴",
   tag:"Physical Chemistry",
   explanation:"A solution is a homogeneous mixture of a solute dissolved in a solvent. Concentration describes how much solute is present in a given amount of solution, commonly expressed in moles per litre (mol/dm³) or as mass per volume.",
   analogy:"Concentration is like how strong a cup of tea is: the same teabag in a small cup makes a stronger tea than the same teabag in a large jug of water — same solute, different concentration.",
   keyTerms:["Solute","Solvent","Molarity (mol/dm³)","Dilution","Saturated solution"],
   example:"Dissolving 1 mole of NaCl in 1 litre of water produces a solution with a concentration of 1 mol/dm³.",
   medicalConnection:"Intravenous fluids and drug infusions are prepared at precise concentrations — getting this calculation wrong can seriously harm a patient, which is why concentration calculations are a core clinical skill.",
   memoryTrick:"\"Concentration = moles ÷ volume\" — remember it as 'how packed' the solute is into the available space.",
   commonMistake:"Forgetting to convert volume into litres (dm³) before calculating molarity, especially when volumes are given in millilitres.",
   goingDeeper:"Concentration calculations become especially important during dilution, where a concentrated stock solution is diluted down to a working concentration — governed by the simple relationship C₁V₁ = C₂V₂ (concentration × volume stays constant before and after dilution, since the total amount of solute hasn't changed, only the volume it's dissolved in). This exact calculation is performed constantly in clinical and laboratory settings, from diluting a concentrated drug stock to a safe infusion concentration, to preparing reagents for a diagnostic test at the correct working strength.",
   testYourself:[
     {q:"Molarity is defined as:", options:["Mass ÷ volume","Moles of solute ÷ volume of solution in dm³","Moles × volume","Volume ÷ moles"], answer:1, explain:"Molarity (mol/dm³) is moles of solute per litre (dm³) of solution."},
     {q:"Dissolving 2 moles of NaCl in 2 dm³ of water gives a concentration of:", options:["4 mol/dm³","0.5 mol/dm³","1 mol/dm³","2 mol/dm³"], answer:2, explain:"2 moles ÷ 2 dm³ = 1 mol/dm³."},
     {q:"Before calculating molarity, a volume given in millilitres should be:", options:["Left unchanged","Converted to dm³ (litres)","Converted to grams","Multiplied by 1000"], answer:1, explain:"Volumes must be in dm³ (litres) for standard molarity calculations."}
   ],
   flashcards:[
     {front:"What is the formula for molarity?", back:"Molarity = moles of solute ÷ volume of solution (in dm³)."},
     {front:"Why must IV fluid concentrations be calculated precisely?", back:"Incorrect concentrations in medical infusions can seriously harm a patient."},
     {front:"What unit is molarity measured in?", back:"Moles per cubic decimetre (mol/dm³), equivalent to mol/L."}
   ]},
  {id:"chem-gasstates", subject:"chemistry", title:"Gas Laws & States of Matter", icon:"💨",
   tag:"Physical Chemistry",
   explanation:"Matter exists as solids, liquids or gases depending on how tightly particles are packed and how much energy they have. Gas laws (like Boyle's and Charles's laws) describe predictable relationships between a gas's pressure, volume and temperature.",
   analogy:"Gas particles are like an excitable crowd in a room: squeeze the room smaller (reduce volume) and they collide more often, raising the pressure — just as Boyle's law predicts.",
   keyTerms:["Solid","Liquid","Gas","Boyle's law","Charles's law","Kinetic theory"],
   example:"Boyle's law shows that if you compress a gas to half its original volume at constant temperature, its pressure doubles (P₁V₁ = P₂V₂).",
   medicalConnection:"Gas laws explain how oxygen and carbon dioxide move between the lungs and blood based on pressure gradients, and why deep-sea divers must manage pressure changes carefully to avoid conditions like decompression sickness.",
   memoryTrick:"\"Boyle — squeeze it, pressure grows\" (volume down, pressure up); \"Charles — heat it, it expands\" (temperature up, volume up).",
   commonMistake:"Forgetting that gas law calculations require temperature in Kelvin, not Celsius — using Celsius directly gives incorrect results.",
   goingDeeper:"Boyle's and Charles's laws are actually two special cases of a more general relationship called the ideal gas law (PV = nRT), which links pressure, volume, temperature and the amount of gas (in moles) all in a single equation. Boyle's law is what you get by holding temperature and amount constant, while Charles's law is what you get by holding pressure and amount constant — recognising this connection makes it much easier to handle exam questions where more than one gas variable changes at once, rather than trying to remember each named law as a completely separate rule.",
   testYourself:[
     {q:"Boyle's law describes the relationship between a gas's pressure and its:", options:["Temperature","Volume (at constant temperature)","Colour","Molar mass"], answer:1, explain:"Boyle's law states pressure and volume are inversely related at constant temperature."},
     {q:"For gas law calculations, temperature must be measured in:", options:["Celsius","Fahrenheit","Kelvin","Any unit works equally"], answer:2, explain:"Gas laws require temperature in Kelvin to give correct results."},
     {q:"Which state of matter has particles that are far apart and move freely in all directions?", options:["Solid","Liquid","Gas","Plasma only"], answer:2, explain:"Gas particles are widely spaced and move freely, unlike the tightly packed particles in solids and liquids."}
   ],
   flashcards:[
     {front:"State Boyle's law.", back:"At constant temperature, the pressure and volume of a gas are inversely proportional (P1V1 = P2V2)."},
     {front:"Why must temperature be in Kelvin for gas law calculations?", back:"Celsius can be zero or negative, which breaks the proportional relationships in gas laws."},
     {front:"How do gas laws relate to breathing?", back:"They explain how pressure gradients move oxygen and carbon dioxide between the lungs and blood."}
   ]},
  {id:"chem-thermochem", subject:"chemistry", title:"Thermochemistry (Energy in Reactions)", icon:"🔥",
   tag:"Physical Chemistry",
   explanation:"Chemical reactions either release energy to the surroundings (exothermic) or absorb energy from the surroundings (endothermic). This energy change is called enthalpy change (ΔH), measured in kilojoules per mole.",
   analogy:"An exothermic reaction is like a bonfire giving off heat to everyone standing nearby; an endothermic reaction is like an ice pack pulling heat away from your skin, making it feel cold.",
   keyTerms:["Exothermic","Endothermic","Enthalpy change (ΔH)","Activation energy","Energy profile diagram"],
   example:"Combustion reactions, like burning methane gas, are exothermic and release energy as heat and light.",
   medicalConnection:"The body's metabolism is fundamentally a set of controlled exothermic reactions (like breaking down glucose) that release the energy cells need to function.",
   memoryTrick:"\"EXOthermic EXits energy; ENDOthermic takes energy IN.\"",
   commonMistake:"Assuming a negative ΔH means a reaction absorbs energy — a negative ΔH actually indicates an exothermic reaction, where energy is released.",
   goingDeeper:"Whether a reaction is exothermic or endothermic depends on the balance between two things: the energy needed to break the bonds in the reactants, and the energy released when new bonds form in the products. If more energy is released forming new bonds than was needed to break the old ones, the reaction is exothermic overall; if breaking the old bonds costs more energy than is recovered, it's endothermic. This bond-energy view explains why combustion reactions (forming very stable bonds like those in CO₂ and H₂O) are reliably exothermic, releasing far more energy than was needed to break apart the original fuel and oxygen molecules.",
   testYourself:[
     {q:"A reaction that releases energy to the surroundings is called:", options:["Endothermic","Exothermic","Neutral","Catalytic"], answer:1, explain:"Exothermic reactions release energy, often as heat."},
     {q:"A negative ΔH value indicates a reaction is:", options:["Endothermic","Exothermic","Not possible","At equilibrium"], answer:1, explain:"A negative enthalpy change means energy is released — an exothermic reaction."},
     {q:"Which of these is an example of an exothermic process?", options:["Melting ice","Photosynthesis","Combustion of methane","Evaporating sweat"], answer:2, explain:"Combustion reactions release energy as heat and light, making them exothermic."}
   ],
   flashcards:[
     {front:"What does 'exothermic' mean?", back:"A reaction that releases energy to the surroundings."},
     {front:"What does 'endothermic' mean?", back:"A reaction that absorbs energy from the surroundings."},
     {front:"How does thermochemistry relate to metabolism?", back:"Metabolism involves controlled exothermic reactions that release energy for cells to use."}
   ]},
  {id:"chem-kinetics", subject:"chemistry", title:"Reaction Rates & Kinetics", icon:"⏱️",
   tag:"Physical Chemistry",
   explanation:"Reaction rate measures how quickly reactants are converted into products. Rate is affected by factors including concentration, temperature, surface area and the presence of a catalyst, which speeds up a reaction without being consumed.",
   analogy:"Think of a crowded room: the more people (higher concentration) or the faster they move (higher temperature), the more often they'll bump into each other — just as more frequent, energetic particle collisions speed up a reaction.",
   keyTerms:["Rate of reaction","Catalyst","Activation energy","Collision theory","Surface area"],
   example:"Powdered chalk reacts with acid faster than a single chalk block of the same mass, because the powder has a much greater surface area exposed to the acid.",
   medicalConnection:"Enzymes act as biological catalysts, dramatically speeding up the biochemical reactions that keep cells alive — without them, reactions like digestion would be far too slow to sustain life.",
   memoryTrick:"\"More collisions, more reactions\" — anything that increases how often and how energetically particles collide speeds up the rate.",
   commonMistake:"Assuming a catalyst is used up or changes the products of a reaction — a catalyst only speeds up the rate and is chemically unchanged at the end.",
   goingDeeper:"Collision theory actually requires two conditions to be met simultaneously for a reaction to occur: particles must collide with enough energy to overcome the activation energy barrier, and they must collide with the correct orientation relative to each other. This is why increasing concentration or temperature doesn't guarantee every extra collision leads to a reaction — it simply increases the frequency of collisions that meet both conditions, which is also why even a small increase in temperature can produce a surprisingly large increase in reaction rate, since it disproportionately increases the fraction of particles with enough energy to react.",
   testYourself:[
     {q:"Which factor does NOT generally increase reaction rate?", options:["Increasing temperature","Increasing concentration","Decreasing surface area","Adding a catalyst"], answer:2, explain:"Decreasing surface area slows a reaction by reducing collision opportunities."},
     {q:"A catalyst speeds up a reaction by:", options:["Being consumed in the reaction","Lowering the activation energy","Raising the temperature","Increasing the mass of reactants"], answer:1, explain:"Catalysts provide an alternative pathway with lower activation energy, without being consumed."},
     {q:"According to collision theory, reaction rate increases when particles:", options:["Collide less often","Collide more often and with enough energy","Stop moving","Become heavier"], answer:1, explain:"More frequent, sufficiently energetic collisions increase reaction rate."}
   ],
   flashcards:[
     {front:"Name three factors that increase reaction rate.", back:"Higher concentration, higher temperature, greater surface area (or a catalyst)."},
     {front:"What is a catalyst's role in a reaction?", back:"It speeds up the rate by lowering activation energy, without being consumed."},
     {front:"Give a biological example of a catalyst.", back:"Enzymes, which speed up biochemical reactions in cells."}
   ]},
  {id:"chem-equilibrium", subject:"chemistry", title:"Chemical Equilibrium", icon:"⚖️",
   tag:"Physical Chemistry",
   explanation:"In a reversible reaction, equilibrium is reached when the forward and reverse reactions occur at the same rate, so the concentrations of reactants and products remain constant (though not necessarily equal). Le Chatelier's principle predicts how equilibrium shifts in response to changes in conditions.",
   analogy:"Equilibrium is like two identical escalators moving people up and down between two floors at the same rate — the number of people on each floor stays constant, even though people are constantly moving between them.",
   keyTerms:["Reversible reaction","Dynamic equilibrium","Le Chatelier's principle","Equilibrium shift"],
   example:"If more reactant is added to a reaction at equilibrium, Le Chatelier's principle predicts the equilibrium will shift to produce more product, partially opposing the change.",
   medicalConnection:"The equilibrium between haemoglobin and oxygen in the blood — how readily haemoglobin binds and releases oxygen — is essential to how oxygen is delivered to body tissues.",
   memoryTrick:"\"Equilibrium isn't equal, it's constant\" — concentrations stay steady, but they don't have to be equal to each other.",
   commonMistake:"Believing equilibrium means the reaction has stopped — it hasn't; forward and reverse reactions are still happening, just at matching rates.",
   goingDeeper:"The equilibrium constant (Kc or Kp) is a fixed numerical value at a given temperature that describes exactly how far a reversible reaction proceeds before reaching equilibrium — a very large equilibrium constant means the reaction strongly favours products, while a very small one means it barely proceeds at all before settling. Unlike concentrations, which can shift when conditions change, the equilibrium constant itself only changes if temperature changes, which is a useful way to distinguish 'shifting the position of equilibrium' (caused by concentration or pressure changes) from 'genuinely changing how far the reaction goes' (caused only by temperature changes).",
   testYourself:[
     {q:"At chemical equilibrium:", options:["The reaction has completely stopped","Forward and reverse reaction rates are equal","Only the forward reaction occurs","All reactants have become products"], answer:1, explain:"Equilibrium means the forward and reverse rates are equal, not that the reaction has stopped."},
     {q:"Le Chatelier's principle predicts that adding more reactant to a system at equilibrium will:", options:["Shift equilibrium to produce more product","Shift equilibrium to produce more reactant","Have no effect","Stop the reaction"], answer:0, explain:"The system shifts to partially oppose the change, producing more product."},
     {q:"Which best describes 'dynamic' equilibrium?", options:["Nothing is happening at all","Both reactions continue at equal, matching rates","Only reactants remain","Only products remain"], answer:1, explain:"Dynamic equilibrium means both reactions are still occurring, just at equal rates."}
   ],
   flashcards:[
     {front:"What is dynamic equilibrium?", back:"A state where forward and reverse reactions occur at the same rate, keeping concentrations constant."},
     {front:"State Le Chatelier's principle in one line.", back:"A system at equilibrium shifts to partially oppose any change imposed on it."},
     {front:"Give a medical example of equilibrium.", back:"The binding and release of oxygen by haemoglobin in the blood."}
   ]},
  {id:"chem-redox", subject:"chemistry", title:"Redox Reactions (Oxidation & Reduction)", icon:"🔋",
   tag:"Physical Chemistry",
   explanation:"Redox reactions involve the transfer of electrons between substances. Oxidation is the loss of electrons; reduction is the gain of electrons. These always occur together — one substance cannot be oxidised without another being reduced.",
   analogy:"Think of electrons like a ball being passed in a game: one player loses the ball (is oxidised) at the exact same moment another player gains it (is reduced) — you can't have one without the other.",
   keyTerms:["Oxidation","Reduction","Oxidising agent","Reducing agent","Electron transfer"],
   example:"When iron rusts, iron atoms lose electrons (are oxidised) to oxygen, which gains those electrons (is reduced), forming iron oxide.",
   medicalConnection:"Redox reactions are central to cellular respiration, where glucose is oxidised and oxygen is reduced to release the energy cells need — and to how antioxidants in the body neutralise harmful reactive molecules.",
   memoryTrick:"\"OIL RIG\" — Oxidation Is Loss, Reduction Is Gain (of electrons).",
   commonMistake:"Confusing which substance is 'the oxidising agent' — the oxidising agent is the substance that gets reduced (it causes oxidation in something else by accepting electrons).",
   goingDeeper:"Chemists track electron transfer in redox reactions using oxidation numbers — a bookkeeping system that assigns each atom in a compound a number representing its 'apparent' charge, based on a consistent set of rules. An increase in oxidation number during a reaction signals oxidation (electron loss), while a decrease signals reduction (electron gain), even in reactions where electrons aren't obviously changing hands as cleanly as they do between simple ions — this is especially useful for tracking redox changes in more complex organic and biological molecules, where full electron transfer isn't always visually obvious from the structure alone.",
   testYourself:[
     {q:"Oxidation is defined as the:", options:["Gain of electrons","Loss of electrons","Gain of protons","Loss of neutrons"], answer:1, explain:"Oxidation Is Loss of electrons (OIL RIG)."},
     {q:"In a redox reaction, the substance that is reduced:", options:["Loses electrons","Gains electrons","Loses protons","Stays unchanged"], answer:1, explain:"Reduction is the gain of electrons."},
     {q:"The oxidising agent in a reaction is the substance that:", options:["Is oxidised itself","Causes another substance to be oxidised by accepting electrons","Never reacts","Is always a metal"], answer:1, explain:"An oxidising agent gets reduced itself, while causing oxidation in another substance."}
   ],
   flashcards:[
     {front:"What does OIL RIG stand for?", back:"Oxidation Is Loss, Reduction Is Gain (of electrons)."},
     {front:"What happens to the oxidising agent in a redox reaction?", back:"It gets reduced (gains electrons)."},
     {front:"Give a biological example of a redox reaction.", back:"Cellular respiration, where glucose is oxidised and oxygen is reduced."}
   ]},
  {id:"chem-electrochem", subject:"chemistry", title:"Electrochemistry", icon:"🔌",
   tag:"Physical Chemistry",
   explanation:"Electrochemistry studies the relationship between chemical reactions and electricity. In electrochemical cells (like batteries), spontaneous redox reactions generate an electric current by moving electrons through an external circuit.",
   analogy:"An electrochemical cell is like water flowing downhill through a water wheel: the 'downhill' flow of electrons from one substance to another can be harnessed to do useful work, just like the wheel harnesses flowing water.",
   keyTerms:["Electrode","Electrolyte","Anode","Cathode","Voltaic (galvanic) cell","Electrolysis"],
   example:"A simple battery uses a spontaneous redox reaction between two different metals in an electrolyte to generate a flow of electrons — an electric current.",
   medicalConnection:"Electrochemical principles underlie devices like pacemakers and blood glucose sensors, which rely on small, controlled electrical or redox-based signals to function.",
   memoryTrick:"\"AN OX, RED CAT\" — ANode = OXidation, REDuction = CAThode.",
   commonMistake:"Mixing up anode and cathode between voltaic cells and electrolytic cells — the electrode where oxidation occurs is always the anode, but which electrode is positive or negative depends on the cell type.",
   goingDeeper:"The voltage a voltaic cell produces depends on the specific pair of metals (or half-reactions) used — some combinations produce a strong 'pull' on electrons and a high voltage, while others produce only a weak one. This is captured by a ranked list called the electrochemical series (or reactivity series), which predicts not only how strong a cell's voltage will be but also which metal will act as the anode (losing electrons) and which will act as the cathode (gaining electrons) in any given pairing, without needing to test every possible combination experimentally.",
   testYourself:[
     {q:"In an electrochemical cell, oxidation always occurs at the:", options:["Cathode","Anode","Salt bridge","Wire"], answer:1, explain:"Oxidation always occurs at the anode, regardless of cell type."},
     {q:"A voltaic (galvanic) cell converts:", options:["Electrical energy into chemical energy","Chemical energy into electrical energy","Heat into light","Light into electricity"], answer:1, explain:"Voltaic cells generate electricity from a spontaneous chemical (redox) reaction."},
     {q:"Electrolysis uses electrical energy to:", options:["Prevent a reaction from happening","Drive a non-spontaneous chemical reaction","Measure temperature","Increase pH only"], answer:1, explain:"Electrolysis forces a non-spontaneous reaction to occur using an external electrical current."}
   ],
   flashcards:[
     {front:"What does 'AN OX, RED CAT' help you remember?", back:"ANode = OXidation; REDuction = CAThode."},
     {front:"What does a voltaic cell convert?", back:"Chemical energy into electrical energy, via a spontaneous redox reaction."},
     {front:"Name one medical device that relies on electrochemical principles.", back:"A pacemaker or a blood glucose sensor."}
   ]},
  {id:"chem-orgintro", subject:"chemistry", title:"Introduction to Organic Chemistry & Functional Groups", icon:"🧫",
   tag:"Organic Chemistry",
   explanation:"Organic chemistry is the study of carbon-based compounds. Carbon's ability to form four strong bonds allows it to build long chains, rings and branched structures. A functional group is a specific group of atoms within a molecule that gives it characteristic chemical properties.",
   analogy:"Think of a carbon skeleton as the frame of a house, and functional groups as the fittings (a kitchen, a bathroom) — the frame can be similar across many houses, but the fittings determine what each house is used for.",
   keyTerms:["Hydrocarbon","Functional group","Homologous series","Saturated","Unsaturated"],
   example:"Ethanol (an alcohol) and ethanoic acid (a carboxylic acid) both have a two-carbon backbone, but their different functional groups (-OH versus -COOH) give them very different properties.",
   medicalConnection:"Functional groups determine how drugs interact with the body — for example, the specific functional groups on a painkiller molecule determine how it is absorbed, how it acts, and how it is eventually broken down and removed.",
   memoryTrick:"\"Same skeleton, different outfit\" — the carbon backbone can stay similar while the functional group changes the compound's identity and behaviour.",
   commonMistake:"Assuming all organic compounds are 'natural' or biological — organic chemistry simply refers to carbon-based compounds, which includes many synthetic and industrial substances too.",
   goingDeeper:"Organic compounds are grouped into 'homologous series' — families of compounds sharing the same functional group and general formula, differing only by the number of CH₂ units in their chain (like the alkanes: methane, ethane, propane, butane...). Members of the same homologous series show a predictable, gradual change in physical properties (like boiling point) as chain length increases, which is precisely why organic chemists can often predict an unfamiliar compound's approximate properties just from knowing which homologous series it belongs to and how long its carbon chain is.",
   testYourself:[
     {q:"Organic chemistry is defined as the study of:", options:["All naturally occurring substances","Carbon-based compounds","Only living organisms","Metals and their alloys"], answer:1, explain:"Organic chemistry studies carbon-based compounds, whether natural or synthetic."},
     {q:"A functional group is:", options:["The entire carbon skeleton of a molecule","A specific group of atoms giving a molecule characteristic properties","Only found in inorganic compounds","Always a metal ion"], answer:1, explain:"A functional group is a specific atom arrangement that determines a molecule's characteristic chemistry."},
     {q:"Ethanol and ethanoic acid differ mainly in their:", options:["Number of carbon atoms","Functional group","Molecular mass only","Physical state at room temperature only"], answer:1, explain:"Both have similar carbon backbones but different functional groups (-OH vs -COOH)."}
   ],
   flashcards:[
     {front:"What does organic chemistry study?", back:"Carbon-based compounds."},
     {front:"What is a functional group?", back:"A specific group of atoms within a molecule that gives it characteristic chemical properties."},
     {front:"Why do functional groups matter in pharmacology?", back:"They determine how a drug is absorbed, how it acts, and how the body breaks it down."}
   ]},
  {id:"chem-isomerism", subject:"chemistry", title:"Isomerism", icon:"🔀",
   tag:"Organic Chemistry",
   explanation:"Isomers are compounds with the same molecular formula but different arrangements of atoms, giving them different structures and often different properties. Structural isomers differ in how atoms are connected; stereoisomers differ in spatial arrangement.",
   analogy:"Isomers are like two houses built from exactly the same set of building materials but assembled into different floor plans — same 'ingredients,' different structure and function.",
   keyTerms:["Structural isomer","Stereoisomer","Molecular formula","Chain isomerism","Functional group isomerism"],
   example:"Butane and methylpropane both have the molecular formula C₄H₁₀, but butane is a straight chain while methylpropane is branched — making them structural isomers.",
   medicalConnection:"Isomerism matters greatly in pharmacology: different isomers of the same drug molecule can have very different effects on the body, with one isomer sometimes active and its mirror-image isomer inactive or even harmful.",
   memoryTrick:"\"Same formula, different form\" — isomers always share a molecular formula but never share the exact same structure.",
   commonMistake:"Assuming isomers automatically have identical properties because they share a molecular formula — their different structures often give them different physical and chemical properties.",
   goingDeeper:"Beyond structural isomers, stereoisomers present an even subtler challenge: they share not just the same molecular formula but the exact same atom-to-atom connections, differing only in how their atoms are arranged in 3D space. The most clinically important type is optical isomerism, where two mirror-image forms of a molecule (like your left and right hand) cannot be superimposed on each other — this is exactly the phenomenon behind cases where one mirror-image form of a drug is therapeutically active while the other is inactive or produces unwanted side effects, making the distinction far more than just an academic curiosity.",
   testYourself:[
     {q:"Isomers share the same:", options:["Structure","Molecular formula","Boiling point always","Smell always"], answer:1, explain:"Isomers share a molecular formula but differ in structure."},
     {q:"Butane and methylpropane (both C4H10) are examples of:", options:["The same compound written differently","Structural isomers","Isotopes","Allotropes"], answer:1, explain:"They have the same formula but different structures (straight-chain vs branched) — structural isomers."},
     {q:"Why does isomerism matter in pharmacology?", options:["It never matters clinically","Different isomers of a drug can have very different biological effects","All isomers of a drug are identical in effect","Isomers only affect colour"], answer:1, explain:"One isomer may be therapeutically active while its mirror-image isomer is inactive or harmful."}
   ],
   flashcards:[
     {front:"Define isomers.", back:"Compounds with the same molecular formula but different structural arrangements."},
