   commonMistake:"Confusing current and voltage — current is the flow of charge itself (like the flow rate of water), while voltage is the 'push' that causes that flow (like water pressure); they are related but not the same quantity.",
   goingDeeper:"The human body itself conducts electricity, which is both how medical devices like ECGs and defibrillators work, and why electrical safety matters so much in clinical settings: a large enough current passing through the heart can disrupt its normal electrical rhythm, which is exactly the mechanism behind both accidental electric shock injury and the deliberate, controlled shock delivered by a defibrillator to reset a dangerously irregular heart rhythm back to normal.",
   testYourself:[
     {q:"Ohm's law is expressed as:", options:["V = I + R","V = I × R","V = I ÷ R","V = R ÷ I"], answer:1, explain:"Ohm's law states voltage equals current multiplied by resistance (V = IR)."},
     {q:"A circuit with a 12V supply and 4Ω resistance carries a current of:", options:["48A","3A","16A","8A"], answer:1, explain:"I = V ÷ R = 12 ÷ 4 = 3A."},
     {q:"An ECG (electrocardiogram) measures:", options:["Blood pressure","The heart's electrical activity via tiny voltage changes on the skin","Blood oxygen levels","Body temperature"], answer:1, explain:"An ECG detects the small voltage changes produced by the heart's electrical conduction system."}
   ],
   flashcards:[
     {front:"State Ohm's law.", back:"V = IR (voltage = current × resistance)."},
     {front:"What is the unit of electric current?", back:"The ampere (A)."},
     {front:"How does a defibrillator work, in basic physics terms?", back:"It delivers a controlled electric shock to disrupt a dangerous heart rhythm and allow it to reset to a normal pattern."}
   ]},
  {id:"phy-circuits", subject:"physics", title:"Electric Circuits", icon:"🔌",
   tag:"Electricity",
   explanation:"In a series circuit, components are connected one after another along a single path, so the same current flows through each one, and the total resistance is the sum of all individual resistances. In a parallel circuit, components are connected across separate branches, so voltage is the same across each branch, while current divides between them, and total resistance decreases as more branches are added.",
   analogy:"A series circuit is like a single-lane road where every car must pass through every checkpoint in order — if one checkpoint closes, no cars get through at all. A parallel circuit is like several separate lanes side by side — closing one lane doesn't stop traffic in the others.",
   keyTerms:["Series circuit","Parallel circuit","Total resistance","Current divider","Circuit diagram"],
   example:"If one bulb burns out in a series circuit of Christmas lights, the whole string of lights goes out, because the single path for current has been broken — this doesn't happen in a properly wired parallel circuit.",
   medicalConnection:"Hospital equipment is generally wired in parallel (not series) for safety and reliability — if one device fails or is switched off, the rest of the circuit (and other connected equipment) continues to function normally, which is critical when multiple devices are monitoring or supporting a patient at once.",
   memoryTrick:"\"Series = same current, splits voltage. Parallel = same voltage, splits current.\"",
   commonMistake:"Assuming adding more resistors to a circuit always increases total resistance — this is true for resistors in series, but adding more resistors in parallel actually decreases the total resistance, since it creates more paths for current to flow.",
   goingDeeper:"Most real-world electrical systems — including household and hospital wiring — are wired in parallel rather than series, specifically because parallel circuits allow each device to operate independently at the same voltage, and a fault or shutdown in one device doesn't interrupt the others. This is a critical safety principle in a hospital setting: if a single faulty piece of equipment is switched off or trips a breaker, it must not also disable other, unrelated life-support or monitoring equipment connected to the same electrical supply.",
   testYourself:[
     {q:"In a series circuit, if one component fails (breaks the path), the rest of the circuit:", options:["Continues working normally","Stops working, since there's only one current path","Gets a voltage boost","Automatically reroutes"], answer:1, explain:"A series circuit has only one path, so a break anywhere stops current everywhere."},
     {q:"Adding more resistors in parallel causes total resistance to:", options:["Increase","Decrease","Stay exactly the same","Become infinite"], answer:1, explain:"More parallel paths for current to flow through decreases total resistance."},
     {q:"Hospital equipment is typically wired in parallel mainly because:", options:["It's cheaper to install","One device failing won't disable the rest of the connected equipment","Parallel circuits use less electricity","Series wiring is illegal"], answer:1, explain:"Parallel wiring means each device operates independently, so one failure doesn't disable others — critical for patient safety."}
   ],
   flashcards:[
     {front:"In a series circuit, what happens if one component fails?", back:"The whole circuit stops working, since there's only one current path."},
     {front:"In a parallel circuit, what stays the same across each branch?", back:"The voltage."},
     {front:"Why is hospital equipment typically wired in parallel?", back:"So one device failing doesn't disable the rest of the connected equipment — important for patient safety."}
   ]},
  {id:"phy-optics", subject:"physics", title:"Reflection & Refraction of Light", icon:"🔍",
   tag:"Optics",
   explanation:"Reflection occurs when light bounces off a surface, following the law of reflection: the angle of incidence equals the angle of reflection. Refraction occurs when light passes from one medium into another (like air into water) and changes speed, causing it to bend at the boundary between the two media.",
   analogy:"Refraction is like a car's wheels hitting a patch of mud at an angle: the wheel that hits the mud first slows down while the other wheel keeps moving at normal speed, causing the whole car to turn — light bends in the same way when one side of the wave front slows down before the other as it enters a new medium.",
   keyTerms:["Reflection","Refraction","Angle of incidence","Angle of refraction","Refractive index","Total internal reflection"],
   example:"A straw in a glass of water appears to 'bend' at the water's surface — this is refraction, caused by light changing speed as it passes from water into air on its way to your eye.",
   medicalConnection:"Endoscopes and fibre-optic medical instruments rely on total internal reflection — a special case of refraction where light hitting a boundary at a steep enough angle reflects entirely back inside the fibre instead of escaping, allowing light (and images) to be guided deep into the body through a thin, flexible cable.",
   memoryTrick:"\"Angle in = Angle out\" for reflection; \"bends toward the normal entering a denser medium\" for refraction.",
   commonMistake:"Assuming light always bends the same way regardless of which medium it's entering — light bends toward the normal (an imaginary line perpendicular to the surface) when entering a denser medium, and away from the normal when entering a less dense medium.",
   goingDeeper:"Total internal reflection only happens when light travels from a denser medium into a less dense one, and only when it hits the boundary at an angle steeper than a specific 'critical angle' — below that angle, some light still escapes (refracts) through the boundary as well. This is precisely how optical fibres, including those in medical endoscopes, work: light entering the fibre at a steep enough angle keeps reflecting internally along the entire length of the fibre, no matter how many times it bends, allowing it to carry an image or light source around corners and deep into the body with minimal loss.",
   testYourself:[
     {q:"The law of reflection states that:", options:["The angle of incidence is always greater than the angle of reflection","The angle of incidence equals the angle of reflection","Light always reflects at 90 degrees","Reflection only happens with mirrors"], answer:1, explain:"The law of reflection: angle of incidence = angle of reflection."},
     {q:"Refraction occurs because light:", options:["Loses all its energy at a boundary","Changes speed when passing between different media","Only travels in straight lines with no exceptions","Stops moving entirely at boundaries"], answer:1, explain:"Refraction is caused by light changing speed as it moves from one medium into another."},
     {q:"Total internal reflection, used in medical endoscopes, requires light to:", options:["Travel from a less dense into a denser medium at any angle","Travel from a denser into a less dense medium, at an angle steeper than the critical angle","Only occur in a vacuum","Never actually occur in real fibres"], answer:1, explain:"Total internal reflection occurs when light in a denser medium hits the boundary at an angle steeper than the critical angle."}
   ],
   flashcards:[
     {front:"State the law of reflection.", back:"The angle of incidence equals the angle of reflection."},
     {front:"What causes refraction?", back:"Light changing speed as it passes from one medium into another."},
     {front:"How do medical endoscopes use total internal reflection?", back:"Light entering the fibre at a steep angle keeps reflecting internally along the fibre's length, carrying light/images deep into the body."}
   ]},
  {id:"phy-lensesmirrors", subject:"physics", title:"Lenses & Mirrors", icon:"👓",
   tag:"Optics",
   explanation:"A convex (converging) lens bulges outward and bends light rays inward to a focal point, while a concave (diverging) lens curves inward and spreads light rays apart. Mirrors work similarly by reflection rather than refraction: concave mirrors converge reflected light, while convex mirrors diverge it. The images formed can be real or virtual, magnified or reduced, depending on the lens/mirror type and the object's distance.",
   analogy:"A convex lens is like cupping your hands to gather scattered raindrops into a single stream (converging light to a point); a concave lens is like a fan blowing air outward from a central point in every direction (spreading light apart).",
   keyTerms:["Convex lens","Concave lens","Focal point","Real image","Virtual image","Magnification"],
   example:"A magnifying glass is a convex lens: held close to an object, it produces a magnified, virtual image that appears larger than the object actually is.",
   medicalConnection:"The human eye itself works like a lens system — the cornea and the eye's own lens bend incoming light to focus it onto the retina; common vision problems like short-sightedness and long-sightedness occur when this focusing goes wrong, which is corrected using external convex or concave lenses (glasses or contact lenses).",
   memoryTrick:"\"Convex COllects light, Concave CAsts it apart\" — a simple way to remember which lens does which.",
   commonMistake:"Assuming all lenses and mirrors form the same type of image — the type of image (real/virtual, magnified/reduced) depends on both the lens or mirror type and how far the object is from it, not on the lens type alone.",
   goingDeeper:"Short-sightedness (myopia) occurs when the eye focuses incoming light slightly in front of the retina rather than directly on it, usually because the eyeball is slightly too long or the lens focuses too strongly — this is corrected with a concave lens, which diverges light slightly before it enters the eye so it now focuses correctly on the retina. Long-sightedness (hyperopia) is the opposite problem, where light would focus behind the retina, and is corrected with a convex lens that adds extra converging power. This is the same core lens physics used in both corrective eyewear and many optical medical instruments.",
   testYourself:[
     {q:"A convex lens is also called a:", options:["Diverging lens","Converging lens","Flat lens","Reflective lens"], answer:1, explain:"A convex lens bends light rays inward toward a focal point, making it a converging lens."},
     {q:"A magnifying glass held close to an object produces a:", options:["Reduced, real image","Magnified, virtual image","Inverted, real image only","No image at all"], answer:1, explain:"A convex lens used as a magnifying glass produces a magnified, virtual image."},
     {q:"Short-sightedness (myopia) is typically corrected using a:", options:["Convex lens","Concave lens","Flat mirror","No correction is possible"], answer:1, explain:"A concave lens diverges light slightly so it focuses correctly on the retina in short-sighted eyes."}
   ],
   flashcards:[
     {front:"What does a convex lens do to light rays?", back:"Converges them inward toward a focal point."},
     {front:"What does a concave lens do to light rays?", back:"Diverges (spreads) them apart."},
     {front:"How is short-sightedness (myopia) typically corrected?", back:"With a concave lens, which diverges light so it focuses correctly on the retina."}
   ]},
  {id:"phy-atomicnuclear", subject:"physics", title:"Atomic & Nuclear Structure", icon:"⚛️",
   tag:"Modern Physics",
   explanation:"While chemistry focuses on how electrons determine bonding, nuclear physics focuses on the nucleus itself — the tightly packed protons and neutrons at an atom's centre. The nucleus is held together by the strong nuclear force, which is powerful enough over very short distances to overcome the electrical repulsion between positively charged protons packed closely together.",
   analogy:"Protons repelling each other in the nucleus is like trying to force several magnets of the same pole together — it takes an extremely strong, short-range 'glue' (the strong nuclear force) to hold them together at such close range, far stronger than the everyday electrical and gravitational forces we're used to.",
   keyTerms:["Nucleus","Strong nuclear force","Nuclear stability","Binding energy","Isotope"],
   example:"Some combinations of protons and neutrons form a stable, long-lasting nucleus, while others are unstable and will eventually break down — this instability is the basis of radioactive decay.",
   medicalConnection:"Understanding nuclear stability underlies why certain isotopes are chosen for medical use: stable isotopes are safe for structural or dietary purposes, while carefully selected unstable (radioactive) isotopes are deliberately used in diagnostic imaging and cancer treatment, chosen specifically for how and how quickly they decay.",
   memoryTrick:"\"Strong force is short but strong\" — it dominates only at nuclear distances, but overwhelms electrical repulsion at that range.",
   commonMistake:"Assuming all nuclei are equally stable — nuclear stability depends heavily on the specific ratio of protons to neutrons, and nuclei outside a certain stable ratio range are inherently unstable and will eventually undergo radioactive decay.",
   goingDeeper:"A stable nucleus actually has slightly less mass than the sum of its individual separated protons and neutrons — the 'missing' mass has been converted into the binding energy holding the nucleus together, following Einstein's famous E = mc² relationship. This is precisely why nuclear reactions (fission and fusion) release so much more energy than ordinary chemical reactions: they involve converting a small amount of nuclear mass directly into a very large amount of energy, since the speed of light squared (c²) is an enormous conversion factor.",
   testYourself:[
     {q:"The nucleus of an atom is held together by the:", options:["Electrical force alone","Gravitational force alone","Strong nuclear force","Magnetic force"], answer:2, explain:"The strong nuclear force holds protons and neutrons together in the nucleus, overcoming proton-proton repulsion at short range."},
     {q:"Nuclear stability mainly depends on:", options:["The colour of the atom","The specific ratio of protons to neutrons","The number of electrons only","The atom's temperature"], answer:1, explain:"Whether a nucleus is stable depends heavily on its specific proton-to-neutron ratio."},
     {q:"Binding energy in a nucleus comes from:", options:["Electron movement","A small amount of mass converted to energy (E = mc²)","Chemical bonds","Heat stored in the nucleus"], answer:1, explain:"A stable nucleus has slightly less mass than its separated parts, with the difference converted to binding energy."}
   ],
   flashcards:[
     {front:"What force holds the nucleus together?", back:"The strong nuclear force."},
     {front:"What determines whether a nucleus is stable or unstable?", back:"Its specific ratio of protons to neutrons."},
     {front:"Where does nuclear binding energy come from?", back:"A small amount of the nucleus's mass, converted to energy via E = mc²."}
   ]},
  {id:"phy-radioactivity", subject:"physics", title:"Radioactivity & Radiation", icon:"☢️",
   tag:"Modern Physics",
   explanation:"Radioactive decay is the spontaneous breakdown of an unstable nucleus, releasing radiation in the process. The three main types are alpha decay (releasing a helium nucleus — 2 protons and 2 neutrons), beta decay (releasing a high-speed electron as a neutron converts to a proton), and gamma decay (releasing high-energy electromagnetic radiation, with no change in the nucleus's protons or neutrons). Half-life is the time it takes for half of a radioactive sample to decay.",
   analogy:"Half-life is like a crowd slowly leaving a stadium: it isn't that the whole crowd suddenly vanishes, but every fixed time interval, half of whoever remains has left — the same principle governs radioactive decay, just applied to atoms instead of people.",
   keyTerms:["Alpha decay","Beta decay","Gamma decay","Half-life","Ionising radiation"],
   example:"A radioactive isotope with a half-life of 8 days will have half its original activity after 8 days, a quarter after 16 days, and an eighth after 24 days — the amount never quite reaches zero, but keeps halving indefinitely.",
   medicalConnection:"Radioactive isotopes with carefully chosen half-lives and decay types are used throughout medicine — for example, in diagnostic imaging (where a short half-life limits a patient's radiation exposure) and in targeted radiotherapy for cancer treatment (where the radiation is used deliberately to damage cancerous tissue).",
   memoryTrick:"\"Alpha is heaviest and stopped easiest, gamma is lightest and penetrates deepest\" — a rough guide to how far each type of radiation can travel through matter.",
   commonMistake:"Assuming all types of radioactive decay are equally dangerous or penetrating — alpha particles are stopped by just a sheet of paper or skin, beta particles need a few millimetres of material (like aluminium) to be stopped, while gamma rays require thick lead or concrete to significantly reduce them, making each type relevant in very different situations.",
   goingDeeper:"The differing penetrating power of alpha, beta and gamma radiation has direct clinical consequences: an alpha-emitting source is relatively harmless outside the body (stopped by skin) but extremely dangerous if inhaled or ingested, since it can then irradiate internal tissue directly at close range with no protective barrier at all. This is why radiation safety protocols differ so much depending on the type of radioactive material involved and, critically, whether exposure is external (where shielding and distance help most) or internal (where preventing ingestion or inhalation in the first place is the priority).",
   testYourself:[
     {q:"Alpha decay releases:", options:["A high-speed electron","A helium nucleus (2 protons, 2 neutrons)","Pure electromagnetic radiation","A neutron only"], answer:1, explain:"Alpha decay releases an alpha particle, which is a helium nucleus."},
     {q:"A radioactive sample with a half-life of 8 days will have what fraction of its original activity remaining after 16 days?", options:["Half","A quarter","None at all","Three-quarters"], answer:1, explain:"After two half-lives (16 days), a quarter of the original activity remains (½ × ½)."},
     {q:"Which type of radiation requires the thickest shielding (like lead) to significantly reduce it?", options:["Alpha","Beta","Gamma","None require shielding"], answer:2, explain:"Gamma radiation is the most penetrating and requires thick, dense shielding like lead or concrete."}
   ],
   flashcards:[
     {front:"What is released in alpha decay?", back:"An alpha particle — a helium nucleus (2 protons, 2 neutrons)."},
     {front:"Define half-life.", back:"The time it takes for half of a radioactive sample to decay."},
     {front:"Why is an alpha-emitting source more dangerous inside the body than outside?", back:"Alpha particles are stopped by skin externally, but can irradiate tissue directly at close range if inhaled or ingested."}
   ]},
  {id:"phy-medicalimaging", subject:"physics", title:"Medical Imaging: X-rays, Ultrasound, CT & MRI", icon:"🖥️",
   tag:"Modern Physics",
   explanation:"Different medical imaging techniques rely on different physical principles. X-rays use high-energy electromagnetic radiation that passes more easily through soft tissue than dense structures like bone, creating a shadow-like image. Ultrasound uses high-frequency sound waves reflected off internal structures to build an image, with no radiation involved. CT (computed tomography) combines many X-ray images taken from different angles into detailed cross-sectional slices. MRI (magnetic resonance imaging) uses strong magnetic fields and radio waves to align and then detect signals from hydrogen atoms in the body's water and fat, producing detailed images without any ionising radiation at all.",
   analogy:"X-rays work like shining a light through a lampshade with a solid metal object inside — the dense object blocks more light, casting a clear shadow, while the thinner material around it lets more light through, exactly as bone blocks more X-rays than soft tissue does.",
   keyTerms:["X-ray","Ionising radiation","CT scan","Ultrasound","MRI","Contrast"],
   example:"A chest X-ray appears mostly dark (soft tissue and air let X-rays pass through easily) with white, dense-looking ribs and a bright heart shadow, because bone and denser tissue absorb more X-rays than the surrounding lung tissue.",
   medicalConnection:"Choosing the right imaging technique depends heavily on the underlying physics: X-rays and CT are excellent for bone and are fast, but involve ionising radiation; ultrasound is radiation-free and safe even in pregnancy, but has more limited detail for some structures; MRI gives outstanding soft-tissue detail without radiation, but is slower, more expensive, and unsuitable for patients with certain metal implants due to its strong magnetic field.",
   memoryTrick:"\"X-ray and CT use radiation, Ultrasound uses sound, MRI uses magnets\" — a simple way to separate the four techniques by their underlying physics.",
   commonMistake:"Assuming all imaging techniques use radiation — ultrasound uses sound waves and MRI uses magnetic fields and radio waves, neither of which involve ionising radiation, unlike X-rays and CT scans.",
   goingDeeper:"MRI's ability to distinguish soft tissues so clearly comes from the fact that different tissue types (like fat, muscle, and cerebrospinal fluid) contain hydrogen atoms in different chemical and physical environments, which causes them to release their absorbed radio-wave energy at slightly different rates once the magnetic field is removed — the scanner detects these differences and builds an image from them. CT, by contrast, distinguishes tissues mainly by density (how much X-ray radiation each tissue absorbs), which is why CT excels at imaging bone and detecting bleeding, while MRI excels at distinguishing between soft tissues of similar density, such as different structures within the brain.",

mathematics: [
  {id:"math-log", subject:"mathematics", title:"Logarithms", icon:"📐",
   tag:"Algebra",
   explanation:"A logarithm answers the question: 'to what power must this base be raised to get this number?' If bˣ = y, then logᵦ(y) = x. Logarithms are the inverse of exponentiation.",
   analogy:"If exponents are like climbing steps up (2³ = 8), logarithms ask how many steps you climbed to reach 8, starting from base 2.",
   keyTerms:["Base","Exponent","Logarithm","Natural log"],
   example:"Since 2³ = 8, we can say log₂(8) = 3.",
   medicalConnection:"The pH scale is logarithmic — each whole number change represents a tenfold change in hydrogen ion concentration, which is why small pH shifts in the body matter so much.",
   memoryTrick:"\"Log undoes exponent, exponent undoes log\" — they're inverse operations.",
   commonMistake:"Forgetting that log(a × b) = log(a) + log(b), not log(a) × log(b), is a very common algebra error.",
   goingDeeper:"Logarithms come in different 'bases' for different purposes: base 10 (written log) is common in general science and the pH scale, while base e (Euler's number, approximately 2.718), written ln, appears constantly in calculus and in natural growth/decay processes, including drug elimination and population growth. Regardless of which base is used, the core relationship stays the same — a logarithm always answers 'what power gets me from the base to this number' — which is why switching between bases (using the change-of-base formula) is a routine, mechanical step rather than a fundamentally different type of calculation.",
   testYourself:[
     {q:"If 2³ = 8, what is log₂(8)?", options:["2","3","8","16"], answer:1, explain:"The logarithm asks: 2 raised to what power gives 8? The answer is 3."},
     {q:"log(a × b) is equal to:", options:["log(a) × log(b)","log(a) + log(b)","log(a) − log(b)","log(a) / log(b)"], answer:1, explain:"The product rule of logarithms: log(ab) = log(a) + log(b)."},
     {q:"Logarithms are the inverse of:", options:["Addition","Subtraction","Exponentiation","Division"], answer:2, explain:"Logarithms 'undo' exponentiation, and vice versa."}
   ],
   flashcards:[

     {front:"What is the product rule of logarithms?", back:"log(a × b) = log(a) + log(b)."},
     {front:"Why is the pH scale considered logarithmic?", back:"Each whole-number change represents a tenfold change in H⁺ concentration."}
   ]},
  {id:"math-stats", subject:"mathematics", title:"Mean, Median & Mode", icon:"📊",
   tag:"Statistics",
   explanation:"These are three ways to describe the 'centre' of a data set. The mean is the average (sum ÷ count). The median is the middle value when data is ordered. The mode is the most frequently occurring value.",
   analogy:"If you and four friends have different amounts of money, the mean is what everyone would have if you pooled and split it evenly; the median is what the middle person has; the mode is the amount most people happen to have.",
   keyTerms:["Mean","Median","Mode","Range","Data set"],
   example:"For the data set 2, 3, 3, 5, 9: mean = 4.4, median = 3, mode = 3.",
   medicalConnection:"Clinical studies often report the mean and median patient outcomes (e.g. recovery time), since these summarise large data sets and help identify typical patient experiences.",
   memoryTrick:"\"Mean = share equally, Median = middle, Mode = most\" — three M's, three meanings.",
   commonMistake:"Forgetting to order the data set before finding the median often leads to picking the wrong 'middle' value.",
   goingDeeper:"Mean, median and mode can tell very different stories about the same data set, especially when the data is skewed (lopsided) rather than symmetric — a single very high or very low outlier can pull the mean noticeably in its direction, while the median remains far more resistant to that same outlier's influence, since it only cares about the position of the middle value, not its exact size. This is exactly why income data, house prices, and some clinical measurements are frequently reported using the median rather than the mean — it gives a more realistic picture of a 'typical' value when a small number of extreme values would otherwise distort the average.",
   testYourself:[
     {q:"What is the median of 2, 3, 3, 5, 9?", options:["2","3","4.4","9"], answer:1, explain:"When ordered, 3 is the middle value of this 5-number data set."},
     {q:"The mean is calculated by:", options:["Finding the middle value","Finding the most frequent value","Dividing the sum by the count","Subtracting the smallest from the largest"], answer:2, explain:"Mean = sum of all values ÷ number of values."},
     {q:"The mode of a data set is the:", options:["Middle value","Most frequent value","Average value","Largest value"], answer:1, explain:"Mode refers to the value(s) that occur most often."}
   ],
   flashcards:[
     {front:"How do you calculate the mean?", back:"Sum of all values divided by the number of values."},
     {front:"What is the median?", back:"The middle value of an ordered data set."},
     {front:"What is the mode?", back:"The most frequently occurring value in a data set."}
   ]},
  {id:"math-diff", subject:"mathematics", title:"Introduction to Differentiation", icon:"∫",
   tag:"Calculus",
   explanation:"Differentiation finds the rate at which a quantity changes — essentially, the gradient (slope) of a graph at any point. For a function y = xⁿ, the derivative is dy/dx = nxⁿ⁻¹.",
   analogy:"If a graph shows distance over time, differentiation tells you the speed at any instant — how fast the distance is changing at that exact moment.",
   keyTerms:["Derivative","Gradient","Rate of change","Power rule"],
   example:"For y = x³, the derivative dy/dx = 3x², using the power rule.",
   medicalConnection:"Rates of change appear throughout medicine — for example, describing how quickly a drug concentration changes in the bloodstream over time.",
   memoryTrick:"\"Bring the power down, then take one off\" — the power rule for differentiation.",
   commonMistake:"Forgetting to reduce the power by one after multiplying is one of the most common differentiation mistakes.",
   goingDeeper:"The power rule (bringing the power down and reducing it by one) is just one of several differentiation rules — sums are differentiated term by term, and more complex combinations of functions (like one function multiplied by another, or one function nested inside another) require additional rules, like the product rule and chain rule, built on top of this same basic foundation. Every one of these more advanced rules can ultimately be derived from the formal limit definition of a derivative, but the power rule alone is enough to differentiate an enormous range of the functions that come up in introductory science and medical mathematics.",
   testYourself:[
     {q:"What does differentiation calculate?", options:["The area under a curve","The rate of change (gradient)","The total sum of values","The average of a data set"], answer:1, explain:"Differentiation gives the instantaneous rate of change of a function."},
     {q:"Using the power rule, the derivative of x⁴ is:", options:["4x³","x³","4x⁵","x⁴"], answer:0, explain:"Bring the power down (4) and reduce the power by one: 4x³."},
     {q:"Differentiation is most closely related to finding a graph's:", options:["Intercept","Gradient","Symmetry","Domain"], answer:1, explain:"The derivative at a point equals the gradient of the graph at that point."}
   ],
   flashcards:[
     {front:"State the power rule for differentiation.", back:"For y = xⁿ, dy/dx = nxⁿ⁻¹."},
     {front:"What does a derivative represent graphically?", back:"The gradient (slope) of the graph at a given point."},
     {front:"Give a medical example of a rate of change.", back:"How quickly drug concentration changes in the bloodstream over time."}
   ]},
  {id:"math-indices", subject:"mathematics", title:"Indices (Laws of Indices)", icon:"🔢",
   tag:"Algebra",
   explanation:"Indices (also called exponents or powers) show how many times a number is multiplied by itself. A set of laws governs how to combine indices when multiplying, dividing, or raising powers to further powers — for example, aᵐ × aⁿ = aᵐ⁺ⁿ.",
   analogy:"Think of an index as a shorthand instruction: 2⁴ doesn't mean 2×4, it means 'multiply 2 by itself 4 times' (2×2×2×2) — the small raised number is just a compact way of writing repeated multiplication.",
   keyTerms:["Base","Index/Exponent","Power","Reciprocal","Zero index"],
   example:"2³ × 2² = 2⁵ = 32, since multiplying powers of the same base means adding the indices (3+2=5).",
   medicalConnection:"Indices appear throughout pharmacology and lab science, particularly in exponential drug elimination models and serial dilution calculations (like making a 10⁻³ dilution of a solution).",
   memoryTrick:"\"Multiply → Add indices. Divide → Subtract indices. Power of a power → Multiply indices.\"",
   commonMistake:"Assuming aⁿ + aᵐ can be simplified using index laws — the laws only apply to multiplication, division, and powers of powers, not addition; aⁿ + aᵐ generally cannot be simplified further.",
   goingDeeper:"Two special cases often confuse students at first: any non-zero number raised to the power of 0 equals 1 (a⁰ = 1), and a negative index means 'reciprocal' rather than 'negative number' (a⁻ⁿ = 1/aⁿ). Both of these rules fall directly out of the division law if you apply it consistently — for example, a³ ÷ a³ = a⁰ by the subtraction rule, but a³ ÷ a³ also obviously equals 1 by direct division, so a⁰ must equal 1; the same logic extends to explain why negative indices produce fractions rather than negative values.",
   testYourself:[
     {q:"2³ × 2² equals:", options:["2⁵","4⁵","2⁶","4⁶"], answer:0, explain:"When multiplying powers of the same base, add the indices: 3+2=5, giving 2⁵."},
     {q:"What is the value of any non-zero number raised to the power of 0?", options:["0","1","The number itself","Undefined"], answer:1, explain:"Any non-zero number raised to the power of 0 equals 1."},
     {q:"a⁻² is equivalent to:", options:["-a²","1/a²","-2a","2/a"], answer:1, explain:"A negative index means the reciprocal: a⁻² = 1/a²."}
   ],
   flashcards:[
     {front:"What is the rule for multiplying powers with the same base?", back:"Add the indices: aᵐ × aⁿ = aᵐ⁺ⁿ."},
     {front:"What does any non-zero number raised to the power 0 equal?", back:"1."},
     {front:"What does a negative index mean?", back:"The reciprocal: a⁻ⁿ = 1/aⁿ."}
   ]},
  {id:"math-surds", subject:"mathematics", title:"Surds", icon:"√",
   tag:"Algebra",
   explanation:"A surd is an irrational root — like √2 or √7 — that cannot be simplified into a whole number or exact fraction, and is left in root form to preserve exact accuracy rather than being rounded. Surds can be simplified, added/subtracted (if they share the same root), multiplied, and rationalised (removing a surd from the denominator of a fraction).",
   analogy:"A surd is like an exact measurement that simply can't be written as a 'neat' decimal — √2 really is a specific, exact value, it just happens that no terminating or repeating decimal can capture it exactly, so mathematicians leave it in root form rather than lose precision by rounding.",
   keyTerms:["Surd","Rationalise","Irrational number","Simplify"],
   example:"√50 can be simplified to 5√2, since 50 = 25 × 2, and √25 = 5.",
   medicalConnection:"Exact, unrounded values matter in precise scientific and dosage calculations, where rounding too early in a multi-step calculation can introduce small errors that compound by the final step — surds are a good introduction to the habit of keeping exact values until the very end of a calculation.",
   memoryTrick:"\"Only add or subtract surds with the same root\" — √2 + √2 = 2√2, but √2 + √3 cannot be simplified further.",
   commonMistake:"Assuming √a + √b = √(a+b) — this is not true; surds can only be combined this way through multiplication (√a × √b = √(ab)), not addition.",
   goingDeeper:"Rationalising the denominator — removing a surd from the bottom of a fraction — is done by multiplying both the numerator and denominator by a carefully chosen form of 1 (often the surd itself, or its conjugate for more complex denominators), which doesn't change the fraction's value but moves the irrational part to the numerator instead. Historically, this technique was actually essential for practical calculation, since doing long division by an irrational number by hand was far harder than dividing by a whole number — a good example of how a mathematical convention can outlive the original practical reason it was created for, yet remain useful today for clean, standardised answers.",
   testYourself:[
     {q:"√50 simplified is:", options:["5√2","10√5","25√2","2√5"], answer:0, explain:"50 = 25 × 2, and √25 = 5, so √50 = 5√2."},
     {q:"√2 + √2 equals:", options:["√4","2√2","2√4","4"], answer:1, explain:"Like surds can be added directly: √2 + √2 = 2√2."},
     {q:"√a × √b equals:", options:["√(a+b)","√(a-b)","√(ab)","a×b"], answer:2, explain:"Multiplying surds: √a × √b = √(ab)."}
   ],
   flashcards:[
     {front:"What is a surd?", back:"An irrational root (like √2) that cannot be simplified to a whole number or exact fraction."},
     {front:"When can you add or subtract two surds directly?", back:"Only when they share the same root (e.g. √2 + √2, not √2 + √3)."},
     {front:"What does 'rationalise the denominator' mean?", back:"Removing a surd from the bottom of a fraction, typically by multiplying top and bottom by a suitable form of the surd."}
   ]},
  {id:"math-equations", subject:"mathematics", title:"Solving Equations (Linear & Quadratic)", icon:"⚖️",
   tag:"Algebra",
   explanation:"A linear equation (like 2x + 3 = 11) has variables raised only to the power of 1, and is solved by isolating the variable using inverse operations. A quadratic equation (like x² + 5x + 6 = 0) includes a squared variable, and can be solved by factorising, completing the square, or using the quadratic formula.",
   analogy:"Solving an equation is like carefully unwrapping a gift, layer by layer, always undoing the outermost layer first — if a number was added last when the equation was built, it should be the first thing removed when solving it, working step by step back toward the variable.",
   keyTerms:["Linear equation","Quadratic equation","Factorising","Quadratic formula","Discriminant"],
   example:"Solving 2x + 3 = 11: subtract 3 from both sides (2x = 8), then divide by 2 (x = 4).",
   medicalConnection:"Linear equations underlie simple dosage calculations (like scaling a dose by body weight), while quadratic relationships appear in some physics and pharmacokinetic models describing how certain processes change over time or distance.",
   memoryTrick:"\"Whatever you do to one side, do to the other\" — the golden rule of solving any equation while keeping it balanced.",
   commonMistake:"Forgetting to apply an operation to BOTH sides of the equation equally — this is the single most common algebra mistake and immediately breaks the equation's balance.",
   goingDeeper:"The quadratic formula, x = (-b ± √(b²-4ac)) / 2a, works for any quadratic equation, even ones that don't factorise neatly — and the part under the square root (b²-4ac), called the discriminant, reveals how many real solutions exist before you even finish solving: a positive discriminant means two distinct real solutions, zero means exactly one repeated solution, and a negative discriminant means no real solutions at all (the graph never crosses the x-axis). This is a genuinely useful shortcut for quickly checking how many solutions to expect before committing to a full calculation.",
   testYourself:[
     {q:"Solving 2x + 3 = 11, x equals:", options:["4","7","8","14"], answer:0, explain:"2x = 8 (subtracting 3), then x = 4 (dividing by 2)."},
     {q:"The quadratic formula is used to solve equations of the form:", options:["ax + b = 0","ax² + bx + c = 0","a/x = b","ax = b/c"], answer:1, explain:"The quadratic formula solves any equation in the form ax² + bx + c = 0."},
     {q:"If a quadratic equation's discriminant (b²-4ac) is negative, this means:", options:["Two distinct real solutions","One repeated real solution","No real solutions","Infinite solutions"], answer:2, explain:"A negative discriminant means the equation has no real solutions."}
   ],
   flashcards:[
     {front:"State the quadratic formula.", back:"x = (-b ± √(b²-4ac)) / 2a"},
     {front:"What is the golden rule for solving any equation?", back:"Whatever operation you apply to one side, apply equally to the other side."},
     {front:"What does the discriminant (b²-4ac) tell you?", back:"How many real solutions a quadratic equation has: positive = 2, zero = 1, negative = 0."}
   ]},
  {id:"math-inequalities", subject:"mathematics", title:"Inequalities", icon:"≤",
   tag:"Algebra",
   explanation:"An inequality compares two expressions using symbols like < (less than), > (greater than), ≤, or ≥, rather than an equals sign, describing a range of possible values rather than a single exact answer. Inequalities are solved much like equations, with one crucial extra rule: multiplying or dividing both sides by a negative number flips the inequality's direction.",
   analogy:"Think of an inequality as describing a whole 'zone' on a number line rather than a single exact spot — solving 'x > 3' doesn't give you one answer, it tells you the entire stretch of the number line where valid answers live.",
   keyTerms:["Inequality","Solution set","Number line","Flip the sign"],
   example:"Solving -2x > 6 requires dividing both sides by -2, which flips the inequality: x < -3.",
   medicalConnection:"Inequalities describe safe ranges constantly used in medicine — like 'normal blood pressure is below 120/80' or 'a healthy blood glucose range is between certain values' — representing a safe zone rather than one single exact number.",
   memoryTrick:"\"Negative multiply or divide? Flip the inequality!\" — the one rule that makes inequalities different from equations.",
   commonMistake:"Forgetting to flip the inequality sign when multiplying or dividing both sides by a negative number — this single missed step reverses the entire meaning of the solution.",
   goingDeeper:"Compound inequalities — like 2 < x ≤ 7 — describe a value trapped between two boundaries at once, and are solved by applying the same operation to all three parts simultaneously (the middle expression, and both boundary values). This kind of bounded range shows up constantly in real-world contexts described as 'normal' or 'safe' ranges — a lab result, a therapeutic drug level, or a healthy vital sign range are all, mathematically, just compound inequalities in disguise.",
   testYourself:[
     {q:"Solving -2x > 6 gives:", options:["x > -3","x < -3","x > 3","x < 3"], answer:1, explain:"Dividing both sides by -2 flips the inequality: x < -3."},
     {q:"When must you flip an inequality's direction?", options:["Whenever you add a number to both sides","Whenever you multiply or divide both sides by a negative number","Never — inequalities always stay the same direction","Only when solving for x"], answer:1, explain:"Multiplying or dividing by a negative number reverses the inequality's direction."},
     {q:"A compound inequality like 2 < x ≤ 7 describes:", options:["A single exact value","A value trapped between two boundaries","An impossible statement","Two separate, unrelated solutions"], answer:1, explain:"Compound inequalities describe a bounded range between two limits."}
   ],
   flashcards:[
     {front:"What is the one rule that makes solving inequalities different from equations?", back:"Multiplying or dividing both sides by a negative number flips the inequality's direction."},
     {front:"Give a medical example of an inequality describing a 'safe range'.", back:"A statement like 'normal blood pressure is below 120/80', describing an upper safe boundary."},
     {front:"What does a compound inequality like 2 < x ≤ 7 describe?", back:"A value bounded between two limits at once."}
   ]},
  {id:"math-ratios", subject:"mathematics", title:"Ratios, Proportions & Percentages", icon:"🔀",
   tag:"Foundations",
   explanation:"A ratio compares two or more quantities relative to each other (like 3:1), while a proportion states that two ratios are equal, allowing you to scale a known relationship up or down. A percentage is simply a special ratio expressed 'out of 100'. All three describe relative size rather than absolute amounts.",
   analogy:"A recipe ratio (like 2 parts flour to 1 part sugar) doesn't tell you exactly how much of each ingredient to use — it tells you how they must relate to each other, no matter how large or small the total batch is; proportion is the tool that scales that relationship to any specific batch size.",
   keyTerms:["Ratio","Proportion","Percentage","Scale factor","Cross-multiplication"],
   example:"If a drug's correct ratio is 5mg per 10kg of body weight, a 40kg patient needs a proportionally scaled dose: (5/10) × 40 = 20mg.",
   medicalConnection:"Ratio and proportion reasoning is the mathematical backbone of weight-based drug dosing, IV drip rate calculations, and diluting concentrated solutions to a specific working strength — all core clinical skills.",
   memoryTrick:"\"Same relationship, different scale\" — proportion is about keeping a ratio consistent as quantities change size.",
   commonMistake:"Setting up a proportion with mismatched units on each side (e.g. mixing mg on one side with grams on the other) — always convert to matching units before cross-multiplying.",
   goingDeeper:"Percentage change calculations (like 'a drug's concentration increased by 20%') are a frequent source of error because the reference point matters: a 20% increase followed by a 20% decrease does NOT return you to the original value, since the second percentage is calculated from a different (now larger) starting amount. This asymmetry is worth internalising early, since it explains many real-world situations where a value drops by some percentage and 'recovering the loss' actually requires a larger percentage increase than the original percentage decrease.",
   testYourself:[
     {q:"If a drug dose is 5mg per 10kg of body weight, what dose does a 40kg patient need?", options:["10mg","20mg","40mg","50mg"], answer:1, explain:"Scaling the ratio: (5/10) × 40 = 20mg."},
     {q:"A percentage is best described as:", options:["A ratio out of 10","A ratio out of 100","An absolute quantity","A type of fraction that can't be converted to a decimal"], answer:1, explain:"A percentage is a ratio expressed 'out of 100'."},
     {q:"If a value increases by 20% and then decreases by 20%, the final value is:", options:["Exactly the same as the original","Lower than the original","Higher than the original","Impossible to determine"], answer:1, explain:"The 20% decrease is calculated from the new, larger amount, so the final value ends up lower than the original."}
   ],
   flashcards:[
     {front:"What is the difference between a ratio and a proportion?", back:"A ratio compares quantities (e.g. 3:1); a proportion states that two ratios are equal, allowing scaling."},
     {front:"Give a clinical example that relies on ratio/proportion reasoning.", back:"Weight-based drug dosing (e.g. scaling a dose per kg of body weight)."},
     {front:"Does a 20% increase followed by a 20% decrease return you to the original value?", back:"No — the final value ends up lower, since the decrease is calculated from a larger starting amount."}
   ]},
  {id:"math-unitconv", subject:"mathematics", title:"Unit Conversions & Scientific Notation", icon:"🔁",
   tag:"Foundations",
   explanation:"Unit conversion means expressing the same quantity in different units (like converting millilitres to litres), using known conversion factors. Scientific notation expresses very large or very small numbers compactly as a number between 1 and 10 multiplied by a power of 10 (like 6.02 × 10²³), making extreme values far easier to read, write, and calculate with.",
   analogy:"Converting units is like exchanging currency — the actual value doesn't change, just how it's expressed; scientific notation is like using 'a million' instead of writing out '1,000,000' every time — same value, more manageable form.",
   keyTerms:["Conversion factor","Scientific notation","Standard form","Significant figures"],
   example:"0.00045 in scientific notation is written as 4.5 × 10⁻⁴, moving the decimal point 4 places to the right.",
   medicalConnection:"Unit conversion errors are a leading cause of medication dosing mistakes in real clinical settings — confusing millilitres with litres, or milligrams with micrograms, has caused serious, well-documented patient harm, making this skill far more than a classroom exercise.",
   memoryTrick:"\"Positive exponent = big number, negative exponent = small number\" — a quick way to sanity-check a scientific notation answer.",
   commonMistake:"Losing track of the direction to move the decimal point when converting to or from scientific notation — moving it the wrong way turns a very small number into a very large one, or vice versa.",
   goingDeeper:"When multiplying or dividing numbers in scientific notation, you can handle the two parts separately: multiply/divide the base numbers normally, then add (for multiplication) or subtract (for division) the exponents — following the same index laws covered elsewhere. This is exactly why scientific notation isn't just a neater way to write numbers; it also makes calculations with extremely large or small values (like Avogadro's number, or drug concentrations at the molecular level) genuinely faster and less error-prone than working with the full, unwieldy decimal form.",
   testYourself:[
     {q:"0.00045 in scientific notation is:", options:["4.5 × 10⁴","4.5 × 10⁻⁴","45 × 10⁻⁵","0.45 × 10⁻³"], answer:1, explain:"Moving the decimal 4 places to the right gives 4.5 × 10⁻⁴."},
     {q:"A negative exponent in scientific notation indicates:", options:["A negative number","A very large number","A very small number (less than 1)","An error"], answer:2, explain:"A negative exponent indicates a small number, less than 1."},
     {q:"When multiplying numbers in scientific notation, what happens to the exponents?", options:["They are multiplied together","They are added together","They are subtracted","They stay unchanged"], answer:1, explain:"When multiplying, the exponents are added (following the index law for multiplication)."}
   ],
   flashcards:[
     {front:"Write 0.00045 in scientific notation.", back:"4.5 × 10⁻⁴"},
     {front:"What does a positive exponent in scientific notation indicate?", back:"A large number (greater than or equal to 10)."},
     {front:"Why are unit conversion errors particularly dangerous in medicine?", back:"Confusing units like mg and μg, or mL and L, has caused serious, real-world dosing errors."}
   ]},
  {id:"math-dosage", subject:"mathematics", title:"Basic Dosage Mathematics", icon:"💊",
   tag:"Applied Mathematics",
   explanation:"Dosage calculations determine the correct amount of a medication to give a patient, typically based on the prescribed dose, the concentration of the available medication, and sometimes the patient's body weight. The core formula — 'what you want, divided by what you have, multiplied by the quantity it comes in' — is used across nearly all dosage problems, however they're worded.",
   analogy:"Dosage calculation is like a recipe conversion: if a recipe (the medication's concentration) tells you how much of an ingredient is in a certain amount, and you know how much of that ingredient you actually need (the prescribed dose), you can always work out exactly how much of the mixture to measure out.",
   keyTerms:["Prescribed dose","Concentration","Dose per kg","Formula method"],
   example:"If a patient needs 250mg of a medication, and it's available as a solution containing 500mg per 10mL, the required volume is (250/500) × 10 = 5mL.",
   medicalConnection:"Dosage calculation is one of the most safety-critical mathematical skills in healthcare — errors at this step can directly and immediately affect patient safety, which is why it's practised so heavily throughout medical, nursing and pharmacy training.",
   memoryTrick:"\"Want ÷ Have × Quantity\" — the standard formula method for dosage calculations.",
   commonMistake:"Failing to check that the prescribed dose and the available concentration are in the same units before calculating — mixing mg with g (or mcg) part-way through a calculation is a well-documented, serious source of real medication errors.",
   goingDeeper:"Weight-based dosing adds an extra layer to the standard formula: the prescribed dose is often given as an amount per kilogram (like 5mg/kg), meaning the very first step is multiplying that rate by the patient's actual body weight to find the total prescribed dose in mg, before applying the standard 'want ÷ have × quantity' formula. This two-step structure is exactly why dosage questions often feel more complex than they really are — breaking the problem into 'first find the total dose needed, then find the volume/tablets needed to deliver it' makes even a seemingly complicated weight-based question manageable using the same basic tools.",
   testYourself:[
     {q:"A patient needs 250mg of a drug, available as 500mg per 10mL. What volume should be given?", options:["2.5mL","5mL","10mL","20mL"], answer:1, explain:"(250/500) × 10 = 5mL."},
     {q:"The standard formula method for dosage calculation is:", options:["Have ÷ Want × Quantity","Want ÷ Have × Quantity","Want × Have ÷ Quantity","Quantity ÷ Want × Have"], answer:1, explain:"The formula is: (dose wanted ÷ dose available) × quantity it comes in."},
     {q:"For a weight-based dose (e.g. 5mg/kg), what should be calculated first?", options:["The volume to give directly","The total prescribed dose, by multiplying the rate by body weight","The concentration of the drug","Nothing — weight is irrelevant to the calculation"], answer:1, explain:"The first step is finding the total prescribed dose (rate × body weight) before calculating volume or tablets."}
   ],
   flashcards:[
     {front:"State the standard formula method for dosage calculations.", back:"(Dose wanted ÷ Dose available) × Quantity it comes in."},
     {front:"What extra step does weight-based dosing add to the standard formula?", back:"First multiply the dose rate (e.g. mg/kg) by the patient's body weight to find the total prescribed dose."},
     {front:"Why must units match before calculating a dose?", back:"Mixing units (like mg and mcg) partway through a calculation is a well-documented cause of real medication errors."}
   ]},
  {id:"math-sequences", subject:"mathematics", title:"Sequences & Series", icon:"➰",
   tag:"Algebra",
   explanation:"A sequence is an ordered list of numbers following a specific rule. In an arithmetic sequence, each term increases or decreases by a constant amount (the common difference); in a geometric sequence, each term is multiplied by a constant ratio. A series is the sum of the terms in a sequence.",
   analogy:"An arithmetic sequence is like climbing a staircase with equal-height steps — you go up by the same amount each time. A geometric sequence is more like compound interest or a viral rumour spreading — each step multiplies the previous amount, so growth accelerates rather than staying constant.",
   keyTerms:["Arithmetic sequence","Geometric sequence","Common difference","Common ratio","nth term"],
   example:"The sequence 3, 7, 11, 15... is arithmetic with a common difference of 4; the sequence 2, 6, 18, 54... is geometric with a common ratio of 3.",
   medicalConnection:"Geometric sequences directly model exponential processes relevant to medicine and biology, such as bacterial population growth (doubling at regular intervals) or the way a drug's blood concentration decreases by a consistent fraction over each fixed time interval.",
   memoryTrick:"\"Arithmetic ADDS the same amount, Geometric MULTIPLIES by the same amount\" — the core distinction between the two sequence types.",
   commonMistake:"Assuming every increasing sequence is either purely arithmetic or purely geometric — many real-world sequences (and many exam sequences) follow more complex rules, so it's important to check the actual pattern rather than assuming one of these two types automatically.",
   goingDeeper:"The formula for the nth term differs fundamentally between the two types, reflecting their different growth patterns: an arithmetic sequence's nth term is a₁ + (n-1)d (starting value plus a constant amount added repeatedly), while a geometric sequence's nth term is a₁ × r⁽ⁿ⁻¹⁾ (starting value multiplied by a constant ratio repeatedly). This structural difference is exactly why geometric sequences eventually grow (or shrink) far more dramatically than arithmetic sequences with a similar-looking starting rate — multiplication compounds in a way that repeated addition simply cannot match over a long enough sequence.",
   testYourself:[
     {q:"In the sequence 3, 7, 11, 15..., the common difference is:", options:["3","4","7","11"], answer:1, explain:"Each term increases by 4 (7-3=4, 11-7=4)."},
     {q:"In the sequence 2, 6, 18, 54..., the common ratio is:", options:["2","3","4","6"], answer:1, explain:"Each term is multiplied by 3 (6÷2=3, 18÷6=3)."},
     {q:"The nth term formula for a geometric sequence is:", options:["a₁ + (n-1)d","a₁ × r^(n-1)","a₁ + n","a₁ × n"], answer:1, explain:"A geometric sequence's nth term is the starting value multiplied by the common ratio, raised to (n-1)."}
   ],
   flashcards:[
     {front:"What's the difference between an arithmetic and a geometric sequence?", back:"Arithmetic: each term adds a constant amount. Geometric: each term multiplies by a constant ratio."},
     {front:"State the nth term formula for an arithmetic sequence.", back:"a₁ + (n-1)d, where a₁ is the first term and d is the common difference."},
     {front:"Give a biological example of a geometric sequence.", back:"Bacterial population doubling at regular time intervals."}
   ]},
  {id:"math-functions", subject:"mathematics", title:"Functions & Graphs", icon:"📈",
   tag:"Algebra",
   explanation:"A function is a rule that takes an input and produces exactly one specific output for each input, often written as f(x). The domain is the full set of allowed inputs, and the range is the full set of possible outputs. Graphing a function visually shows the relationship between every input and its corresponding output.",
   analogy:"A function is like a reliable vending machine: press the same button (input) twice, and you always get the exact same snack (output) both times — a true function never gives two different outputs for the exact same input.",
   keyTerms:["Function","f(x) notation","Domain","Range","Vertical line test"],
   example:"For f(x) = x² + 1, f(3) = 3² + 1 = 10 — substituting 3 for x into the function's rule.",
   medicalConnection:"Functions model countless medical relationships — such as drug concentration as a function of time, or a person's estimated basal metabolic rate as a function of weight, height and age.",
   memoryTrick:"\"One input, one output — always\" — the defining test of a true function.",
   commonMistake:"Assuming any graphed relationship is automatically a function — a graph only represents a function if it passes the 'vertical line test': no vertical line should ever cross the graph at more than one point.",
   goingDeeper:"The domain and range of a function aren't always 'all numbers' — certain functions have natural restrictions: a function involving division by x cannot have x=0 in its domain (since dividing by zero is undefined), and a function involving √x cannot have negative numbers in its domain (in the context of real numbers). Recognising these restrictions is essential in applied contexts too — a function modelling a person's age, for example, has a domain restricted to realistic, non-negative values, since a 'negative age' input wouldn't correspond to any meaningful real-world output.",
   testYourself:[
     {q:"For f(x) = x² + 1, what is f(3)?", options:["7","9","10","16"], answer:2, explain:"f(3) = 3² + 1 = 9 + 1 = 10."},
     {q:"The domain of a function refers to:", options:["The set of possible outputs","The set of allowed inputs","The graph's steepness","The function's name"], answer:1, explain:"The domain is the complete set of allowed input values."},
     {q:"The vertical line test checks whether a graph represents:", options:["A straight line","A function","A curve","An inequality"], answer:1, explain:"If any vertical line crosses the graph more than once, it is not a function."}
   ],
   flashcards:[
     {front:"What defines a true function?", back:"Each input produces exactly one specific output."},
     {front:"What is the domain of a function?", back:"The complete set of allowed input values."},
     {front:"What is the vertical line test used for?", back:"Checking whether a graph represents a valid function (no vertical line should cross it more than once)."}
   ]},
  {id:"math-polynomial", subject:"mathematics", title:"Polynomial Functions & Graphs", icon:"📉",
   tag:"Algebra",
   explanation:"A polynomial function is built from terms with non-negative whole-number powers of x, combined by addition and subtraction (like f(x) = 2x³ - x² + 5). The highest power present is called the degree, and it strongly influences the overall shape of the graph, including how many times it can potentially cross the x-axis.",
   analogy:"The degree of a polynomial is like the number of 'turns' a road can potentially have — a higher-degree polynomial's graph can curve and change direction more times than a lower-degree one, the same way a winding mountain road has more twists than a straight highway.",
   keyTerms:["Polynomial","Degree","Root/zero","Turning point","Leading coefficient"],
   example:"f(x) = x² - 4 is a degree-2 polynomial (quadratic), and its roots (where f(x)=0) are x=2 and x=-2.",
   medicalConnection:"Polynomial models are used to approximate complex biological relationships over a limited range, such as modelling population growth curves or dose-response relationships where a simple straight line doesn't capture the real pattern well enough.",
   memoryTrick:"\"Degree tells you the maximum number of roots and turning points\" — a degree-n polynomial has at most n roots and at most (n-1) turning points.",
   commonMistake:"Assuming a polynomial's degree always equals its exact number of real roots — a polynomial can have fewer real roots than its degree suggests, since some roots may be complex (not real) or repeated.",
   goingDeeper:"The leading coefficient (the number in front of the highest-power term) and the degree together determine a polynomial graph's overall 'end behaviour' — what happens to the graph as x becomes very large or very negative. An even-degree polynomial with a positive leading coefficient rises on both ends, while an odd-degree polynomial with a positive leading coefficient falls on the left and rises on the right — and recognising this pattern lets you sketch a rough shape for a polynomial graph before plotting a single point, just from its degree and leading coefficient's sign.",
   testYourself:[
     {q:"What is the degree of f(x) = 2x³ - x² + 5?", options:["1","2","3","5"], answer:2, explain:"The degree is the highest power present, which is 3."},
     {q:"The roots of f(x) = x² - 4 are:", options:["x=4 only","x=2 and x=-2","x=0 only","x=-4 only"], answer:1, explain:"Setting x²-4=0 gives x²=4, so x=2 or x=-2."},
     {q:"A degree-n polynomial has at most how many turning points?", options:["n","n-1","n+1","2n"], answer:1, explain:"A degree-n polynomial has at most (n-1) turning points."}
   ],
   flashcards:[
     {front:"What is the 'degree' of a polynomial?", back:"The highest power of x present in the polynomial."},
     {front:"What are the roots of f(x) = x² - 4?", back:"x = 2 and x = -2."},
     {front:"What determines a polynomial graph's 'end behaviour'?", back:"The polynomial's degree (odd/even) and the sign of its leading coefficient."}
   ]},
  {id:"math-expfunctions", subject:"mathematics", title:"Exponential & Logarithmic Functions", icon:"📶",
   tag:"Algebra",
   explanation:"An exponential function has the input variable in the exponent (like f(x) = 2ˣ), producing rapid growth or decay — each equal step in x multiplies the output by a constant factor. A logarithmic function is the inverse of an exponential function, and the two graphs are always mirror images of each other across the line y=x.",
   analogy:"Exponential growth is like a rumour spreading: each person who hears it might tell two more people, so the number of people who know keeps multiplying rather than just adding — starting slow, but eventually growing explosively fast.",
   keyTerms:["Exponential growth","Exponential decay","Logarithmic function","Inverse function","Asymptote"],
   example:"The function f(x) = 2ˣ doubles for every increase of 1 in x: f(1)=2, f(2)=4, f(3)=8, f(4)=16 — growing far faster than a straight line ever could.",
   medicalConnection:"Exponential decay models how many drugs are eliminated from the bloodstream over time (each fixed time interval removes a consistent fraction of what remains, not a fixed amount), which is exactly the mathematical basis of a drug's 'half-life'.",
   memoryTrick:"\"Exponential functions grow (or shrink) by multiplication, not addition\" — the key distinguishing feature from linear growth.",
   commonMistake:"Assuming exponential decay eventually reaches exactly zero — mathematically, exponential decay approaches zero but never technically reaches it, always leaving a small, ever-shrinking remaining amount (the x-axis acts as a horizontal asymptote the graph gets closer to but never touches).",
   goingDeeper:"Because exponential and logarithmic functions are inverses of each other, they 'undo' one another, and their graphs are always reflections of each other across the line y=x — a genuinely useful visual way to understand why solving an equation with x in the exponent (like 2ˣ = 16) requires taking a logarithm, while solving an equation with a logarithm in it (like log₂(x) = 4) requires exponentiating. Recognising this inverse relationship turns two seemingly different problem types into really just one skill viewed from two directions.",
   testYourself:[
     {q:"For f(x) = 2ˣ, what is f(4)?", options:["8","16","32","64"], answer:1, explain:"2⁴ = 2×2×2×2 = 16."},
     {q:"Exponential and logarithmic functions are:", options:["Identical functions","Unrelated function types","Inverse functions of each other","Only used in different subjects"], answer:2, explain:"Logarithmic functions are the inverse of exponential functions."},
     {q:"As x increases, exponential decay approaches:", options:["Negative infinity","Zero, but never technically reaches it","A fixed positive value","Infinity"], answer:1, explain:"Exponential decay approaches zero as an asymptote, getting closer but never quite reaching it."}
   ],
   flashcards:[
     {front:"What is the key feature of exponential growth or decay?", back:"The output changes by a constant multiplying factor for each equal step in the input, rather than a constant added amount."},
     {front:"What is the relationship between exponential and logarithmic functions?", back:"They are inverse functions of each other."},
     {front:"What does exponential decay describe in pharmacology?", back:"How a drug's concentration decreases in the bloodstream over time — the basis of a drug's half-life."}
   ]},
  {id:"math-graphinterp", subject:"mathematics", title:"Graph Interpretation", icon:"🗠",
   tag:"Applied Mathematics",
   explanation:"Reading and interpreting a graph accurately means identifying key features — the gradient (rate of change), intercepts (where the graph crosses the axes), turning points, and overall trend — and translating them into meaningful real-world conclusions, not just describing the shape mathematically.",
   analogy:"A graph is like a story told through a picture: the gradient tells you how fast something is changing, the intercepts tell you the starting point and where a quantity reaches zero, and the overall shape tells you whether the story is one of steady change, acceleration, or eventual levelling off.",
   keyTerms:["Gradient","Intercept","Trend","Turning point","Axis label"],
   example:"On a graph of drug concentration versus time, a steep negative gradient shortly after dosing indicates the drug is being eliminated from the body relatively quickly at that point.",
   medicalConnection:"Interpreting graphs correctly is essential for reading clinical data — growth charts, dose-response curves, and patient monitoring trends (like blood pressure over time) are all communicated primarily through graphs, and misreading one can lead to a genuinely incorrect clinical conclusion.",
   memoryTrick:"\"Always check the axis labels and units first\" — a graph's shape means nothing without knowing exactly what each axis actually represents.",
   commonMistake:"Assuming a graph's overall visual steepness alone tells the full story — always check the actual axis scales, since two graphs can look equally steep but represent very different real rates of change if their axes use different scales.",
   goingDeeper:"A graph's gradient doesn't have to be constant — many real-world graphs (like a drug concentration curve) have a gradient that changes continuously along the curve, meaning the rate of change itself is different at every single point. Reading these more advanced graphs accurately means recognising that the steepest section reflects the fastest rate of change, and a completely flat section (zero gradient) reflects a moment of no change at all, even mid-curve — skills that directly connect graph reading to the deeper concept of differentiation covered elsewhere.",
   testYourself:[
     {q:"On a graph, the gradient represents:", options:["The starting value only","The rate of change","The total area under the curve","The x-intercept"], answer:1, explain:"The gradient (slope) of a graph represents the rate of change of the quantity being plotted."},
     {q:"Before interpreting a graph's steepness, you should always first check:", options:["The graph's colour","The axis labels and scales","How many points are plotted","The title font"], answer:1, explain:"Axis labels and scales determine what the graph's shape actually means — steepness alone can be misleading without this context."},
     {q:"A flat (zero-gradient) section of a curve represents:", options:["The fastest rate of change","A moment of no change","An error in the data","The graph's maximum value always"], answer:1, explain:"A zero gradient means the quantity is momentarily not changing at that point."}
   ],
   flashcards:[
     {front:"What does a graph's gradient represent?", back:"The rate of change of the quantity being plotted."},
     {front:"What should you always check before interpreting a graph's steepness?", back:"The axis labels and scales."},
     {front:"What does a flat (zero-gradient) section of a curve indicate?", back:"A moment where the quantity is not changing."}
   ]},
  {id:"math-limits", subject:"mathematics", title:"Limits", icon:"➡️",
   tag:"Calculus",
   explanation:"A limit describes the value a function approaches as its input gets closer and closer to a specific value, even if the function is never actually evaluated exactly at that point. Limits form the conceptual foundation that differentiation and integration are built on.",
   analogy:"A limit is like walking toward a doorway you're not allowed to step through: you can get arbitrarily close to the threshold, close enough to know exactly what's on the other side, without ever technically crossing it — the limit is 'what you'd see' at that threshold, even without actually reaching it.",
   keyTerms:["Limit","Approaches","Continuity","Undefined point"],
   example:"For f(x) = (x²-1)/(x-1), the function is undefined at x=1 (since it involves dividing by zero there), but the limit as x approaches 1 is still 2, found by simplifying the expression first.",
   medicalConnection:"The concept of a limit underlies how instantaneous rates are defined in medicine — like a patient's exact heart rate at one precise instant, calculated as the limit of the average rate over increasingly tiny time intervals.",
   memoryTrick:"\"A limit is about getting infinitely close, not necessarily arriving\" — the function doesn't need to be defined exactly at the point for the limit to exist there.",
   commonMistake:"Assuming a limit doesn't exist just because the function itself is undefined at that exact point — many limits exist perfectly well even when the function has a 'hole' at that specific input, as long as the function approaches a consistent value from both sides.",
   goingDeeper:"Differentiation is formally defined using a limit: the derivative of a function at a point is the limit, as a small change in x (often called h) shrinks toward zero, of the average rate of change over that shrinking interval. This is exactly why differentiation is sometimes described as 'finding the limit of an average rate of change as the interval becomes infinitely small' — the power rule and other differentiation shortcuts are really just efficient, pre-calculated results of applying this limit definition to different types of functions, saving you from working through the full limit process every single time.",
   testYourself:[
     {q:"A limit describes:", options:["The exact value of a function at a point","The value a function approaches as the input nears a point","The highest point on a graph","A type of equation"], answer:1, explain:"A limit describes the value a function approaches as the input gets arbitrarily close to a specific value."},
     {q:"Can a limit exist at a point where the function itself is undefined?", options:["No, never","Yes, if the function approaches a consistent value from both sides","Only for straight-line functions","Only in theory, never in practice"], answer:1, explain:"A limit can exist even at an undefined point, as long as the function approaches a consistent value from both sides."},
     {q:"Differentiation is formally defined using:", options:["A limit of an average rate of change as the interval shrinks to zero","The area under a curve","A simple average of two points","A random sampling method"], answer:0, explain:"The derivative is defined as the limit of the average rate of change as the interval approaches zero."}
   ],
   flashcards:[
     {front:"What does a limit describe?", back:"The value a function approaches as its input gets arbitrarily close to a specific point."},
     {front:"Can a function have a limit at a point where it's undefined?", back:"Yes — as long as it approaches a consistent value from both sides."},
     {front:"How is differentiation formally defined in terms of limits?", back:"As the limit of the average rate of change over an interval, as that interval shrinks toward zero."}
   ]},
  {id:"math-diffapplications", subject:"mathematics", title:"Applications of Differentiation", icon:"🎯",
   tag:"Calculus",
   explanation:"Beyond just finding a gradient, differentiation has powerful practical applications: finding the maximum or minimum points of a function (where the gradient equals zero), and finding rates of change in real, applied contexts — like velocity (the derivative of position) and acceleration (the derivative of velocity).",
   analogy:"Finding a maximum or minimum using differentiation is like finding the exact top of a hill by looking for the one spot where the ground is momentarily flat (zero gradient) — everywhere else on the hill, you're either still climbing or already descending.",
   keyTerms:["Maximum/minimum point","Stationary point","Velocity","Acceleration","Second derivative"],
   example:"For a ball's height h(t) over time, the velocity is h'(t) (the first derivative), and the ball reaches its maximum height at the exact moment velocity equals zero.",
   medicalConnection:"Differentiation applications appear in pharmacokinetics (finding the exact time a drug reaches its peak concentration in the blood — the point where the concentration curve's gradient is zero) and in physiology (calculating instantaneous rates like the rate of change of a patient's blood glucose).",
   memoryTrick:"\"Maximum or minimum = where the gradient is zero\" — always start by setting the derivative equal to zero.",
   commonMistake:"Finding a stationary point (where the derivative equals zero) and assuming it's automatically a maximum — a zero gradient could indicate a maximum, a minimum, or occasionally neither (a saddle/inflection point), so further checking is needed to tell them apart.",
   goingDeeper:"To determine whether a stationary point (where the derivative is zero) is a maximum or minimum, you can look at the second derivative — the derivative of the derivative. A negative second derivative at that point indicates a maximum (the graph is curving downward, like the top of a hill), while a positive second derivative indicates a minimum (the graph is curving upward, like the bottom of a valley). This 'second derivative test' turns a slightly ambiguous first step (finding where the gradient is zero) into a definitive answer without needing to sketch the whole graph.",
   testYourself:[
     {q:"At a maximum or minimum point of a function, the derivative (gradient) equals:", options:["1","0","Infinity","The function's value at that point"], answer:1, explain:"At a maximum or minimum, the gradient is momentarily zero (a stationary point)."},
     {q:"A negative second derivative at a stationary point indicates:", options:["A minimum","A maximum","Neither a maximum nor minimum","An error"], answer:1, explain:"A negative second derivative indicates the graph curves downward at that point, meaning it's a maximum."},
     {q:"Acceleration is the derivative of:", options:["Position","Time","Velocity","Mass"], answer:2, explain:"Acceleration is the rate of change of velocity, making it the derivative of velocity."}
   ],
   flashcards:[
     {front:"What is true about the derivative at a maximum or minimum point?", back:"It equals zero (a 'stationary point')."},
     {front:"How can you tell if a stationary point is a maximum or a minimum?", back:"Check the second derivative: negative means maximum, positive means minimum."},
     {front:"What is acceleration, in terms of differentiation?", back:"The derivative of velocity (the rate of change of velocity)."}
   ]},
  {id:"math-integration", subject:"mathematics", title:"Introduction to Integration", icon:"∫",
   tag:"Calculus",
   explanation:"Integration is, in a sense, the reverse process of differentiation — instead of finding a rate of change, it finds the original function from its rate of change, or calculates the area under a curve between two points. For a function xⁿ, the integral is xⁿ⁺¹/(n+1) + C, where C is an unknown constant.",
   analogy:"If differentiation is like figuring out a car's speed at each instant from its position over time, integration is the reverse: working out the total distance travelled (the area under the speed-time graph) if you only know the speed at every moment.",
