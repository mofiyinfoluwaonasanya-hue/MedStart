  {id:"med-biomolecules", subject:"medical", title:"Biomolecules: The Building Blocks of Life", icon:"🧬",
   tag:"Biochemistry",
   explanation:"All living things are built from four major classes of biomolecules: carbohydrates (energy and structure), lipids (energy storage, cell membranes, hormones), proteins (structure, enzymes, transport, signalling), and nucleic acids (DNA and RNA — storing and expressing genetic information). Each class is built from smaller repeating units joined together into larger, functional molecules.",
   analogy:"Biomolecules are like different types of building materials used to construct and run a house: carbohydrates are like the quick-burning fuel for the generator, lipids are like the insulation and stored fuel reserves, proteins are like the specialised tools and workers doing every job, and nucleic acids are like the master blueprint stored safely in the office, referenced to build and maintain everything else.",
   keyTerms:["Carbohydrate","Lipid","Protein","Nucleic acid","Monomer","Polymer"],
   example:"Proteins are built from chains of amino acid monomers, and the specific sequence of amino acids determines how the protein folds and what job it can perform — from digesting food (as an enzyme) to fighting infection (as an antibody).",
   medicalConnection:"Many medical conditions trace directly back to a problem with one of these biomolecule classes — for example, diabetes involves carbohydrate (glucose) regulation, while certain inherited disorders involve a single faulty protein (like a missing enzyme) disrupting an entire metabolic pathway.",
   memoryTrick:"\"Carbs for quick energy, Lipids for storage, Proteins for structure and function, Nucleic acids for information\" — a one-line summary of each class's primary role.",
   commonMistake:"Assuming all four biomolecule classes serve identical, interchangeable purposes — each class has distinct primary roles, and while there's some overlap (proteins can occasionally be used for energy, for instance), the body strongly prefers using each class for its specialised purpose.",
   goingDeeper:"Each biomolecule class is built using the same basic strategy: small repeating units (monomers) join together through condensation reactions (releasing a water molecule at each connection) to form long chains called polymers — amino acids link into proteins, monosaccharides link into complex carbohydrates, and nucleotides link into DNA/RNA. Digestion essentially reverses this process through hydrolysis reactions (adding water back in to break the links), which is exactly why digestive enzymes are often named directly after the bond they break — for example, proteases break protein bonds, while lipases break down lipids — a naming pattern that makes many enzyme names far more logical once this underlying pattern is recognised.",
   testYourself:[
     {q:"Which biomolecule class is primarily responsible for storing genetic information?", options:["Carbohydrates","Lipids","Proteins","Nucleic acids"], answer:3, explain:"Nucleic acids (DNA and RNA) store and express genetic information."},
     {q:"Proteins are built from chains of which monomer units?", options:["Glucose molecules","Amino acids","Fatty acids","Nucleotides"], answer:1, explain:"Proteins are polymers of amino acid monomers."},
     {q:"The reaction that joins monomers into a polymer, releasing water, is called:", options:["Hydrolysis","Condensation","Oxidation","Reduction"], answer:1, explain:"Condensation reactions join monomers together while releasing a water molecule."}
   ],
   flashcards:[
     {front:"Name the four major classes of biomolecules.", back:"Carbohydrates, lipids, proteins, and nucleic acids."},
     {front:"What monomer builds proteins?", back:"Amino acids."},
     {front:"What type of reaction breaks polymers back down into monomers (as in digestion)?", back:"Hydrolysis (adding water to break the bonds)."}
   ]},
  {id:"med-enzymesatp", subject:"medical", title:"Enzymes & ATP: The Body's Chemistry Toolkit", icon:"🔋",
   tag:"Biochemistry",
   explanation:"Enzymes are biological catalysts — proteins that dramatically speed up specific biochemical reactions without being consumed in the process, by lowering the activation energy needed for the reaction to occur. ATP (adenosine triphosphate) is the cell's immediate, usable form of chemical energy, produced primarily through cellular respiration and 'spent' to power nearly every energy-requiring process in the body.",
   analogy:"If a biochemical reaction were a locked door, an enzyme is like a key precisely shaped to fit that specific lock, opening it far more easily and quickly than trying to force it open without the right key. ATP, meanwhile, is like cash in your pocket — a form of energy that's immediately usable and 'spendable,' compared to money still locked away in a savings account (like glucose or fat, which need to be converted first).",
   keyTerms:["Enzyme","Substrate","Active site","Activation energy","ATP","Catalyst"],
   example:"The enzyme amylase, found in saliva, begins breaking down starch into simpler sugars the moment food enters the mouth — a reaction that would occur far too slowly to be useful without the enzyme's help.",
   medicalConnection:"Many inherited metabolic disorders result from a single missing or malfunctioning enzyme, causing a specific biochemical pathway to back up or fail entirely — which is why enzyme replacement therapy and specialised diets are central treatments for several such genetic conditions.",
   memoryTrick:"\"Enzymes are keys, substrates are locks\" — each enzyme's active site is shaped to fit only its specific substrate(s).",
   commonMistake:"Assuming enzymes are permanently changed or used up after catalysing a reaction — enzymes emerge from the reaction chemically unchanged and ready to catalyse the same reaction again, which is exactly why only tiny amounts of an enzyme are needed relative to the substrate.",
   goingDeeper:"Enzyme activity is highly sensitive to conditions like temperature and pH, because both can distort an enzyme's precise 3D shape (denaturation), which directly disrupts how well its active site fits its substrate. This is exactly why body temperature and blood pH are so tightly regulated by homeostatic mechanisms — even a small deviation outside the narrow normal range can significantly impair enzyme function throughout the body, which is part of why conditions like high fever or severe acid-base imbalances become dangerous well before body temperature or pH reach truly extreme values.",
   testYourself:[
     {q:"Enzymes speed up reactions by:", options:["Being permanently consumed in the reaction","Lowering the activation energy needed for the reaction","Raising the activation energy needed","Adding extra mass to the reactants"], answer:1, explain:"Enzymes lower activation energy, allowing reactions to proceed much faster."},
     {q:"ATP is best described as:", options:["A type of enzyme","The cell's immediate, usable energy currency","A structural protein","A type of nucleic acid used only for genetics"], answer:1, explain:"ATP is the cell's immediately usable form of chemical energy."},
     {q:"Extreme temperature or pH changes can impair enzyme function primarily by:", options:["Increasing the amount of enzyme available","Denaturing the enzyme, distorting its active site shape","Having no effect on enzymes at all","Converting the enzyme into a substrate"], answer:1, explain:"Extreme conditions can denature an enzyme, distorting the shape of its active site and impairing function."}
   ],
   flashcards:[
     {front:"What is an enzyme?", back:"A biological catalyst (usually a protein) that speeds up a specific reaction without being consumed."},
     {front:"What does ATP stand for, and what is its role?", back:"Adenosine triphosphate — the cell's immediate, usable form of chemical energy."},
     {front:"What happens to an enzyme when it's denatured?", back:"Its 3D shape (including the active site) is distorted, impairing or destroying its function."}
   ]},
  {id:"med-metabolism", subject:"medical", title:"Metabolism: Carbohydrate, Lipid & Protein Pathways", icon:"⚙️",
   tag:"Biochemistry",
   explanation:"Metabolism is the sum of all chemical reactions occurring in the body, broadly divided into catabolism (breaking larger molecules down, releasing energy) and anabolism (building larger molecules up, using energy). Carbohydrates, lipids and proteins each have their own metabolic pathways, but these pathways are interconnected, allowing the body to convert between fuel sources depending on availability and need.",
   analogy:"Metabolism is like a busy household budget: catabolism is like income coming in (breaking things down releases usable energy), anabolism is like spending on building projects (using energy to construct new things), and the body constantly balances the two, sometimes drawing on savings (stored fat or glycogen) when 'income' from food runs low.",
   keyTerms:["Catabolism","Anabolism","Glycolysis","Glycogen","Fatty acid oxidation"],
   example:"When blood glucose is high after a meal, excess glucose is converted into glycogen for short-term storage in the liver and muscles (anabolism); when glucose runs low between meals, that glycogen is broken back down into glucose to maintain blood sugar levels (catabolism).",
   medicalConnection:"Understanding which metabolic pathway is disrupted helps explain many conditions — type 1 diabetes disrupts the body's ability to move glucose into cells at all, while prolonged fasting or very low-carbohydrate diets shift the body toward greater reliance on fat metabolism, producing ketone bodies as an alternative fuel source.",
   memoryTrick:"\"Catabolism breaks down and releases energy; Anabolism builds up and uses energy\" — the two halves of metabolism, working in opposite directions.",
   commonMistake:"Assuming the body only uses one fuel source (like glucose) at a time and switches abruptly between them — in reality, the body typically uses a blended mix of carbohydrate and fat metabolism simultaneously, with the exact balance shifting gradually depending on activity level, meal timing, and fuel availability.",
   goingDeeper:"All three major fuel sources — carbohydrates, fats and (to a lesser extent) proteins — are ultimately funneled into a shared final common pathway for energy production within cells, meaning the body doesn't need entirely separate 'engines' for each fuel type. This shared pathway is part of why the body can flexibly shift its fuel preference based on circumstances (like fasting, exercise, or diet composition) without needing to fundamentally change how energy is ultimately extracted at the cellular level — the different fuels essentially feed into the same final energy-releasing machinery, just entering at slightly different points.",
   testYourself:[
     {q:"Catabolism refers to reactions that:", options:["Build larger molecules, using energy","Break down larger molecules, releasing energy","Only occur during sleep","Only affect proteins"], answer:1, explain:"Catabolism breaks larger molecules down and releases energy in the process."},
     {q:"Glycogen serves as the body's:", options:["Primary structural protein","Short-term storage form of glucose","Main genetic material","Only source of energy"], answer:1, explain:"Glycogen is the body's short-term storage form of glucose, mainly in liver and muscle."},
     {q:"The body's use of carbohydrate versus fat as fuel typically:", options:["Switches abruptly and completely between the two","Uses a blended mix of both simultaneously, shifting gradually","Never involves fat under any circumstances","Is fixed and never changes"], answer:1, explain:"The body typically uses a blended, gradually shifting mix of both fuel sources rather than an abrupt switch."}
   ],
   flashcards:[
     {front:"What is the difference between catabolism and anabolism?", back:"Catabolism breaks molecules down, releasing energy; anabolism builds molecules up, using energy."},
     {front:"What is glycogen?", back:"The body's short-term storage form of glucose, stored mainly in the liver and muscles."},
     {front:"Do carbohydrate and fat metabolism typically operate separately or together?", back:"Together — the body typically uses a blended mix of both, with the balance shifting gradually based on need."}
   ]},
  {id:"med-histology", subject:"medical", title:"Histology: The Four Tissue Types", icon:"🔬",
   tag:"Histology",
   explanation:"Histology is the study of tissues — organised groups of similar cells working together to perform a shared function. All body tissues are classified into four fundamental types: epithelial tissue (covers surfaces and lines cavities), connective tissue (supports and connects other tissues), muscle tissue (generates movement through contraction), and nervous tissue (transmits electrical signals).",
   analogy:"The four tissue types are like four different specialised trades needed to build and run a building: epithelial tissue is like the building's outer walls and internal linings (covering and protecting), connective tissue is like the structural framework and connecting materials (support), muscle tissue is like the machinery that produces movement, and nervous tissue is like the building's electrical wiring, carrying signals throughout.",
   keyTerms:["Epithelial tissue","Connective tissue","Muscle tissue","Nervous tissue","Extracellular matrix"],
   example:"The skin's outer layer is epithelial tissue, providing a protective covering, while the layer beneath it contains connective tissue rich in collagen fibres, providing structural support and flexibility.",
   medicalConnection:"Many diseases are classified by which tissue type they primarily affect — for example, most cancers are named based on the tissue of origin (like carcinomas, arising from epithelial tissue), which is directly relevant to how a specific cancer is expected to behave and spread.",
   memoryTrick:"\"Epithelial covers, Connective supports, Muscle moves, Nervous signals\" — a one-line summary of the four basic tissue types.",
   commonMistake:"Assuming connective tissue is always solid and rigid, like bone — connective tissue is actually a highly varied category, ranging from solid bone and cartilage to flexible tendons and ligaments, to entirely liquid connective tissue like blood.",
   goingDeeper:"What distinguishes connective tissue from the other three types is that its cells are typically sparse and spread out within a large amount of extracellular matrix — the non-living material surrounding the cells — and it's the specific composition of this matrix (how much protein fibre, mineral, or fluid it contains) that determines whether a particular connective tissue ends up rigid like bone, flexible like cartilage, or fluid like blood. This is exactly why blood is technically classified as a connective tissue, despite seeming completely different from bone or tendons at first glance — its 'matrix' is simply the liquid plasma surrounding its cells, rather than a solid one.",
   testYourself:[
     {q:"Which tissue type primarily covers body surfaces and lines cavities?", options:["Connective tissue","Epithelial tissue","Muscle tissue","Nervous tissue"], answer:1, explain:"Epithelial tissue covers surfaces and lines body cavities."},
     {q:"Blood is classified as which tissue type?", options:["Epithelial tissue","Muscle tissue","Connective tissue","Nervous tissue"], answer:2, explain:"Blood is classified as connective tissue, with plasma serving as its liquid extracellular matrix."},
     {q:"Connective tissue is characterised by:", options:["Densely packed cells with no matrix","Sparse cells within a large amount of extracellular matrix","An inability to vary in structure","Only being found in bone"], answer:1, explain:"Connective tissue typically has relatively few cells spread through a large amount of extracellular matrix."}
   ],
   flashcards:[
     {front:"Name the four fundamental tissue types.", back:"Epithelial, connective, muscle, and nervous tissue."},
     {front:"Why is blood classified as a connective tissue?", back:"It consists of cells within a liquid extracellular matrix (plasma), fitting the general pattern of connective tissue."},
     {front:"What structural feature is unique to connective tissue among the four types?", back:"Its cells are typically sparse and surrounded by a large amount of extracellular matrix, which varies from solid to liquid."}
   ]},
  {id:"med-genetics", subject:"medical", title:"Genetics: Genes, Chromosomes & Inheritance", icon:"🧬",
   tag:"Genetics",
   explanation:"Genes are segments of DNA that code for specific traits, organised along chromosomes within the nucleus of each cell. Humans typically have 46 chromosomes arranged in 23 pairs, one set inherited from each parent, and the specific combination of gene variants (alleles) a person inherits determines many of their inherited traits, following predictable patterns first described by Gregor Mendel.",
   analogy:"If the full set of chromosomes is like a complete encyclopedia set, each chromosome is like one individual volume, and each gene is like a specific chapter within that volume containing the instructions for one particular trait.",
   keyTerms:["Gene","Chromosome","Allele","Dominant/recessive","Genotype","Phenotype"],
   example:"If a gene for eye colour has a dominant brown allele and a recessive blue allele, a person inheriting one of each will typically have brown eyes (the dominant trait), while both alleles being recessive (blue) is needed to actually show blue eyes.",
   medicalConnection:"Many inherited disorders follow predictable inheritance patterns based on whether the faulty gene is dominant or recessive, which is exactly the reasoning genetic counsellors use to estimate the probability that a couple's future children might inherit a particular genetic condition.",
   memoryTrick:"\"Genotype is the genetic code you carry, Phenotype is what actually shows\" — a simple distinction between the underlying genetics and its visible expression.",

   testYourself:[

     {q:"A recessive allele that isn't expressed in an individual's phenotype:", options:["Is destroyed and cannot be inherited","Can still be passed on to offspring","Automatically becomes dominant in the next generation","Only exists in males"], answer:1, explain:"A recessive allele remains present in the genotype and can still be inherited by offspring."}

  {id:"med-mutations", subject:"medical", title:"Mutations, Genetic Disorders & Variation", icon:"🧬",
   tag:"Genetics",
   explanation:"A mutation is any change in an organism's DNA sequence. Mutations can occur spontaneously during DNA replication or be caused by environmental factors like radiation or certain chemicals. Most mutations have little to no effect, some are harmful (potentially causing genetic disorders), and a smaller number are beneficial, providing the raw material for evolutionary variation within a population.",
   analogy:"A mutation is like a single typo appearing in a very long, carefully copied document: most typos don't change the meaning of the sentence at all, some completely change or garble the meaning (harmful), and very rarely, a typo accidentally improves the original sentence's clarity (beneficial).",
   keyTerms:["Mutation","Point mutation","Genetic disorder","Karyotype","Chromosomal abnormality"],

   testYourself:[

     {front:"What genetic change causes Down syndrome?", back:"An extra copy of chromosome 21 (trisomy 21)."},

  {id:"med-microbio", subject:"medical", title:"Microbiology: Pathogens, Infection & Transmission", icon:"🦠",
   tag:"Microbiology",
   explanation:"Pathogens are microorganisms capable of causing disease, and the main categories are bacteria, viruses, fungi and parasites — each with a fundamentally different structure and requiring different treatment approaches. Infection occurs when a pathogen successfully enters the body and multiplies, and transmission describes how a pathogen spreads from one host to another (such as through the air, direct contact, contaminated food/water, or vectors like mosquitoes).",
   analogy:"Bacteria are like complete, self-sufficient tiny factories, capable of living and reproducing independently — while viruses are more like a hijacked instruction manual with no factory of their own, requiring them to invade and take over a host cell's machinery in order to reproduce at all.",
   keyTerms:["Bacteria","Virus","Fungus","Parasite","Transmission","Vector"],

   medicalConnection:"Correctly identifying which category of pathogen is causing an infection is clinically essential, since treatments are category-specific — antibiotics work against bacteria but are completely ineffective against viruses, which is exactly why antibiotics are not prescribed for most common viral illnesses like colds and flu.",

     {q:"A 'vector' in disease transmission refers to:", options:["The pathogen itself","An organism (like a mosquito) that transmits a pathogen between hosts","A type of antibiotic","A symptom of infection"], answer:1, explain:"A vector is an organism that carries and transmits a pathogen from one host to another."},
     {q:"Why are viruses often considered not fully 'alive'?", options:["They are too small to be seen","They lack their own cellular structure and cannot reproduce without hijacking a host cell","They don't contain any genetic material","They only infect plants"], answer:1, explain:"Viruses lack independent cellular structure and can only reproduce by hijacking a host cell's machinery."}

function groupTermsByCategory(list){
  const groups = {};
  TERM_CATEGORY_ORDER.forEach(c=> groups[c]=[]);
  list.forEach(e=>{ if(!groups[e.category]) groups[e.category]=[]; groups[e.category].push(e); });
  return TERM_CATEGORY_ORDER.map(c=>({category:c, terms:groups[c]})).filter(g=>g.terms.length);
}

function genRiddle(level){
  const r = RIDDLES[randInt(0,RIDDLES.length-1)];
  const distractors = shuffleArr(RIDDLE_DISTRACTOR_POOL.filter(d=>d!==r.answer)).slice(0,3);

function brainLevelFromXp(xp){
  let current = BRAIN_LEVELS[0];
  BRAIN_LEVELS.forEach(l=>{ if(xp >= l.xpNeeded) current = l; });
  return current;
}
function xpToNextLevel(xp){
  const cur = brainLevelFromXp(xp);
  const next = BRAIN_LEVELS.find(l=>l.level === cur.level+1);
  if(!next) return null;
  return {needed: next.xpNeeded - xp, next};
}

/* Procedural question generators — difficulty scales with current Brain Lab level */
function shuffleArr(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function mcqFromNumberAnswer(answer, spread){
  const set = new Set([answer]);
  while(set.size < 4){ set.add(answer + randInt(-spread,spread) * (Math.random()<0.5?1:2)); }
  return shuffleArr([...set]);
}
function genNumberSequence(level){
  let seq, next, rule;
  if(level <= 2){
    const start = randInt(1,10), step = randInt(2,6);
    seq = [0,1,2,3].map(i=>start+i*step); next = start+4*step; rule = `add ${step} each time`;
  } else if(level <= 4){
    const useGeo = Math.random()<0.5;
    if(useGeo){
      const start = randInt(1,4), ratio = randInt(2,3);
      seq = [0,1,2,3].map(i=>start*Math.pow(ratio,i)); next = start*Math.pow(ratio,4); rule = `multiply by ${ratio} each time`;
    } else {
      const start = randInt(5,20), step = randInt(-6,-2);
      seq = [0,1,2,3].map(i=>start+i*step); next = start+4*step; rule = `subtract ${Math.abs(step)} each time`;
    }
  } else {
    const type = randInt(0,2);
    if(type===0){ // increasing step (triangular-ish)
      const start = randInt(1,5); let a=start, b=start+randInt(1,3);
      seq=[a,b]; let step=b-a; for(let i=0;i<2;i++){ step+=1; seq.push(seq[seq.length-1]+step); }
      step+=1; next = seq[seq.length-1]+step; rule = "the gap between terms increases by 1 each time";
    } else if(type===1){ // fibonacci-like
      let a=randInt(1,3), b=randInt(2,4);
      seq=[a,b]; for(let i=0;i<2;i++){ seq.push(seq[seq.length-2]+seq[seq.length-1]); }
      next = seq[seq.length-2]+seq[seq.length-1]; rule = "each term is the sum of the two before it";
    } else {
      const start = randInt(2,4), ratio=2;
      seq=[0,1,2,3].map(i=>start*Math.pow(ratio,i)); next=start*Math.pow(ratio,4); rule="multiply by 2 each time";
    }
  }
  const options = mcqFromNumberAnswer(next, Math.max(2,Math.round(next*0.15)));
  return {q:`What comes next in this sequence? ${seq.join(", ")}, ?`, options:options.map(String), answer:options.indexOf(next), explain:`The rule is: ${rule}. So the next term is ${next}.`};
}
function genMentalMath(level){
  let a,b,op,answer,text;
  if(level<=2){ a=randInt(2,20); b=randInt(2,20); op = Math.random()<0.5?'+':'-'; if(op==='-' && b>a) [a,b]=[b,a]; answer = op==='+'? a+b : a-b; text=`${a} ${op} ${b}`; }
  else if(level<=4){ a=randInt(2,12); b=randInt(2,12); op = Math.random()<0.5?'×':'÷'; if(op==='÷'){ b=randInt(2,12); a=b*randInt(2,12); answer=a/b; } else { answer=a*b; } text=`${a} ${op} ${b}`; }
  else { a=randInt(2,12); b=randInt(2,12); const c=randInt(2,10); op = Math.random()<0.5?'+':'-'; const base=a*b; answer = op==='+'? base+c : base-c; text=`(${a} × ${b}) ${op} ${c}`; }
  const spread = Math.max(2, Math.round(Math.abs(answer)*0.2)+1);
  const options = mcqFromNumberAnswer(answer, spread);
  return {q:`Solve: ${text} = ?`, options:options.map(String), answer:options.indexOf(answer), explain:`${text} = ${answer}.`};
}
function genUnscramble(level){
  const pick = UNSCRAMBLE_WORDS[randInt(0,UNSCRAMBLE_WORDS.length-1)];
  let letters = pick.word.split("");
  let scrambled;
  do { scrambled = shuffleArr(letters).join(""); } while(scrambled === pick.word);
  return {type:"text", q:`Unscramble the letters: ${scrambled.split("").join(" ")}`, hint:pick.hint, answer:pick.word, explain:`The word is "${pick.word}" — ${pick.hint.toLowerCase()}.`};
}
function genOddOneOut(level){
  const set = ODD_ONE_OUT_SETS[randInt(0,ODD_ONE_OUT_SETS.length-1)];
  const order = shuffleArr([0,1,2,3]);
  const options = order.map(i=>set.items[i]);
  const answer = order.indexOf(set.oddIndex);
  return {q:"Which one doesn't belong with the others?", options, answer, explain:set.explain};
}
function genMedTermPuzzle(level){
  const correct = TERM_EXAMPLES[randInt(0,TERM_EXAMPLES.length-1)];
  let distractors = shuffleArr(TERM_EXAMPLES.filter(e=>e.word!==correct.word)).slice(0,3);
  const options = shuffleArr([correct, ...distractors]).map(e=>e.word);
  return {q:`Which term means: "${correct.meaning}"`, options, answer:options.indexOf(correct.word), explain:`${correct.word} (${correct.parts}) means ${correct.meaning.toLowerCase()}`};
}

const MEMORY_WORD_POOL = ["Apple","River","Pencil","Cloud","Guitar","Lantern","Candle","Mirror","Whistle","Anchor","Compass","Feather","Hammer","Island","Jacket","Kettle","Lemon","Mango","Needle","Orange","Pepper","Quartz","Rocket","Sandal","Turtle","Umbrella","Violin","Wallet","Yarn","Zebra","Basket","Camel","Drum","Engine","Fossil","Globe","Helmet","Igloo","Jungle","Kite"];
function genMemoryChallenge(level){
  const count = level<=2?4:(level<=4?5:6);
  const items = shuffleArr(MEMORY_WORD_POOL).slice(0,count);
  if(Math.random()<0.5){
    const pos = randInt(0,count-1);
    const wrongs = shuffleArr(items.filter((_,i)=>i!==pos)).slice(0,3);
    const options = shuffleArr([items[pos], ...wrongs]);
    return {q:`Memorise this list, then answer: ${items.join(", ")}. — What was item number ${pos+1}?`, options, answer:options.indexOf(items[pos]), explain:`Item ${pos+1} in the list was "${items[pos]}".`};
  } else {
    const notInList = shuffleArr(MEMORY_WORD_POOL.filter(w=>!items.includes(w)))[0];
    const wrongs = shuffleArr(items).slice(0,3);
    const options = shuffleArr([notInList, ...wrongs]);
    return {q:`Memorise this list, then answer: ${items.join(", ")}. — Which of these words was NOT in the list?`, options, answer:options.indexOf(notInList), explain:`"${notInList}" did not appear in the list — the list was: ${items.join(", ")}.`};
  }
}

/* Pattern Recognition (visual) */
const PATTERN_SYMBOLS = ["🔴","🔵","🟢","🟡","🟣","⭐","⬛","🔺"];
function genPatternRecognition(level){
  const symCount = level<=2?2:(level<=4?3:4);
  const syms = shuffleArr(PATTERN_SYMBOLS).slice(0,symCount);
  const repeats = level<=2?3:4;
  let seq=[]; for(let i=0;i<repeats;i++){ seq = seq.concat(syms); }
  const cut = level<=2?1:randInt(1,symCount);
  const showSeq = seq.slice(0, seq.length-cut);
  const next = seq[showSeq.length];
  const wrongOptions = shuffleArr(PATTERN_SYMBOLS.filter(s=>s!==next)).slice(0,3);
  const options = shuffleArr([next, ...wrongOptions]);
  return {q:`What comes next in this repeating pattern? ${showSeq.join(" ")} ?`, options, answer:options.indexOf(next), explain:`The pattern repeats every ${symCount} symbols (${syms.join(" ")}), so the next symbol is ${next}.`};
}

/* Speed & Attention */
function genSpeedAttention(level){
  const length = level<=2?10:(level<=4?14:18);
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const target = letters[randInt(0,letters.length-1)];
  let str = "";
  for(let i=0;i<length;i++){ str += Math.random()<0.22 ? target : letters[randInt(0,letters.length-1)]; }
  const actualCount = str.split("").filter(c=>c===target).length;
  const candidates = new Set([actualCount]);
  let delta = 1;
  while(candidates.size<4){
    if(actualCount-delta>=0) candidates.add(actualCount-delta);
    if(candidates.size<4) candidates.add(actualCount+delta);
    delta++;
  }
  const options = shuffleArr([...candidates]).map(String);
  return {q:`Quickly scan this string and count: how many times does the letter "${target}" appear? ${str.split("").join(" ")}`, options, answer:options.indexOf(String(actualCount)), explain:`The letter "${target}" appears ${actualCount} time(s) in: ${str}`};
}

  {category:"🔁 Memory & Recall Techniques", title:"The Generation Effect", body:"Before checking an answer, try to generate it yourself first — even a rough guess. Actively producing an answer, rather than simply reading someone else's, creates a stronger memory trace than passive reading alone, even when your first attempt is wrong."},
  {category:"🔁 Memory & Recall Techniques", title:"Elaborative Interrogation", body:"For any fact you're learning, keep asking 'why is that true?' and 'how does that connect to what I already know?' Linking a new fact to existing knowledge — rather than memorising it in isolation — makes it far easier to recall later."},
  {category:"🔁 Memory & Recall Techniques", title:"Mnemonics, Chunking & Association", body:"Practical techniques that make information stick.",
   list:["Mnemonics — a memorable phrase for a list (e.g. 'King Philip Came Over For Good Soup' for taxonomy ranks)","Chunking — grouping information into smaller, manageable sets instead of one long list","Association — linking a new fact to something familiar you already know well","Visualisation — picturing the concept actually happening, step by step"]},
  {category:"🔁 Memory & Recall Techniques", title:"Memory Palaces", body:"Mentally 'place' facts you need to remember along a route through a location you know extremely well, like your house or your walk to school. To recall the list, simply walk through the route in your mind — this works because spatial memory is naturally strong, and it can carry unfamiliar facts along with it."},
  {category:"🔁 Memory & Recall Techniques", title:"The Testing Effect (Self-Quizzing)", body:"Testing yourself on material — even before you feel 'ready' — produces stronger long-term retention than an equal amount of time spent rereading. Treat every MEDSTART quiz, flashcard deck or CBT as a learning tool in itself, not just a way to check what you already know."},

  /* ===== Category 3: Reading, Notes & Organisation ===== */
  {category:"📝 Reading, Notes & Organisation", title:"Note-Making That Actually Helps", body:"Good notes are compressed and active, not copied. Try one-page summaries, Cornell-style notes, concept maps, comparison tables, or formula sheets — the goal is to process information into your own words, not to transcribe it."},
  {category:"📝 Reading, Notes & Organisation", title:"The SQ3R Reading Method", body:"A structured way to read a textbook chapter so it actually sticks.",
   list:["Survey — skim headings and summaries first to see the shape of the chapter","Question — turn each heading into a question before you read it","Read — read actively, looking for the answer to your question","Recite — close the book and say the answer in your own words","Review — briefly revisit the chapter a day or two later"]},
  {category:"📝 Reading, Notes & Organisation", title:"The Feynman Technique (Teach It Simply)", body:"Explain a topic in the simplest language possible, as if teaching it to a curious child with no background. The moment you stumble or reach for jargon to cover a gap, you've found exactly what you don't understand yet — go back, relearn that piece, and simplify your explanation again."},
  {category:"📝 Reading, Notes & Organisation", title:"Highlighting Smart, Not Much", body:"Heavy highlighting feels productive but adds little — if everything is highlighted, nothing stands out. Limit yourself to the single most important phrase per paragraph, and turn the rest into your own short notes instead."},
  {category:"📝 Reading, Notes & Organisation", title:"Digital vs Handwritten Notes", body:"Handwriting often forces you to summarise in your own words as you write, which can deepen understanding, while typed notes are faster to search, organise and sync offline. Consider a hybrid: handwrite first drafts or diagrams while learning a topic, then type a clean, searchable summary afterwards."},

  /* ===== Category 4: Focus, Time & Productivity ===== */
  {category:"⏳ Focus, Time & Productivity", title:"The Pomodoro Technique", body:"Work in focused sprints — typically 25 minutes of undistracted study followed by a 5-minute break — with a slightly longer break after every four sprints. Short, defined bursts make starting easier and help maintain concentration for longer overall than one unbroken marathon session."},
  {category:"⏳ Focus, Time & Productivity", title:"Deep Work & Single-Tasking", body:"Switching between tasks (chat, social media, study, back to chat) costs far more focus than it feels like it does. Pick one task, silence notifications, and give it your full attention for a set block of time — a shorter session of true focus usually beats a longer session of constant switching."},
  {category:"⏳ Focus, Time & Productivity", title:"Designing Your Study Environment", body:"Your environment shapes your focus more than willpower does. A consistent, dedicated study spot — reasonably tidy, well lit, with your phone out of arm's reach — trains your brain to associate that space with concentration."},
  {category:"⏳ Focus, Time & Productivity", title:"Habit Stacking", body:"Attach a new study habit to a routine you already do without thinking, so it needs less willpower to start. For example: 'After I have breakfast, I review 20 flashcards' or 'After evening prayers, I do one Test Yourself quiz.' The existing habit becomes the trigger for the new one."},
  {category:"⏳ Focus, Time & Productivity", title:"Weekly Planning & Time-Blocking", body:"Spend 15 minutes at the start of each week mapping out roughly which subject you'll focus on in each study block. Planning ahead — rather than deciding what to study each day in the moment — reduces decision fatigue and protects you from last-minute cramming."},
  {category:"⏳ Focus, Time & Productivity", title:"Beating Procrastination", body:"Procrastination is usually about avoiding an uncomfortable feeling, not laziness — so make starting as small and painless as possible.",
   list:["Use the two-minute rule — commit to just two minutes of the task; starting is the hardest part","Break a big, vague task ('study Biology') into a tiny first step ('read one topic's key terms')","Pair a task you're avoiding with something you enjoy, like a favourite playlist","Forgive a slow start quickly — dwelling on guilt makes the next start even harder"]},
  {category:"⏳ Focus, Time & Productivity", title:"Digital Minimalism & Managing Distractions", body:"Decide on boundaries for entertainment apps before your study session starts, not during it. Simple moves — putting your phone in another room, using a focus/app-blocking mode, or logging out of distracting apps during study blocks — remove the need to rely on willpower in the moment."},

  /* ===== Category 5: Exam & Practice Strategy ===== */
  {category:"🎯 Exam & Practice Strategy", title:"Working with Past Questions", body:"Get the most out of past questions with a simple cycle.",
   list:["Attempt the questions first, without help","Identify the topics where you struggled","Go back and study those specific areas","Retry the same questions","Analyse any remaining mistakes carefully"]},
  {category:"🎯 Exam & Practice Strategy", title:"Ethical Guessing Strategy", body:"When unsure of an answer, use sound reasoning rather than guessing blindly.",
   list:["Eliminate options that are clearly incorrect first","Check the units in calculation questions","Ask whether the answer is physically or mathematically reasonable","Compare the wording of similar options carefully","Avoid changing an answer without a clear reason"]},
  {category:"🎯 Exam & Practice Strategy", title:"Timed Practice (Simulating Exam Conditions)", body:"Practise under real time pressure well before the actual test, not just the night before. Rehearsing the clock-ticking feeling in advance — using MEDSTART's CBT timer, for instance — makes the real exam feel far more familiar and less overwhelming."},
  {category:"🎯 Exam & Practice Strategy", title:"Keeping a Mistake Journal", body:"Keep a short, ongoing log of mistakes you repeat across quizzes and CBTs, grouped by topic. Reviewing this log weekly turns scattered errors into a clear, personalised revision list — far more efficient than re-studying everything equally."},
  {category:"🎯 Exam & Practice Strategy", title:"Exam-Day Tips", body:"Small, practical habits that protect your performance on the day itself.",
   list:["Get a proper night's sleep beforehand rather than cramming until the last minute","Read every question and instruction carefully before answering","Manage your time per question — don't let one hard question eat your whole clock","Answer the questions you're sure of first, then return to harder ones","Do a final check of flagged or skipped questions if time allows"]},
  {category:"🎯 Exam & Practice Strategy", title:"Managing Exam Anxiety", body:"A little nervous energy is normal and can even sharpen focus — the goal is to keep it from taking over. Thorough preparation is the strongest anxiety reducer there is; on the day, slow, deliberate breathing before you start can calm a racing heart, and reminding yourself that one hard question doesn't define the whole exam can stop a single stumble from snowballing."},

  /* ===== Category 6: Motivation & Mindset ===== */
  {category:"🌱 Motivation & Mindset", title:"Growth Mindset", body:"Struggling with a topic is part of how learning works — it is not proof that you 'can't do science'. Abilities in Biology, Chemistry, Physics and Maths grow with effort and the right strategy, the same way a muscle grows with training. Treat a difficult topic as 'not yet mastered', not as a fixed limit."},
  {category:"🌱 Motivation & Mindset", title:"SMART Goal-Setting", body:"Vague goals ('read more Chemistry') are easy to abandon. Specific, Measurable, Achievable, Relevant, Time-bound goals are far easier to act on — for example, 'Score at least 80% on three Chemistry CBTs by the end of this month' instead of simply 'get better at Chemistry'."},
  {category:"🌱 Motivation & Mindset", title:"Accountability & Study Groups", body:"Studying with a partner or small group — even briefly — adds healthy accountability and a chance to explain concepts to each other, which deepens your own understanding. Choose partners who keep you focused, not ones who turn study time into something else entirely."},
  {category:"🌱 Motivation & Mindset", title:"Reframing Setbacks as Data", body:"A disappointing CBT score is information, not a verdict on your ability. Use MEDSTART's detailed corrections to see exactly which topics need more work, then treat that score as the starting point for a targeted plan — not as a reason to give up on a subject."},
  {category:"🌱 Motivation & Mindset", title:"Avoiding the Comparison Trap", body:"Everyone's starting point, schedule and pace are different, and social media rarely shows the full picture of someone else's effort or struggles. Track your own progress against your own past performance — using MEDSTART's own progress charts is a good place to start — rather than against a curated version of someone else's journey."},
  {category:"🌱 Motivation & Mindset", title:"Reconnecting With Your \"Why\"", body:"On hard days, briefly reconnect with the bigger reason you're doing this — the kind of doctor or health professional you want to become, or who you're doing it for. A clear sense of purpose won't remove the difficulty of a tough topic, but it can be enough to help you sit back down and start again."},

  /* ===== Category 7: Body, Brain & Wellbeing ===== */
  {category:"💪 Body, Brain & Wellbeing", title:"Sleep & Memory Consolidation", body:"Sleep is when your brain actively consolidates what you studied that day, moving it from short-term into longer-term memory. Pulling an all-nighter before a CBT often undermines the very information you were trying to lock in — a full, consistent night's sleep is one of the highest-value study tools there is, especially the night before a test."},
  {category:"💪 Body, Brain & Wellbeing", title:"Nutrition & Hydration for Focus", body:"A balanced meal and enough water support steady concentration far better than skipping meals or relying heavily on caffeine or energy drinks, which can leave you jittery and cause a crash later. Simple, regular meals and a water bottle nearby are enough — this isn't about strict rules, just steady fuel for a focused brain."},
  {category:"💪 Body, Brain & Wellbeing", title:"Movement & Exercise Breaks", body:"A short walk, stretch, or a few minutes of movement between study sessions can noticeably refresh focus and mood — physical activity increases blood flow to the brain and is a genuinely effective break, far more restorative than scrolling on a phone for the same amount of time."},
  {category:"💪 Body, Brain & Wellbeing", title:"Rest Days & Preventing Burnout", body:"Consistency matters more than intensity — MEDSTART's streak system rewards regular, meaningful activity, not punishing perfection, and missing a day never resets your progress to zero. Scheduling deliberate rest, rather than only resting when you collapse from exhaustion, is what makes a demanding study routine sustainable over months, not just days."},
  {category:"💪 Body, Brain & Wellbeing", title:"Balancing Screen Time & Social Media", body:"Set clear boundaries around entertainment apps during study blocks rather than trying to resist them moment to moment — for example, keeping them off your home screen or using a focus mode during study hours. Protecting some completely offline time each day also gives your mind a genuine chance to rest and process what you've learned."},

  /* ===== Category 8: Moral, Mental & Life Lessons for the Journey ===== */
  {category:"🤝 Moral, Mental & Life Lessons", title:"Discipline Over Motivation", body:"Motivation naturally rises and falls — it is not a reliable engine for months of preparation. Discipline, in the form of small, repeatable routines, keeps you moving on the low-motivation days too. Build systems (a fixed study time, a habit-stacked routine) that don't depend on how you feel in the moment."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Honesty & Academic Integrity", body:"Build genuine understanding rather than shortcuts, even when a shortcut is tempting and no one would know. The real goal isn't just passing a test — it's becoming someone who will one day be trusted with real patients' care, and the honest effort you put in now quietly becomes the foundation of that trustworthiness later."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Patience With the Process", body:"Building a genuine foundation in Biology, Chemistry, Physics and Maths takes time — there is no shortcut that skips real understanding. Comparing your timeline to an idealised version of someone else's creates unnecessary pressure; consistent small effort, repeated over months, compounds into real mastery."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Handling Failure & Rejection With Resilience", body:"Not every test, topic or attempt will go the way you hoped, and setbacks are a normal, common part of the path toward medicine — they do not define your ability or your future. Treat each one as feedback that tells you what to adjust, not as proof that you should stop trying."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Helping Others as You Learn", body:"Explaining a concept to a struggling classmate reinforces your own understanding at least as much as it helps them — teaching is one of the most underrated study techniques there is. Supporting each other, rather than treating classmates purely as competition, tends to make the whole journey lighter for everyone involved."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Gratitude & Perspective", body:"It's easy to focus only on how far you still have to go. Regularly taking stock of how far you've already come — topics mastered, streaks kept, scores improved — helps sustain motivation over a long journey, and MEDSTART's own progress tracking is a useful place to look back on that."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Staying Grounded in Your Personal Values", body:"Many students find that leaning on something bigger than the next exam — personal values, a sense of purpose, or their faith, whatever that looks like for them — helps them stay steady through a long and demanding journey. There's no single right way to do this, but having a grounded sense of who you are and why you're doing this can help keep the pressure of study in perspective."},
  {category:"🤝 Moral, Mental & Life Lessons", title:"Balancing Ambition With Self-Care", body:"Wanting to excel is a good and worthy thing — but ambition sustained without enough rest, relationships and joy outside of study tends to burn out rather than reach the goal. A steady, sustainable pace, paired with genuine care for your wellbeing, will almost always outperform short, intense bursts followed by collapse."}
];

function defaultState(){
  return {
    activated:false, name:"", code:"",
    streak:{current:0, longest:0, lastDate:null, history:[]},
    stats:{questionsAnswered:0, correctAnswered:0, topicsCompleted:[], cbtScores:[], flashcardReviews:{}, totalFlashcardReviews:0, brainXP:0},

}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const saved = JSON.parse(raw);
    const merged = Object.assign(defaultState(), saved);
    merged.stats = Object.assign(defaultState().stats, saved.stats||{});
    merged.streak = Object.assign(defaultState().streak, saved.streak||{});
    merged.achievementsUnlocked = saved.achievementsUnlocked || [];
    return merged;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }

function dateStr(d){ return d.toISOString().slice(0,10); }
function todaySeed(){
  const d = new Date(); return d.getFullYear()*372 + d.getMonth()*31 + d.getDate();
}
function seededPick(arr, seed){ return arr[seed % arr.length]; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function markActivityToday(){
  const today = dateStr(new Date());
  if(STATE.streak.lastDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = dateStr(y);
  if(STATE.streak.lastDate === yesterday){ STATE.streak.current += 1; }
  else { STATE.streak.current = 1; }
  STATE.streak.longest = Math.max(STATE.streak.longest, STATE.streak.current);
  STATE.streak.lastDate = today;
  if(!STATE.streak.history.includes(today)) STATE.streak.history.push(today);
  saveState();
}

/* =========================================================
   Spaced repetition (SM-2-lite)
   ========================================================= */
function addDays(dateObj, n){ const d = new Date(dateObj); d.setDate(d.getDate()+n); return d; }
function nextReview(prev, rating){
  let reps = prev.reps || 0;
  let ease = prev.ease || 2.5;
  let interval = prev.interval || 0;
  if(rating === 'again'){
    reps = 0;
    interval = 0;
    ease = Math.max(1.3, ease - 0.2);
  } else {
    reps += 1;
    if(rating === 'hard'){
      interval = interval ? Math.max(1, Math.round(interval * 1.2)) : 1;
      ease = Math.max(1.3, ease - 0.15);
    } else if(rating === 'good'){
      interval = interval ? Math.round(interval * ease) : 1;
    } else if(rating === 'easy'){
      interval = interval ? Math.round(interval * ease * 1.3) : 4;
      ease = ease + 0.15;
    }
  }
  const dueDate = interval === 0 ? new Date() : addDays(new Date(), interval);
  return {reps, ease:Math.round(ease*100)/100, interval, due:dateStr(dueDate), lastRating:rating, reviewedAt:dateStr(new Date())};
}
function isDue(cardId){
  const r = STATE.stats.flashcardReviews[cardId];
  if(!r) return true; // never reviewed = due now
  return r.due <= dateStr(new Date());
}

/* =========================================================
   Smart Recommendations
   ========================================================= */
function subjectPerformance(){
  const totals = {};
  SUBJECTS.forEach(sub=> totals[sub.id] = {correct:0, total:0});
  STATE.stats.cbtScores.forEach(r=>{
    if(r.subject==='mixed' || !totals[r.subject]) return;
    totals[r.subject].correct += r.score; totals[r.subject].total += r.total;
  });
  return totals;
}
function getRecommendations(){
  const recs = [];
  const perf = subjectPerformance();
  const withData = SUBJECTS.filter(s=> perf[s.id].total > 0).map(s=>({...s, pct: Math.round(perf[s.id].correct/perf[s.id].total*100)}));
  const dueCount = countDue(null);

  if(dueCount > 0){
    recs.push({icon:"🃏", text:`You have ${dueCount} flashcard${dueCount===1?'':'s'} waiting for review.`, nav:"flashcards"});
  }
  if(withData.length){
    const weakest = withData.slice().sort((a,b)=>a.pct-b.pct)[0];
    const strongest = withData.slice().sort((a,b)=>b.pct-a.pct)[0];
    if(weakest.pct < 60){
      recs.push({icon:weakest.icon, text:`${weakest.name} appears to be a weak area (${weakest.pct}% in CBT). Review the foundation before attempting another test.`, nav:"learn"});
    } else if(strongest.pct >= 85 && withData.length > 1){
      const others = withData.filter(s=>s.id!==strongest.id);
      const suggestion = others.sort((a,b)=>a.pct-b.pct)[0];
      recs.push({icon:suggestion.icon, text:`Great work in ${strongest.name}! Let's strengthen ${suggestion.name} today.`, nav:"learn"});
    }
  }
  const untried = SUBJECTS.filter(s=> perf[s.id].total === 0);
  if(untried.length && recs.length < 2){
    recs.push({icon:untried[0].icon, text:`You haven't taken a CBT in ${untried[0].name} yet — try a quick test to see where you stand.`, nav:"cbt"});
  }
  if(recs.length === 0){
    recs.push({icon:"🎯", text:"You're on track — keep the streak going with today's focus topics.", nav:"dashboard"});
  }
  return recs.slice(0,3);
}

let __unlocking = false;
async function tryActivate(){
  if(__unlocking) return;
  const name = document.getElementById('stuName').value.trim();
  const code = document.getElementById('stuCode').value.trim().toUpperCase();
  const errBox = document.getElementById('activateErr');
  const btn = document.getElementById('activateBtn');

  if(!name){ errBox.innerHTML = `<div class="err-msg">Please enter your name.</div>`; return; }
  if(name.length < 2){ errBox.innerHTML = `<div class="err-msg">Please enter your full name.</div>`; return; }
  if(!code){ errBox.innerHTML = `<div class="err-msg">Please enter your access code.</div>`; return; }

  __unlocking = true;
  if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }

  let result = null;
  try{
    const url = `${ADMIN_SHEET_URL}?action=verify&code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
    const res = await fetch(url);
    result = await res.json();
  }catch(e){
    errBox.innerHTML = `<div class="err-msg">Couldn't reach the access server. Check your internet connection and try again — you only need internet for this one step.</div>`;
    __unlocking = false;
    if(btn){ btn.disabled = false; btn.textContent = 'Unlock MEDSTART'; }
    return;
  }

  __unlocking = false;
  if(btn){ btn.disabled = false; btn.textContent = 'Unlock MEDSTART'; }

  if(!result || !result.ok){
    const links = requestLinks();
    const reason = result && result.error === 'revoked'
      ? 'This access code has been deactivated.'
      : "That access code isn't valid.";
    errBox.innerHTML = `<div class="err-msg">${reason} Check it carefully, or <a href="${links.wa}" target="_blank" rel="noopener" style="text-decoration:underline;font-weight:600;color:inherit">request a code</a>.</div>`;
    const input = document.getElementById('stuCode');
    if(input){ input.value = ''; input.focus(); }
    return;
  }

  STATE.activated = true; STATE.name = name; STATE.code = code;
  saveState();
  markActivityToday();
  showToast(`Welcome, ${name} 👋`);
  nav('dashboard');
}

/* =========================================================
   ADMIN PANEL
   ---------------------------------------------------------
   Keeps track of which buyer has which code. This is synced
   through a small Google Sheet (see AdminSync.gs) so the same
   list shows up whether you check it from your phone, your
   laptop, or anywhere else. The 200 codes themselves work for
   any student regardless of what's noted here — this list
   just helps you remember who you've given a code to.

   Paste your MedstartServer.gs web app URL below. It looks
   like: https://script.google.com/macros/s/AKfycb.../exec
   ========================================================= */

let adminUnlocked = false;
let adminSearch = "";
let adminLogCache = null;   // null = not loaded yet from the sheet; array of {code,name,status,timesUsed}
let adminLoading = false;
let adminLoadError = null;
let adminGenerating = false;

function adminConfigured(){
  return typeof ADMIN_SHEET_URL === "string" && ADMIN_SHEET_URL.startsWith("http");
}

async function fetchAdminLog(){
  if(!adminConfigured()){ adminLogCache = []; return; }
  adminLoading = true; adminLoadError = null;
  try{
    const url = `${ADMIN_SHEET_URL}?action=list&secret=${encodeURIComponent(ADMIN_PASSWORD)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "load_failed");
    adminLogCache = data.rows;
  }catch(e){
    adminLoadError = "Couldn't load your codes. Check your internet connection.";
  }
  adminLoading = false;
  render();
}

async function generateAdminCode(name){
  if(!adminConfigured()){ showToast("Connect your Google Sheet first — see the note above."); return; }
  adminGenerating = true; render();
  try{
    const url = `${ADMIN_SHEET_URL}?action=generate&secret=${encodeURIComponent(ADMIN_PASSWORD)}&name=${encodeURIComponent(name)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "generate_failed");
    adminLogCache.unshift({code: data.code, name: data.name, status: "Active", createdAt: new Date().toISOString(), lastUsedAt: "", timesUsed: 0});
    adminGenerating = false;
    render();
    showToast(`Code generated for ${data.name}`);
  }catch(e){
    adminGenerating = false;
    render();
    showToast("Couldn't generate a code — check your internet and try again.");
  }
}

async function setAdminCodeStatus(code, newStatus){
  const row = adminLogCache.find(r => r.code === code);
  if(row) row.status = newStatus;
  render();
  try{
    const action = newStatus === "Revoked" ? "revoke" : "reactivate";
    const url = `${ADMIN_SHEET_URL}?action=${action}&secret=${encodeURIComponent(ADMIN_PASSWORD)}&code=${encodeURIComponent(code)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "status_failed");
  }catch(e){
    showToast("Updated here, but couldn't sync — check your internet.");
  }
}

async function deleteAdminCode(code){
  adminLogCache = adminLogCache.filter(r => r.code !== code);
  render();
  try{
    const url = `${ADMIN_SHEET_URL}?action=delete&secret=${encodeURIComponent(ADMIN_PASSWORD)}&code=${encodeURIComponent(code)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "delete_failed");
  }catch(e){
    showToast("Deleted here, but couldn't sync — check your internet.");
  }
}

  }

  const revokedCount = total - activeCount;

  const q = adminSearch.trim().toLowerCase();

    .sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||"")) // newest first
    .slice(0, 60); // keep the DOM light; search narrows it down

  const rowsHtml = rows.map(r=>{

      <div class="admin-note">Codes are checked live against your Google Sheet — nothing here can be read from the site's source code, and this list is the same on every device.</div>

      <div class="admin-card">
        <label style="display:block;font-size:12.5px;font-weight:600;margin-bottom:8px;color:var(--navy)">Generate a code for a new buyer</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="newBuyerName" placeholder="Buyer's full name…" style="flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit" ${adminGenerating ? 'disabled' : ''}>
          <button class="row-btn assign" id="generateBtn" style="padding:0 18px" ${adminGenerating ? 'disabled' : ''}>${adminGenerating ? 'Generating…' : 'Generate'}</button>

        <div class="admin-stat"><div class="num">${activeCount}</div><div class="lbl">Active</div></div>
        <div class="admin-stat"><div class="num">${revokedCount}</div><div class="lbl">Revoked</div></div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:14px">

      </div>

      <div class="admin-card">

      </div>
    </div>
  </div>`;
}

function escapeAdminHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachAdminHandlers(){
  const unlockBtn = document.getElementById('adminUnlockBtn');
  if(unlockBtn){
    const tryUnlock = ()=>{
      const pw = document.getElementById('adminPw').value;
      if(pw === ADMIN_PASSWORD){
        adminUnlocked = true;
        adminLogCache = null;
        render();
      }else{
        document.getElementById('adminErr').innerHTML = `<div class="err-msg">Wrong password.</div>`;
      }
    };
    unlockBtn.addEventListener('click', tryUnlock);
    const pwInput = document.getElementById('adminPw');
    if(pwInput) pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  }
  const toggleAdminPw = document.getElementById('toggleAdminPwBtn');
  if(toggleAdminPw){
    toggleAdminPw.addEventListener('click', ()=>{
      const input = document.getElementById('adminPw');
      const show = document.getElementById('adminEyeShow');
      const hide = document.getElementById('adminEyeHide');
      const nowText = input.type === 'password';
      input.type = nowText ? 'text' : 'password';
      show.classList.toggle('hide', nowText);
      hide.classList.toggle('hide', !nowText);
    });
  }

  const searchInput = document.getElementById('adminSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', e=>{
      adminSearch = e.target.value;
      const focusVal = adminSearch;
      render();
      const restored = document.getElementById('adminSearchInput');
      if(restored){
        restored.value = focusVal;
        restored.focus();
        restored.setSelectionRange(focusVal.length, focusVal.length);
      }
    });
  }

  const genBtn = document.getElementById('generateBtn');
  const nameInput = document.getElementById('newBuyerName');
  if(genBtn && nameInput){
    const doGenerate = ()=>{
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      generateAdminCode(name);
      nameInput.value = '';
    };
    genBtn.addEventListener('click', doGenerate);
    nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doGenerate(); });
  }

  document.querySelectorAll('[data-revoke-code]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const code = btn.getAttribute('data-revoke-code');
      if(!confirm(`Revoke ${code}? Whoever has this code will no longer be able to log in with it.`)) return;
      setAdminCodeStatus(code, 'Revoked');
    });
  });

  document.querySelectorAll('[data-reactivate-code]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const code = btn.getAttribute('data-reactivate-code');
      setAdminCodeStatus(code, 'Active');
    });
  });

  const retryBtn = document.getElementById('adminRetryBtn');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{ adminLoadError = null; adminLogCache = null; render(); });

  const refreshBtn = document.getElementById('adminRefreshBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', ()=>{ adminLogCache = null; render(); });
}

  `;
}
function startBrainGame(catId){
  const cat = BRAIN_CATEGORIES.find(c=>c.id===catId);
  const lvl = brainLevelFromXp(STATE.stats.brainXP).level;
  const questions = [];
  const seenText = new Set();
  for(let i=0;i<BRAIN_SESSION_LEN;i++){
    let q, tries = 0;
    do { q = cat.gen(lvl); tries++; } while(seenText.has(q.q) && tries < 12);
    seenText.add(q.q);
    questions.push(q);
  }
  brainSession = {catId, catName:cat.name, catIcon:cat.icon, type:cat.type, questions, index:0, correct:0, xpEarned:0, answered:false, selected:null, textValue:""};
  nav('brainlab-run');
}
function viewBrainGame(){
  if(!brainSession) return `<p>No active game.</p><button class="btn btn-primary" data-nav="brainlab">Back to Brain Lab</button>`;
  const s = brainSession;
  const q = s.questions[s.index];
  return `
  <div class="cbt-topbar">
    <div class="qcount">${s.catIcon} ${s.catName} — ${s.index+1} / ${s.questions.length}</div>
    <div class="badge">⭐ ${s.xpEarned} XP earned</div>
  </div>
  <div class="card">
    <div class="qtext" style="font-size:17px;margin-bottom:16px">${q.q}</div>
    ${q.type === "text" ? `
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Hint: ${q.hint}</p>
      <input id="brainTextInput" type="text" placeholder="Type your answer" ${s.answered?'disabled':''}
        style="width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;text-transform:uppercase"
        value="${s.answered ? q.answer : ''}">
      ${!s.answered ? `<button class="btn btn-dark" style="margin-top:12px" id="brainSubmitText">Submit</button>` : ""}
    ` : `
      <div class="opt-list">
        ${q.options.map((o,oi)=>{
          let cls = "opt";
          if(s.answered){
            if(oi===q.answer) cls += " correct";
            else if(oi===s.selected) cls += " wrong";
          } else if(s.selected===oi){ cls += " selected"; }
          return `<div class="${cls}" data-brainopt="${oi}">${o}</div>`;
        }).join("")}
      </div>
    `}
    ${s.answered ? `<div class="opt-explain" style="margin-top:14px">${s.correct_last ? "Correct — " : "Not quite — "}${q.explain}</div>` : ""}
  </div>
  <div style="display:flex;gap:10px;margin-top:16px">
    ${s.answered ? `<button class="btn btn-primary" id="brainNextBtn">${s.index < s.questions.length-1 ? "Next →" : "See Results"}</button>` : ""}
    <button class="btn btn-outline" data-nav="brainlab">Exit Game</button>
  </div>
  `;
}
function submitBrainAnswer(selectedIndexOrText){
  const s = brainSession;
  const q = s.questions[s.index];
  if(s.answered) return;
  let isCorrect;
  if(q.type === "text"){
    isCorrect = (selectedIndexOrText||"").trim().toUpperCase() === q.answer;
    s.selected = selectedIndexOrText;
  } else {
    isCorrect = selectedIndexOrText === q.answer;
    s.selected = selectedIndexOrText;
  }
  s.answered = true;
  s.correct_last = isCorrect;
  const lvl = brainLevelFromXp(STATE.stats.brainXP).level;
  if(isCorrect){
    const xp = 10 + lvl*3;
    s.correct += 1;
    s.xpEarned += xp;
  }
  nav('brainlab-run');
}
function finishBrainGame(){
  const s = brainSession;
  STATE.stats.brainXP += s.xpEarned;
  saveState();
  checkAchievements();
  nav('brainlab-result');
}

/* ---------- CBT ---------- */
let cbtSetupSubject = null;
let cbtQuestionCount = 10, cbtDurationMin = 10;
const CBT_COUNT_OPTIONS = [5,10,15,20,25,30];
const CBT_DURATION_OPTIONS = [5,10,15,20,30,45,60];
let cbtSession = null; // {subject, questions, answers, flags, index, timeLeft, timerHandle}
function viewCbtSetup(){
  return `
  <h1 style="font-size:26px">🎯 MEDSTART CBT</h1>
  <p style="color:var(--muted);margin-top:6px;font-size:14.5px">Choose a subject, set how many questions and how much time, then start.</p>
  <div class="cbt-setup-grid" style="margin-top:20px">
    ${SUBJECTS.map(s=>`<div class="cbt-subject-card ${cbtSetupSubject===s.id?'selected':''}" data-cbtsubj="${s.id}"><div class="ic">${s.icon}</div><div style="font-weight:700;font-size:14px">${s.name}</div></div>`).join("")}
    <div class="cbt-subject-card ${cbtSetupSubject==='mixed'?'selected':''}" data-cbtsubj="mixed"><div class="ic">🔀</div><div style="font-weight:700;font-size:14px">Mixed Science</div></div>
  </div>

  <div class="section-title"><h3>Number of Questions</h3></div>
  <div class="subject-tabs">
    ${CBT_COUNT_OPTIONS.map(n=>`<button class="subject-tab ${cbtQuestionCount===n?'active':''}" data-cbtcount="${n}">${n}</button>`).join("")}
  </div>

  <div class="section-title"><h3>Time Limit</h3></div>
  <div class="subject-tabs">
    ${CBT_DURATION_OPTIONS.map(m=>`<button class="subject-tab ${cbtDurationMin===m?'active':''}" data-cbtdur="${m}">${m} min</button>`).join("")}
  </div>

  <button class="btn btn-primary btn-full" id="startCbtBtn" style="margin-top:24px" ${cbtSetupSubject?'':'disabled'}>Start Test (${cbtQuestionCount} questions · ${cbtDurationMin}:00)</button>
  ${cbtSetupSubject ? cbtAvailabilityNote() : ""}
  `;
}
function cbtAvailabilityNote(){
  const available = buildQuestionPool(cbtSetupSubject, 9999).length;
  if(available < cbtQuestionCount){
    return `<p style="color:var(--muted);font-size:12.5px;margin-top:10px;text-align:center">Only ${available} question${available===1?'':'s'} currently available for this subject — the test will use all of them.</p>`;
  }
  return "";
}
function buildQuestionPool(subject, count){
  let pool = [];
  const subjects = subject==="mixed" ? SUBJECTS.map(s=>s.id) : [subject];
  subjects.forEach(sid=>{
    (TOPICS[sid]||[]).forEach(t=> t.testYourself.forEach(q=>pool.push({...q, subject:sid, topic:t.title})));
    (EXTRA_QUESTIONS[sid]||[]).forEach(q=>pool.push({...q, subject:sid, topic: SUBJECTS.find(s=>s.id===sid).name}));
  });
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0, Math.min(count, pool.length));
}
function startCbt(){
  const qs = buildQuestionPool(cbtSetupSubject, cbtQuestionCount);
  cbtSession = {subject:cbtSetupSubject, questions:qs, answers:new Array(qs.length).fill(null), flags:new Array(qs.length).fill(false), index:0, timeLeft:cbtDurationMin*60, totalTime:cbtDurationMin*60, startTime: Date.now()};
  nav('cbt-run');
  startCbtTimer();
}
function startCbtTimer(){
  clearInterval(window.__cbtTimer);
  window.__cbtTimer = setInterval(()=>{
    if(!cbtSession) { clearInterval(window.__cbtTimer); return; }
    cbtSession.timeLeft -= 1;
    if(cbtSession.timeLeft <= 0){ clearInterval(window.__cbtTimer); submitCbt(); return; }
    const timerEl = document.getElementById('cbtTimer');
    if(timerEl){
      timerEl.textContent = fmtTime(cbtSession.timeLeft);
      timerEl.classList.toggle('low', cbtSession.timeLeft < 60);
    }
  }, 1000);
}
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

function viewCbtRun(){
  if(!cbtSession) return `<p>No active test.</p><button class="btn btn-primary" data-nav="cbt">Start a test</button>`;
  const i = cbtSession.index;
  const q = cbtSession.questions[i];
  const selected = cbtSession.answers[i];
  return `
  <div class="cbt-topbar">
    <div class="qcount">Question ${i+1} / ${cbtSession.questions.length}</div>
    <div class="timer" id="cbtTimer">${fmtTime(cbtSession.timeLeft)}</div>
  </div>
  <div class="card">
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${q.topic}</p>
    <div class="qtext" style="font-size:17px;margin-bottom:16px">${q.q}</div>
    <div class="opt-list">
      ${q.options.map((o,oi)=>`<div class="opt ${selected===oi?'selected':''}" data-cbtopt="${oi}">${o}</div>`).join("")}
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
    <button class="btn btn-outline" id="cbtPrev" ${i===0?'disabled':''}>← Previous</button>
    <button class="btn btn-outline" id="cbtFlag">${cbtSession.flags[i] ? '🚩 Flagged' : '🚩 Flag Question'}</button>
    ${i < cbtSession.questions.length-1 ? `<button class="btn btn-dark" id="cbtNext">Next →</button>` : `<button class="btn btn-primary" id="cbtSubmit">Submit Test</button>`}
  </div>
  <div class="cbt-nav-grid">
    ${cbtSession.questions.map((qq,qi)=>`<div class="qnum ${cbtSession.answers[qi]!==null?'answered':''} ${cbtSession.flags[qi]?'flagged':''} ${qi===i?'current':''}" data-cbtjump="${qi}">${qi+1}</div>`).join("")}
  </div>
  `;
}
function submitCbt(){
  clearInterval(window.__cbtTimer);
  const qs = cbtSession.questions;
  let correct = 0;
  qs.forEach((q,i)=>{ if(cbtSession.answers[i]===q.answer) correct++; });
  const timeUsed = cbtSession.totalTime - cbtSession.timeLeft;
  STATE.stats.questionsAnswered += qs.length;
  STATE.stats.correctAnswered += correct;
  STATE.stats.cbtScores.push({subject:cbtSession.subject, score:correct, total:qs.length, date:dateStr(new Date())});
  markActivityToday();
  saveState();
  checkAchievements();
  cbtSession.finalScore = correct; cbtSession.timeUsed = timeUsed;
  nav('cbt-result');
}
function viewCbtResult(){
  if(!cbtSession || cbtSession.finalScore===undefined) return `<p>No result available.</p><button class="btn btn-primary" data-nav="cbt">Start a test</button>`;
  const total = cbtSession.questions.length;
  const acc = Math.round((cbtSession.finalScore/total)*100);
  const wrongItems = cbtSession.questions.map((q,i)=>({q,i})).filter(x=>cbtSession.answers[x.i]!==x.q.answer);
  return `
  <div class="result-hero">
    <p style="color:var(--muted);font-weight:700;letter-spacing:.02em;font-size:13px">TEST RESULTS</p>
    <div class="score">${cbtSession.finalScore}/${total}</div>
    <p style="color:var(--muted);margin-top:6px">${acc}% accuracy · ${fmtTime(cbtSession.timeUsed)} used</p>
  </div>
  <div class="result-stats">
    <div class="stat"><div class="num">${acc}%</div><div class="lbl">Accuracy</div></div>
    <div class="stat"><div class="num">${cbtSession.finalScore}</div><div class="lbl">Correct</div></div>
    <div class="stat"><div class="num">${total-cbtSession.finalScore}</div><div class="lbl">Incorrect</div></div>
  </div>
  ${wrongItems.length ? `<div class="section-title"><h3>Questions to Review</h3></div>` : `<p style="text-align:center;color:var(--teal);font-weight:700;margin-top:10px">Perfect score — well done! 🎉</p>`}
  ${wrongItems.map(({q,i})=>`
    <div class="review-item">
      <p style="font-weight:600;font-size:14.5px">${q.q}</p>
      <p class="qa-line wrong">Your answer: ${cbtSession.answers[i]!==null ? q.options[cbtSession.answers[i]] : "No answer"}</p>
      <p class="qa-line right">Correct answer: ${q.options[q.answer]}</p>
      <p style="font-size:13px;color:var(--muted);margin-top:6px">${q.explain}</p>
      <p style="font-size:12px;color:var(--muted);margin-top:4px">Topic: ${q.topic}</p>
    </div>`).join("")}
  <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
    <button class="btn btn-primary" data-nav="cbt">Take Another Test</button>
    <button class="btn btn-outline" data-nav="dashboard">Back to Dashboard</button>
  </div>
  `;
}

/* ---------- Progress ---------- */
function viewProgress(){
  const s = STATE.stats;
  const subjTotals = {};
  SUBJECTS.forEach(sub=>subjTotals[sub.id] = {correct:0,total:0});
  s.cbtScores.forEach(r=>{
    if(r.subject==='mixed') return;
    if(subjTotals[r.subject]){ subjTotals[r.subject].correct += r.score; subjTotals[r.subject].total += r.total; }
  });
  const scienceSubjects = ["biology","chemistry","physics","mathematics"];
  const scienceCompleted = scienceSubjects.reduce((n,k)=>n+TOPICS[k].filter(t=>s.topicsCompleted.includes(t.id)).length,0);
  const scienceTotal = scienceSubjects.reduce((n,k)=>n+TOPICS[k].length,0);
  const medCompleted = TOPICS.medical.filter(t=>s.topicsCompleted.includes(t.id)).length;
  const avgCbt = s.cbtScores.length ? Math.round(s.cbtScores.reduce((a,r)=>a+(r.score/r.total*100),0)/s.cbtScores.length) : 0;
  const fcReviewed = Object.keys(s.flashcardReviews).length;
  const fcTotal = buildDeck(null).length;

  const weak = Object.entries(subjTotals).filter(([k,v])=>v.total>0).map(([k,v])=>({k, pct: Math.round(v.correct/v.total*100)})).sort((a,b)=>a.pct-b.pct).slice(0,3);

  return `
  <h1 style="font-size:26px">📊 My Progress</h1>
  <div class="card" style="margin-top:20px">
    <h3>Overall Progress</h3>
    ${progRow("Science Foundation", scienceTotal? Math.round(scienceCompleted/scienceTotal*100):0)}
    ${progRow("Medical Foundations", TOPICS.medical.length ? Math.round(medCompleted/TOPICS.medical.length*100):0)}
    ${progRow("CBT Practice (avg score)", avgCbt)}
    ${progRow("Flashcards Reviewed", fcTotal ? Math.round(fcReviewed/fcTotal*100):0)}
  </div>
  <div class="card">
    <h3>Subject Performance (CBT)</h3>
    ${SUBJECTS.filter(x=>x.id!=='medical').map(sub=>{
      const v = subjTotals[sub.id];
      const pct = v.total ? Math.round(v.correct/v.total*100) : 0;
      return progRow(`${sub.icon} ${sub.name}`, pct, v.total===0);
    }).join("")}
    ${progRow(`🩺 ${SUBJECTS.find(x=>x.id==='medical').name}`, subjTotals.medical.total ? Math.round(subjTotals.medical.correct/subjTotals.medical.total*100) : 0, subjTotals.medical.total===0)}
  </div>
  ${weak.length ? `<div class="card"><h3>Topics to Review</h3><div class="weak-list">
    ${weak.map(w=>`<div class="weak-item"><span>${SUBJECTS.find(s=>s.id===w.k).icon} ${SUBJECTS.find(s=>s.id===w.k).name}</span><span class="badge">${w.pct}%</span></div>`).join("")}
  </div></div>` : ""}
  <div class="card">
    <h3>🔥 Streak</h3>
    <p style="font-size:14.5px">Current streak: <b>${STATE.streak.current} days</b> · Longest streak: <b>${STATE.streak.longest} days</b></p>
    <p style="font-size:13px;color:var(--muted);margin-top:8px">One missed day doesn't erase your progress. Start again today.</p>
  </div>
  `;
}
function progRow(label, pct, empty){
