  {id:"chem-alkanes", subject:"chemistry", title:"Alkanes (Saturated Hydrocarbons)", icon:"⛓️",
   tag:"Organic Chemistry",
   explanation:"Alkanes are saturated hydrocarbons containing only single carbon-carbon bonds, following the general formula CₙH₂ₙ₊₂. They are relatively unreactive compared to unsaturated hydrocarbons and mainly undergo combustion and substitution reactions.",
   analogy:"Alkanes are like a fully-booked bus with every seat taken — there's no room for anything else to easily 'jump in,' which is why they are relatively unreactive (saturated).",
   keyTerms:["Saturated hydrocarbon","Single bond","Combustion","Substitution reaction","General formula CₙH₂ₙ₊₂"],
   example:"Methane (CH₄), the simplest alkane, burns in oxygen to produce carbon dioxide and water — a highly exothermic combustion reaction.",
   medicalConnection:"Some alkane derivatives are used as anaesthetics and solvents in medical and laboratory settings, though pure alkanes themselves have limited direct medical use.",
   memoryTrick:"\"Alkanes are saturated — plain and simple, single bonds only.\"",
   commonMistake:"Confusing the general formula of alkanes (CₙH₂ₙ₊₂) with that of alkenes (CₙH₂ₙ) — the extra two hydrogens signal a fully saturated structure.",
   goingDeeper:"Alkanes undergo substitution reactions with halogens (like chlorine) only in the presence of UV light, which provides enough energy to break the halogen molecule's bond and start a chain reaction — this is why simply mixing methane and chlorine in the dark produces almost no reaction, while the same mixture reacts readily in sunlight. This light-dependence is a useful diagnostic clue in exam questions: it signals that a substitution mechanism (not addition) is taking place, since addition reactions with alkenes don't require light to proceed.",
   testYourself:[
     {q:"Alkanes are described as 'saturated' because they contain:", options:["Only double bonds","Only single carbon-carbon bonds","Only triple bonds","No hydrogen atoms"], answer:1, explain:"Saturated hydrocarbons contain only single bonds between carbon atoms."},
     {q:"The general formula for alkanes is:", options:["CnH2n","CnH2n+2","CnH2n-2","CnHn"], answer:1, explain:"Alkanes follow the general formula CnH2n+2."},
     {q:"Alkanes mainly undergo which two types of reaction?", options:["Addition and polymerisation","Combustion and substitution","Neutralisation and precipitation","Esterification and hydrolysis"], answer:1, explain:"Alkanes are relatively unreactive but do undergo combustion and substitution reactions."}
   ],
   flashcards:[
     {front:"What does 'saturated' mean for a hydrocarbon?", back:"It contains only single carbon-carbon bonds."},
     {front:"What is the general formula for alkanes?", back:"CnH2n+2"},
     {front:"Name the simplest alkane.", back:"Methane (CH4)."}
   ]},
  {id:"chem-alkenesalkynes", subject:"chemistry", title:"Alkenes & Alkynes (Unsaturated Hydrocarbons)", icon:"🌿",
   tag:"Organic Chemistry",
   explanation:"Alkenes contain at least one carbon-carbon double bond, and alkynes contain at least one carbon-carbon triple bond. These 'unsaturated' hydrocarbons are more reactive than alkanes because the double/triple bond can easily break to form new bonds, especially in addition reactions.",
   analogy:"An alkene's double bond is like a partially-open door — much easier for other molecules to 'push through' and react, compared to the fully-shut door of an alkane's single bond.",
   keyTerms:["Unsaturated hydrocarbon","Double bond","Triple bond","Addition reaction","Bromine water test"],
   example:"Ethene (an alkene) decolourises orange bromine water rapidly through an addition reaction, a classic test used to distinguish alkenes from alkanes.",
   medicalConnection:"Alkene chemistry underlies the production of many plastics used in medical equipment, and addition reactions are a key concept in understanding how many drug molecules are synthesised.",
   memoryTrick:"\"Ene = double, Yne = triple\" — the suffix tells you exactly what kind of multiple bond is present.",
   commonMistake:"Forgetting that only the double or triple bond reacts in an addition reaction — the rest of the carbon chain generally remains unchanged.",
   goingDeeper:"Addition reactions across a double bond can add different things depending on what's available: bromine water adds Br atoms across the double bond (the classic decolourisation test), hydrogen gas with a catalyst adds H atoms (hydrogenation, used industrially to turn unsaturated vegetable oils into more saturated fats), and steam with a catalyst adds H and OH across the bond to directly produce an alcohol. Recognising 'addition across a double bond' as the shared mechanism, rather than memorising each reaction separately, makes it much easier to predict what an unfamiliar alkene reaction will produce.",
   testYourself:[
     {q:"Alkenes contain at least one:", options:["Carbon-carbon single bond only","Carbon-carbon double bond","Carbon-carbon triple bond","Nitrogen atom"], answer:1, explain:"Alkenes are defined by having at least one C=C double bond."},
     {q:"The test for an alkene using bromine water results in:", options:["No colour change","Bromine water turning from orange to colourless","A blue precipitate","A loud reaction with smoke"], answer:1, explain:"Alkenes decolourise bromine water via an addition reaction, a classic identification test."},
     {q:"Alkynes are unsaturated hydrocarbons containing at least one:", options:["Double bond","Triple bond","Ring structure only","Ester group"], answer:1, explain:"Alkynes contain at least one carbon-carbon triple bond."}
   ],
   flashcards:[
     {front:"What functional feature defines an alkene?", back:"At least one carbon-carbon double bond."},
     {front:"What is the bromine water test used for?", back:"Identifying alkenes — bromine water turns from orange to colourless in their presence."},
     {front:"What functional feature defines an alkyne?", back:"At least one carbon-carbon triple bond."}
   ]},
  {id:"chem-alcohols", subject:"chemistry", title:"Alcohols", icon:"🧪",
   tag:"Organic Chemistry",
   explanation:"Alcohols contain a hydroxyl (-OH) functional group attached to a carbon chain. They can be oxidised to aldehydes/ketones and further to carboxylic acids, and they undergo combustion and esterification reactions.",
   analogy:"The -OH group on an alcohol is like a handle attached to the carbon chain — it's the part other molecules 'grab onto' during reactions, giving alcohols their characteristic behaviour.",
   keyTerms:["Hydroxyl group (-OH)","Oxidation","Esterification","Ethanol","Primary/secondary/tertiary alcohol"],
   example:"Ethanol, the alcohol found in fermented drinks, can be oxidised to ethanal (an aldehyde) and then further to ethanoic acid (a carboxylic acid, found in vinegar).",
   medicalConnection:"Ethanol is used medically as an antiseptic and solvent, while understanding alcohol metabolism (its oxidation pathway in the liver) is foundational to later topics in physiology and toxicology.",
   memoryTrick:"\"Alcohols love oxygen\" — they're easily oxidised, stepwise, toward more oxidised products.",
   commonMistake:"Assuming all alcohols behave identically — primary, secondary and tertiary alcohols oxidise differently, with tertiary alcohols resisting oxidation under typical conditions.",
   goingDeeper:"The three classes of alcohol — primary, secondary and tertiary — are defined by how many carbon groups are attached to the carbon bearing the -OH group, and this structural difference directly explains their different oxidation behaviour: primary alcohols oxidise all the way to carboxylic acids (via an aldehyde intermediate), secondary alcohols oxidise only as far as ketones, and tertiary alcohols resist oxidation entirely because they lack a hydrogen atom on the key carbon that the oxidation reaction needs to remove.",
   testYourself:[
     {q:"The functional group that defines an alcohol is:", options:["-COOH","-OH","-CHO","-NH2"], answer:1, explain:"Alcohols are defined by the hydroxyl (-OH) functional group."},
     {q:"Oxidising ethanol fully can eventually produce:", options:["Methane","Ethanoic acid","Sodium chloride","Ammonia"], answer:1, explain:"Ethanol oxidises stepwise to ethanal, then further to ethanoic acid."},
     {q:"Which type of alcohol generally resists oxidation?", options:["Primary","Secondary","Tertiary","All alcohols oxidise identically"], answer:2, explain:"Tertiary alcohols lack a hydrogen atom needed for typical oxidation to occur."}
   ],
   flashcards:[
     {front:"What functional group defines an alcohol?", back:"The hydroxyl group (-OH)."},
     {front:"What does oxidising ethanol eventually produce?", back:"Ethanoic acid (found in vinegar), via ethanal as an intermediate."},
     {front:"Give one medical use of ethanol.", back:"As an antiseptic and solvent."}
   ]},
  {id:"chem-carbonyls", subject:"chemistry", title:"Aldehydes & Ketones", icon:"🧬",
   tag:"Organic Chemistry",
   explanation:"Aldehydes and ketones both contain a carbonyl group (C=O), but in different positions: aldehydes have it at the end of a carbon chain, while ketones have it within the chain. This structural difference affects how each reacts, particularly with oxidising agents.",
   analogy:"An aldehyde's carbonyl is like a door at the end of a hallway, while a ketone's carbonyl is like a door somewhere in the middle — the position changes what's accessible around it.",
   keyTerms:["Carbonyl group (C=O)","Aldehyde","Ketone","Oxidation","Fehling's/Tollens' test"],
   example:"Aldehydes can be easily oxidised to carboxylic acids and give a positive result with Tollens' reagent (the 'silver mirror test'), while ketones generally resist this oxidation.",
   medicalConnection:"Ketone bodies are produced by the liver during fasting or low-carbohydrate states as an alternative fuel source, and monitoring ketone levels is clinically relevant in certain metabolic conditions.",
   memoryTrick:"\"Aldehydes are at the End of the chain.\"",
   commonMistake:"Assuming ketones and aldehydes react identically with oxidising agents — aldehydes oxidise readily to carboxylic acids, while ketones typically do not oxidise under the same mild conditions.",
   goingDeeper:"Fehling's solution and Tollens' reagent are both used to distinguish aldehydes from ketones, but they work through slightly different visual results: Tollens' reagent produces a distinctive silver 'mirror' coating the inside of the test tube, while Fehling's solution changes from blue to form a brick-red precipitate. Both tests work because aldehydes are easily oxidised (reducing the metal ions in the reagent in the process), while ketones lack the reactive hydrogen atom needed to be oxidised under these same mild conditions, so neither test changes colour in their presence.",
   testYourself:[
     {q:"Both aldehydes and ketones contain a:", options:["Hydroxyl group","Carbonyl group (C=O)","Carboxyl group","Amino group"], answer:1, explain:"Both functional groups share a carbonyl (C=O), differing only in its position."},
     {q:"In an aldehyde, the carbonyl group is located:", options:["In the middle of the chain","At the end of the carbon chain","Nowhere — aldehydes lack one","Attached to nitrogen"], answer:1, explain:"Aldehydes have the carbonyl group at the end of the carbon chain."},
     {q:"Tollens' reagent ('silver mirror test') gives a positive result with:", options:["Ketones only","Aldehydes","Alkanes","Amines"], answer:1, explain:"Aldehydes are readily oxidised and give a positive silver mirror test; ketones generally do not."}
   ],
   flashcards:[
     {front:"What functional group do aldehydes and ketones share?", back:"The carbonyl group (C=O)."},
     {front:"Where is the carbonyl group positioned in an aldehyde vs a ketone?", back:"End of the chain in aldehydes; within the chain in ketones."},
     {front:"What are ketone bodies?", back:"Alternative fuel molecules produced by the liver during fasting or low-carbohydrate states."}
   ]},
  {id:"chem-carboxylic", subject:"chemistry", title:"Carboxylic Acids & Esters", icon:"🍋",
   tag:"Organic Chemistry",
   explanation:"Carboxylic acids contain a -COOH functional group and behave as weak acids. When a carboxylic acid reacts with an alcohol (esterification), it forms an ester and water — a reaction important in both industry and biology.",
   analogy:"Esterification is like a molecular handshake: the acid's -COOH and the alcohol's -OH 'shake hands,' releasing a water molecule and joining together into a new ester compound.",
   keyTerms:["Carboxyl group (-COOH)","Weak acid","Esterification","Ester","Condensation reaction"],
   example:"Ethanoic acid reacting with ethanol produces the ester ethyl ethanoate, which has a distinctive fruity smell — a reaction that releases water as a by-product.",
   medicalConnection:"Ester bonds hold together the fatty acid chains in triglycerides (fats) and phospholipids, which are essential components of every cell membrane in the human body.",
   memoryTrick:"\"Acid + Alcohol → Ester + Water\" — the standard condensation pattern to remember for esterification.",
   commonMistake:"Confusing esterification with a simple neutralisation reaction — esterification specifically involves an alcohol (not a base) reacting with a carboxylic acid.",
   goingDeeper:"Esters are named from their 'parent' acid and alcohol, following a consistent pattern: the alcohol part becomes the first word, and the acid part becomes the second word ending in '-oate' — for example, ethanoic acid plus ethanol forms 'ethyl ethanoate'. This naming pattern isn't just useful for exams; it also reflects the actual synthesis route in reverse, since hydrolysing (breaking down with water) an ester regenerates its original parent acid and alcohol, essentially running the esterification reaction backward.",
   testYourself:[
     {q:"Carboxylic acids contain the functional group:", options:["-OH","-COOH","-CHO","-NH2"], answer:1, explain:"Carboxylic acids are defined by the carboxyl group (-COOH)."},
     {q:"Esterification is the reaction between a carboxylic acid and a(n):", options:["Base","Alcohol","Metal","Salt"], answer:1, explain:"Esterification occurs between a carboxylic acid and an alcohol, releasing water."},
     {q:"Ester bonds are found in which important biological molecules?", options:["DNA only","Triglycerides (fats) and phospholipids","Proteins only","Carbohydrates only"], answer:1, explain:"Ester bonds link fatty acid chains in triglycerides and phospholipids, key components of cell membranes."}
   ],
   flashcards:[
     {front:"What functional group defines a carboxylic acid?", back:"The carboxyl group (-COOH)."},
     {front:"What two substances react in esterification, and what forms?", back:"A carboxylic acid and an alcohol react to form an ester and water."},
     {front:"Why are ester bonds important in the human body?", back:"They hold together fatty acid chains in fats and cell membrane phospholipids."}
   ]},
  {id:"chem-amines", subject:"chemistry", title:"Amines & Basic Organic Reactions", icon:"🧪",
   tag:"Organic Chemistry",
   explanation:"Amines contain a nitrogen atom bonded to carbon chains and behave as weak bases, since the nitrogen's lone pair of electrons can accept a proton (H⁺). Amines are structurally related to ammonia and are found throughout biological molecules.",
   analogy:"An amine's nitrogen lone pair acts like an open hand ready to 'catch' a passing H⁺ ion — this proton-accepting ability is what makes amines behave as bases.",
   keyTerms:["Amine","Lone pair","Basicity","Amino group (-NH₂)","Protonation"],
   example:"Methylamine reacts with hydrochloric acid to form a salt, methylammonium chloride, as its nitrogen lone pair accepts a proton from the acid.",
   medicalConnection:"Amino acids — the building blocks of every protein in the human body — contain an amine group, making amine chemistry directly foundational to understanding protein structure and function in biochemistry.",
   memoryTrick:"\"Amines act like ammonia\" — both have a nitrogen lone pair that makes them behave as weak bases.",
   commonMistake:"Assuming amines are strong bases like sodium hydroxide — amines are generally weak bases, reacting less vigorously than strong inorganic bases.",
   goingDeeper:"Amines are classified as primary, secondary or tertiary based on how many carbon groups are attached to the nitrogen atom — not to be confused with the similarly-named classification for alcohols, which is based on the carbon skeleton instead. Because the nitrogen lone pair is what gives amines their basic, proton-accepting behaviour, amines with more electron-donating carbon groups attached to nitrogen tend to be slightly more basic, since those groups push additional electron density toward the lone pair, making it even more available to accept a proton.",
   testYourself:[
     {q:"Amines behave as weak bases because their nitrogen atom has a:", options:["Positive charge","Lone pair of electrons that can accept a proton","Double bond to oxygen","Negative charge only"], answer:1, explain:"The nitrogen's lone pair can accept an H⁺ ion, making amines weak bases."},
     {q:"Amines are structurally related to:", options:["Water","Ammonia","Methane","Oxygen gas"], answer:1, explain:"Amines are organic derivatives of ammonia (NH3)."},
     {q:"Which biological molecules contain an amine group?", options:["Carbohydrates","Amino acids (and therefore proteins)","Fats only","Water molecules"], answer:1, explain:"Amino acids, the building blocks of proteins, each contain an amine group."}
   ],
   flashcards:[
     {front:"Why do amines act as weak bases?", back:"Their nitrogen atom has a lone pair of electrons that can accept a proton (H⁺)."},
     {front:"What simple molecule are amines structurally related to?", back:"Ammonia (NH3)."},
     {front:"Why are amines important in biochemistry?", back:"Amino acids — the building blocks of proteins — each contain an amine group."}
   ]},
  {id:"chem-buffers", subject:"chemistry", title:"Buffers & Blood pH Regulation", icon:"🩸",
   tag:"Physical Chemistry",
   explanation:"A buffer solution resists changes in pH when small amounts of acid or base are added, typically made from a weak acid and its conjugate base (or a weak base and its conjugate acid). Buffers work by 'soaking up' excess H⁺ or OH⁻ ions before they can shift the pH significantly.",
   analogy:"A buffer acts like a sponge for acid or base — small spills of extra H⁺ or OH⁻ get absorbed into the buffer system before they can significantly change the surrounding pH, just as a sponge soaks up small spills before they spread.",
   keyTerms:["Buffer solution","Conjugate acid-base pair","Bicarbonate buffer system","pH stability"],
   example:"The bicarbonate buffer system in blood (carbonic acid / bicarbonate ion) keeps blood pH tightly within 7.35–7.45, even as metabolic reactions constantly produce acidic by-products like CO₂.",
   medicalConnection:"Failure of the body's buffer systems contributes to conditions like acidosis and alkalosis, making buffer chemistry a direct foundation for later clinical topics in blood gas interpretation.",
   memoryTrick:"\"Buffers resist, they don't prevent\" — a buffer minimises pH change but has a limited capacity before it's overwhelmed.",
   commonMistake:"Assuming a buffer keeps pH perfectly constant no matter how much acid or base is added — buffers have a finite capacity and can be overwhelmed by large additions.",
   goingDeeper:"A buffer resists pH change through a genuinely dynamic balancing act: if extra H⁺ is added, the buffer's conjugate base component reacts with and absorbs it; if extra OH⁻ is added, the buffer's weak acid component reacts with and neutralises it instead. This is why an effective buffer needs a reasonable supply of both components — a buffer that has nearly used up one of its two components (for example, almost all weak acid and very little conjugate base left) will start to fail well before the acid or base has technically 'run out' completely, since its remaining capacity to resist further change in that direction has been mostly exhausted.",
   testYourself:[
     {q:"A buffer solution is typically made from:", options:["A strong acid and a strong base","A weak acid and its conjugate base (or vice versa)","Pure water only","Two strong acids"], answer:1, explain:"Buffers are usually a weak acid paired with its conjugate base, or a weak base with its conjugate acid."},
     {q:"The main buffer system that keeps blood pH stable is the:", options:["Chloride buffer system","Bicarbonate buffer system","Sulphate buffer system","Nitrate buffer system"], answer:1, explain:"The bicarbonate buffer system (carbonic acid / bicarbonate ion) is the body's primary blood pH buffer."},
     {q:"A buffer's capacity to resist pH change is:", options:["Unlimited","Finite — it can be overwhelmed by large additions of acid or base","Only effective for bases, not acids","Only relevant in industrial chemistry"], answer:1, explain:"Buffers have a limited capacity and can be overwhelmed if too much acid or base is added."}
   ],
   flashcards:[
     {front:"What two components typically make up a buffer solution?", back:"A weak acid and its conjugate base (or a weak base and its conjugate acid)."},
     {front:"What is the body's main blood pH buffer system?", back:"The bicarbonate buffer system."},
     {front:"What happens if a buffer's capacity is exceeded?", back:"It can no longer resist further changes in pH."}
   ]}
],

  {id:"phy-vectors", subject:"physics", title:"Scalars & Vectors", icon:"➡️",
   tag:"Mechanics",
   explanation:"A scalar quantity has only magnitude (size), like mass or temperature. A vector quantity has both magnitude and direction, like velocity or force. Vectors are usually represented as arrows: length shows magnitude, arrowhead shows direction.",
   analogy:"Saying 'I walked 5 km' is a scalar (distance). Saying 'I walked 5 km north' is a vector (displacement) — the direction matters.",
   keyTerms:["Magnitude","Direction","Displacement","Resultant","Scalar"],
   example:"Two forces of 3N and 4N acting at right angles combine into a resultant force of 5N, found using Pythagoras' theorem.",
   medicalConnection:"Vector reasoning underlies how forces act on joints and limbs in biomechanics, relevant to understanding movement and injury.",

   commonMistake:"Adding vector magnitudes directly without considering direction (e.g. treating 3N + 4N as always 7N) leads to incorrect resultants.",
   goingDeeper:"Vectors can be broken down into perpendicular 'components' — for example, a force acting at an angle can be split into a horizontal and a vertical component, each easier to work with separately using sine and cosine. This component method is exactly how more complex vector problems (multiple forces at different angles) are solved in practice, rather than trying to add every vector directly. In biomechanics, this same technique is used to work out how much of a muscle's pulling force actually contributes to lifting a limb versus stabilising a joint, since muscles rarely pull in a perfectly straight, useful direction.",

  {id:"phy-newton", subject:"physics", title:"Newton's Laws of Motion", icon:"🍎",
   tag:"Mechanics",
   explanation:"Newton's three laws describe how objects move. First law: an object stays at rest or in uniform motion unless acted on by a force. Second law: force equals mass times acceleration (F = ma). Third law: every action has an equal and opposite reaction.",
   analogy:"Pushing a shopping trolley: it stays still until you push it (1st law), a heavier trolley needs more force to speed up the same amount (2nd law), and pushing the trolley forward pushes you slightly backward too (3rd law).",
   keyTerms:["Inertia","Force","Mass","Acceleration","Action-reaction pair"],
   example:"A 2kg object accelerating at 3 m/s² requires a net force of 6N, calculated using F = ma.",
   medicalConnection:"Newton's laws help explain impact forces in trauma — for example, why sudden deceleration in a collision can cause internal injury.",
   memoryTrick:"\"F = ma\" — Force equals mass times acceleration, always.",
   commonMistake:"Believing that a stationary object has no forces acting on it at all — often forces are balanced, not absent.",
   goingDeeper:"Newton's second law, F = ma, is really a special case of a more general relationship: force equals the rate of change of momentum. This distinction matters in situations where mass itself is changing, such as a rocket burning fuel, though for most everyday and exam-level problems mass stays constant and F = ma applies directly. Newton's third law is also frequently misunderstood — the two forces in an action-reaction pair always act on two different objects, never on the same object, which is why they never simply 'cancel out' within a single object's own motion.",
   testYourself:[
     {q:"Newton's second law is expressed as:", options:["F = m + a","F = ma","F = m/a","F = a/m"], answer:1, explain:"Force equals mass multiplied by acceleration."},
     {q:"An object at rest stays at rest unless acted on by:", options:["Gravity only","A net external force","Time","Nothing, it always stays at rest"], answer:1, explain:"This is Newton's first law — the law of inertia."},
     {q:"For every action, there is an equal and opposite:", options:["Force","Mass","Velocity","Momentum only"], answer:0, explain:"Newton's third law: action-reaction force pairs."}
   ],
   flashcards:[
     {front:"State Newton's second law.", back:"Force = mass × acceleration (F = ma)."},
     {front:"What is inertia?", back:"The tendency of an object to resist changes in its state of motion."},
     {front:"State Newton's third law.", back:"For every action, there is an equal and opposite reaction."}
   ]},
  {id:"phy-waves", subject:"physics", title:"Wave Properties", icon:"〰️",
   tag:"Waves",
   explanation:"A wave transfers energy from one place to another without transferring matter. Key properties include wavelength (distance between repeating points), frequency (waves per second), and amplitude (height of the wave, related to energy).",
   analogy:"A wave is like a Mexican wave in a stadium: each person moves up and down in place, but the 'wave' itself travels around the stadium — no one is carried along with it.",
   keyTerms:["Wavelength","Frequency","Amplitude","Wave speed"],
   example:"The wave equation v = fλ relates speed, frequency, and wavelength — used to calculate sound and light wave behaviour.",
   medicalConnection:"Ultrasound imaging uses high-frequency sound waves; understanding wave frequency and amplitude helps explain how imaging resolution and depth are controlled.",
   memoryTrick:"\"v = f λ\" — velocity equals frequency times wavelength.",
   commonMistake:"Confusing amplitude (related to energy/loudness) with frequency (related to pitch) is a common mix-up.",
   goingDeeper:"Waves are generally split into two types based on how the medium moves relative to the wave's direction of travel: transverse waves (like light and water ripples), where the medium oscillates perpendicular to the wave's motion, and longitudinal waves (like sound), where the medium oscillates back and forth in the same direction the wave travels. This distinction explains why sound needs a physical medium to travel through (it relies on particles bumping into each other) while light does not (it can travel through the vacuum of space as an electromagnetic wave).",
   testYourself:[
     {q:"Which wave property is related to the energy it carries?", options:["Wavelength","Amplitude","Period","Speed of light"], answer:1, explain:"Larger amplitude generally means the wave carries more energy."},
     {q:"The wave equation is written as:", options:["v = f + λ","v = f / λ","v = f × λ","v = λ / f"], answer:2, explain:"Wave speed equals frequency multiplied by wavelength."},
     {q:"Frequency is measured in:", options:["Metres","Seconds","Hertz","Newtons"], answer:2, explain:"Frequency (waves per second) is measured in Hertz (Hz)."}
   ],
   flashcards:[
     {front:"What does a wave transfer, if not matter?", back:"Energy."},
     {front:"State the wave equation.", back:"v = f × λ (speed = frequency × wavelength)."},
     {front:"What does amplitude relate to?", back:"The energy carried by the wave."}
   ]},
  {id:"phy-units", subject:"physics", title:"Units, Dimensions & Measurement", icon:"📏",
   tag:"Foundations",
   explanation:"Every physical quantity is a number paired with a unit that gives it meaning — saying a patient's dose is '500' means nothing without knowing whether that's 500 milligrams or 500 grams. The SI (International System) provides standard base units, such as the metre (length), kilogram (mass), second (time), and kelvin (temperature), from which all other units are derived.",
   analogy:"Units are like currency — saying you have '500' isn't useful until you know if that's 500 naira or 500 dollars; the number alone is meaningless without its unit attached.",
   keyTerms:["SI units","Base unit","Derived unit","Significant figures","Dimensional analysis"],
   example:"Speed is a derived unit, built from two base units: metres (length) divided by seconds (time), giving m/s.",
   medicalConnection:"Unit errors in medicine can be life-threatening — confusing milligrams (mg) with micrograms (μg) in a drug dose is a genuine and well-documented cause of serious medication errors.",
   memoryTrick:"\"No unit, no meaning\" — a number without a unit in physics or medicine is incomplete and potentially dangerous.",
   commonMistake:"Mixing units within the same calculation (e.g. combining centimetres and metres without converting) — always convert to consistent units before calculating.",
   goingDeeper:"Dimensional analysis is a powerful checking tool: every equation must balance in terms of its base dimensions (length, mass, time, and so on), not just its numbers. If you derive a formula and its units don't work out to what you expect, you've almost certainly made an error somewhere — checking units is one of the fastest ways to catch a mistake before submitting a calculation. This is also why unfamiliar formulas can often be partly reconstructed just by thinking about what units the final answer needs to have.",
   testYourself:[
     {q:"Which of these is an SI base unit?", options:["Newton","Joule","Kilogram","Watt"], answer:2, explain:"The kilogram is an SI base unit; Newtons, Joules and Watts are all derived units."},
     {q:"Speed (m/s) is an example of a:", options:["Base unit","Derived unit","Dimensionless quantity","Vector only"], answer:1, explain:"Speed is derived by combining the base units for length and time."},
     {q:"Why are unit errors particularly dangerous in medicine?", options:["They never actually matter clinically","Confusing units like mg and μg can lead to serious dosing errors","Units are optional in prescriptions","Doctors don't use standard units"], answer:1, explain:"Mixing up units like milligrams and micrograms is a well-documented cause of serious medication errors."}
   ],
   flashcards:[
     {front:"Name three SI base units.", back:"Any three of: metre (length), kilogram (mass), second (time), kelvin (temperature), ampere (current), mole (amount of substance)."},
     {front:"What is a derived unit?", back:"A unit built by combining base units, such as m/s for speed."},
     {front:"Why does dimensional analysis help catch errors?", back:"Because every correct equation must balance in its units, not just its numbers."}
   ]},
  {id:"phy-motion", subject:"physics", title:"Motion, Velocity & Acceleration", icon:"🏃",
   tag:"Mechanics",
   explanation:"Distance is the total path length travelled, while displacement is the straight-line distance from start to finish, including direction. Speed is how fast distance is covered; velocity is speed in a given direction. Acceleration is the rate at which velocity changes over time, whether by speeding up, slowing down, or changing direction.",
   analogy:"Running twice around a 400m track brings you back to your start — you've covered 800m of distance, but your displacement is zero, because you ended up exactly where you began.",
   keyTerms:["Distance","Displacement","Speed","Velocity","Acceleration","Deceleration"],
   example:"A car accelerating from 0 to 20 m/s in 4 seconds has an acceleration of 5 m/s² (change in velocity ÷ time taken).",
   medicalConnection:"Acceleration and deceleration forces are central to understanding trauma — the sudden deceleration in a car crash is what causes internal injuries, even when the outside of the body shows little damage.",
   memoryTrick:"\"Velocity needs a direction, speed doesn't\" — the same way a vector needs direction but a scalar doesn't.",
   commonMistake:"Using 'speed' and 'velocity' interchangeably — speed is a scalar (magnitude only), while velocity is a vector (magnitude and direction), and this distinction matters in calculations.",
   goingDeeper:"Motion can be tracked using graphs: a distance-time graph's gradient (slope) gives speed, while a velocity-time graph's gradient gives acceleration, and the area under a velocity-time graph gives the distance travelled. These graphical relationships let you extract far more information from motion data than a single number ever could — for example, a curved distance-time graph immediately tells you the object's speed is changing, without needing to calculate anything first.",
   testYourself:[
     {q:"Displacement differs from distance because displacement:", options:["Is always larger","Includes direction and measures the straight-line change in position","Ignores direction completely","Is measured in different units"], answer:1, explain:"Displacement is the straight-line distance from start to finish, including direction."},
     {q:"An object accelerates from rest to 20 m/s in 4 seconds. Its acceleration is:", options:["5 m/s²","80 m/s²","16 m/s²","4 m/s²"], answer:0, explain:"Acceleration = change in velocity ÷ time = 20 ÷ 4 = 5 m/s²."},
     {q:"On a velocity-time graph, the area under the line represents:", options:["Acceleration","Distance travelled","Speed only","Nothing meaningful"], answer:1, explain:"The area under a velocity-time graph gives the distance (or displacement) travelled."}
   ],
   flashcards:[
     {front:"What's the difference between distance and displacement?", back:"Distance is total path length; displacement is the straight-line distance from start to finish, including direction."},
     {front:"What does the gradient of a velocity-time graph represent?", back:"Acceleration."},
     {front:"Why do sudden decelerations cause internal injury in a crash?", back:"The body's organs continue moving at the original speed for a moment even as the body itself rapidly slows, causing internal forces and damage."}
   ]},
  {id:"phy-forcework", subject:"physics", title:"Work, Energy & Power", icon:"💪",
   tag:"Mechanics",
   explanation:"Work is done when a force moves an object through a distance (Work = Force × distance). Energy is the capacity to do work, and it exists in many forms (kinetic, potential, chemical, thermal) that can convert between each other but are never created or destroyed. Power is the rate at which work is done, or energy is transferred, per unit time.",
   analogy:"Carrying a heavy bag up a hill does more work than carrying it across flat ground of the same distance, because you're also fighting gravity — the extra effort goes into raising the bag's gravitational potential energy.",
   keyTerms:["Work","Kinetic energy","Potential energy","Conservation of energy","Power","Joule","Watt"],
   example:"Lifting a 2kg object 3m against gravity does work of approximately 2 × 10 × 3 = 60 joules (using g ≈ 10 m/s²), which becomes stored as gravitational potential energy.",
   medicalConnection:"The body converts chemical energy from food into kinetic energy (movement), thermal energy (body heat) and other forms — understanding energy conservation is foundational to later topics in metabolism and exercise physiology.",
   memoryTrick:"\"Energy just changes form, it never disappears\" — the law of conservation of energy in one line.",
   commonMistake:"Assuming 'power' and 'energy' mean the same thing — power is the rate at which energy is transferred or work is done, not the total amount of energy itself.",
   goingDeeper:"Kinetic energy depends on the square of velocity (KE = ½mv²), not velocity directly — which is why doubling an object's speed doesn't double its kinetic energy, it quadruples it. This is a crucial concept in understanding collision severity: a car travelling twice as fast doesn't crash with twice the force, it crashes with roughly four times the energy, which is part of why speed limits have such an outsized effect on the severity of road traffic injuries.",
   testYourself:[
     {q:"Work is calculated as:", options:["Force + distance","Force × distance","Force ÷ distance","Mass × distance"], answer:1, explain:"Work = Force × distance moved in the direction of the force."},
     {q:"Doubling an object's speed causes its kinetic energy to:", options:["Double","Stay the same","Quadruple (increase 4×)","Halve"], answer:2, explain:"Since KE = ½mv², doubling velocity quadruples kinetic energy (2² = 4)."},
     {q:"Power is best described as:", options:["The total energy stored in an object","The rate at which work is done or energy is transferred","A type of force","The same thing as energy"], answer:1, explain:"Power measures how quickly energy is transferred or work is done, not the total amount."}
   ],
   flashcards:[
     {front:"What is the formula for work?", back:"Work = Force × distance."},
     {front:"What is the formula for kinetic energy?", back:"KE = ½mv² (half mass times velocity squared)."},
     {front:"State the law of conservation of energy.", back:"Energy cannot be created or destroyed, only converted from one form to another."}
   ]},
  {id:"phy-momentum", subject:"physics", title:"Momentum & Impulse", icon:"🎱",
   tag:"Mechanics",
   explanation:"Momentum is a measure of an object's motion, calculated as mass × velocity. In any closed system, total momentum is conserved — it doesn't change unless an external force acts on the system, which is especially useful for analysing collisions. Impulse is the change in momentum, equal to force × the time over which it acts.",
   analogy:"A loaded truck and a small car moving at the same speed don't feel the same to stop — the truck has far more momentum because of its greater mass, which is why it takes far more force (or more time) to bring it to rest.",
   keyTerms:["Momentum","Conservation of momentum","Impulse","Collision","Elastic/inelastic collision"],
   example:"In a collision between two objects with no external forces, the total momentum before the collision equals the total momentum after — this principle is used to calculate unknown speeds after a crash.",
   medicalConnection:"Impulse explains why airbags and crumple zones reduce injury: by extending the time over which a collision's momentum change happens, they reduce the peak force experienced by the body, even though the total change in momentum is the same.",
   memoryTrick:"\"Momentum = mass in motion\" — literally mass × velocity.",
   commonMistake:"Forgetting that momentum is a vector — direction matters, so two objects moving toward each other have momenta that partially or fully cancel, not simply add.",
   goingDeeper:"Impulse (force × time) being equal to the change in momentum explains a huge range of real-world safety design: airbags, crumple zones, and even the padding in a boxing glove all work by extending the time over which a collision occurs. Since the total change in momentum in a given collision is fixed, stretching that change over a longer time reduces the average force experienced — the same underlying physics that makes 'rolling with a fall' less painful than landing stiffly.",
   testYourself:[
     {q:"Momentum is calculated as:", options:["Mass + velocity","Mass × velocity","Mass ÷ velocity","Force × time"], answer:1, explain:"Momentum = mass × velocity."},
     {q:"In a closed system with no external forces, total momentum is:", options:["Always increasing","Always decreasing","Conserved (stays constant)","Irrelevant"], answer:2, explain:"The law of conservation of momentum states total momentum stays constant in a closed system."},
     {q:"Airbags reduce injury mainly by:", options:["Reducing the total change in momentum","Extending the time over which momentum changes, reducing peak force","Increasing the force of impact","Having no effect on force"], answer:1, explain:"Extending collision time reduces the average force for the same momentum change (impulse = force × time)."}
   ],
   flashcards:[
     {front:"What is the formula for momentum?", back:"Momentum = mass × velocity."},
     {front:"State the law of conservation of momentum.", back:"In a closed system with no external forces, total momentum before an event equals total momentum after."},
     {front:"How do airbags reduce injury, in terms of impulse?", back:"They extend the time over which the momentum change happens, reducing the peak force on the body."}
   ]},
  {id:"phy-circular", subject:"physics", title:"Circular Motion", icon:"🌀",
   tag:"Mechanics",
   explanation:"An object moving in a circle at constant speed is still accelerating, because its direction is constantly changing — this acceleration points toward the centre of the circle and is called centripetal acceleration. The force that causes it is called centripetal force, and without it, an object would simply travel in a straight line.",
   analogy:"Swinging a ball on a string in a circle: the string constantly pulls the ball toward your hand (the centre) — that inward pull is the centripetal force. Let go of the string, and the ball flies off in a straight line, not outward, because the centre-pulling force is gone.",
   keyTerms:["Centripetal force","Centripetal acceleration","Angular velocity","Circular path"],
   example:"A car turning a corner relies on friction between its tyres and the road to provide the centripetal force needed to follow the curved path — insufficient friction (e.g. on a wet road) means the car can't turn as sharply and may skid outward.",
   medicalConnection:"Centrifuges used in medical laboratories spin samples at high speed to separate components (like blood cells from plasma) by density, relying directly on the physics of circular motion to generate the strong effective force needed for separation.",
   memoryTrick:"\"Centripetal pulls IN, toward the centre\" — never confuse it with an outward 'centrifugal' push, which isn't a real force acting on the object.",
   commonMistake:"Believing an object in circular motion is being pushed outward by a 'centrifugal force' — what you feel as being pushed outward is actually your own inertia resisting the inward centripetal force, not a real outward force acting on you.",
   goingDeeper:"The often-mentioned 'centrifugal force' isn't a real force at all — it's an apparent effect that arises from inertia when viewed from inside a rotating frame of reference (like sitting in a spinning car). From an outside, non-rotating viewpoint, there's no outward force involved at all — only the real, inward centripetal force keeping the object on its curved path. This distinction matters in a centrifuge too: it's the inward force from the rotor holding the sample tube on its path that creates the effective separating force, not an outward 'push' on the denser particles.",
   testYourself:[
     {q:"Centripetal force always points:", options:["Away from the centre of the circle","Toward the centre of the circle","In the direction of motion","Opposite to the direction of motion"], answer:1, explain:"Centripetal force points toward the centre of the circular path, keeping the object moving in a circle."},
     {q:"An object moving in a circle at constant speed is:", options:["Not accelerating, since speed is constant","Still accelerating, because its direction is constantly changing","Moving in a straight line","Experiencing no force at all"], answer:1, explain:"Because velocity is a vector, a constantly changing direction means the object is accelerating even at constant speed."},
     {q:"Medical centrifuges use circular motion physics mainly to:", options:["Heat samples","Separate components of a sample by density","Measure temperature","Sterilise equipment"], answer:1, explain:"High-speed circular motion in a centrifuge separates components like blood cells from plasma by density."}
   ],
   flashcards:[
     {front:"Which direction does centripetal force point?", back:"Toward the centre of the circular path."},
     {front:"Is an object moving in a circle at constant speed accelerating?", back:"Yes — because its direction is constantly changing, even though its speed is not."},
     {front:"Is 'centrifugal force' a real outward force?", back:"No — it's an apparent effect of inertia, not a real force acting on the object."}
   ]},
  {id:"phy-density", subject:"physics", title:"Density & Pressure", icon:"🧱",
   tag:"Fluids",
   explanation:"Density describes how much mass is packed into a given volume (density = mass ÷ volume). Pressure describes how much force is applied over a given area (pressure = force ÷ area). Denser materials pack more mass into the same space, while higher pressure means the same force is concentrated over a smaller area.",
   analogy:"Standing on soft sand with bare feet sinks you in, but the same body weight spread across the wide surface of skis lets you glide over the top — same force, but much lower pressure because the area is far larger.",
   keyTerms:["Density","Pressure","Mass","Volume","Force","Area"],
   example:"A sharp needle can pierce skin with relatively little force because its tiny tip area concentrates that force into very high pressure, while a blunt object with the same force spread over a larger area does not.",
   medicalConnection:"Blood pressure is precisely this concept applied to the circulatory system — the force of blood pushing against artery walls, per unit area — and its careful regulation is essential to health, with chronically high blood pressure (hypertension) straining the heart and blood vessels over time.",
   memoryTrick:"\"Pressure = Force spread over Area\" — the smaller the area, the more concentrated (higher) the pressure for the same force.",
   commonMistake:"Confusing density with weight — a large light object (like a block of polystyrene) can weigh less than a small heavy object (like a metal ball) despite being much bigger, because density depends on how tightly packed the mass is, not the object's size alone.",
   goingDeeper:"Pressure in a fluid also increases with depth, because deeper fluid has to support the weight of all the fluid above it — this is why a diver feels increasing pressure the deeper they go, and why deep-sea creatures have adaptations to withstand pressures that would crush an unprotected human. This same depth-pressure relationship is why blood pressure is typically measured at heart level: measuring at a different height would need correction for the extra fluid pressure from that height difference.",
   testYourself:[
     {q:"Density is calculated as:", options:["Mass × volume","Mass ÷ volume","Volume ÷ mass","Mass + volume"], answer:1, explain:"Density = mass ÷ volume."},
     {q:"A sharp needle pierces skin easily with little force mainly because:", options:["It is very heavy","Its small tip area concentrates the force into high pressure","It has low density","Needles require no force at all"], answer:1, explain:"A small area concentrates a given force into much higher pressure (pressure = force ÷ area)."},
     {q:"Why does fluid pressure increase with depth?", options:["It doesn't — pressure is the same at all depths","Deeper fluid must support the weight of all the fluid above it","Fluids become denser automatically at depth","Pressure only depends on temperature"], answer:1, explain:"Pressure increases with depth because deeper fluid supports the weight of the fluid column above it."}
   ],
   flashcards:[
     {front:"What is the formula for pressure?", back:"Pressure = Force ÷ Area."},
     {front:"What is the formula for density?", back:"Density = Mass ÷ Volume."},
     {front:"Why is blood pressure typically measured at heart level?", back:"Because fluid pressure changes with height, so measuring at a different height would require correction."}
   ]},
  {id:"phy-pascalarch", subject:"physics", title:"Pascal's Principle & Archimedes' Principle", icon:"🛁",
   tag:"Fluids",
   explanation:"Pascal's principle states that pressure applied to an enclosed fluid is transmitted equally in all directions throughout the fluid — this is the basis of hydraulic systems. Archimedes' principle states that an object submerged in a fluid experiences an upward buoyant force equal to the weight of the fluid it displaces, which explains why objects float or sink.",
   analogy:"Pascal's principle is like squeezing a fully sealed water balloon: press anywhere, and the pressure change is felt equally throughout the whole balloon, not just where you pressed. Archimedes' principle is like an object 'pushing water out of the way' — the water pushes back with a force equal to the weight of what it had to move aside.",
   keyTerms:["Pascal's principle","Hydraulic system","Archimedes' principle","Buoyant force","Displacement"],
   example:"A hydraulic lift uses a small force on a small piston to generate a much larger force on a bigger piston, because the pressure (force ÷ area) is transmitted equally, so a larger area means a proportionally larger output force.",
   medicalConnection:"Archimedes' principle underlies techniques like underwater weighing for body composition analysis, and hydraulic principles are used in devices such as blood pressure cuffs and certain surgical instruments.",
   memoryTrick:"\"Pascal spreads it, Archimedes floats it\" — a quick way to keep the two principles separate.",
   commonMistake:"Assuming an object floats only if it's 'light' — what actually matters is density relative to the fluid: an object floats if its average density is less than the fluid's density, regardless of its total weight (a huge ship floats; a small pebble sinks).",
   goingDeeper:"Archimedes' principle explains why the same person feels 'lighter' in a swimming pool: the buoyant force pushes upward with a force equal to the weight of the displaced water, partially opposing gravity. This is the physics behind aquatic physiotherapy, where reduced effective body weight in water allows patients with joint or mobility issues to exercise with far less strain on painful joints than they would experience on land.",
   testYourself:[
     {q:"Pascal's principle states that pressure applied to an enclosed fluid is:", options:["Lost immediately","Transmitted equally in all directions throughout the fluid","Only felt at the point of application","Converted entirely into heat"], answer:1, explain:"Pascal's principle: pressure change in an enclosed fluid is transmitted equally throughout."},
     {q:"According to Archimedes' principle, the buoyant force on a submerged object equals:", options:["The object's own weight always","The weight of the fluid displaced by the object","The volume of the object","The density of the object"], answer:1, explain:"Buoyant force equals the weight of the fluid displaced by the object."},
     {q:"An object floats when:", options:["Its total weight is very low","Its average density is less than the fluid's density","It has a flat shape only","It contains no air"], answer:1, explain:"Floating depends on density relative to the fluid, not total weight alone."}
   ],
   flashcards:[
     {front:"State Pascal's principle.", back:"Pressure applied to an enclosed fluid is transmitted equally in all directions throughout the fluid."},
     {front:"State Archimedes' principle.", back:"An object submerged in a fluid experiences an upward buoyant force equal to the weight of the fluid it displaces."},
     {front:"Why do people feel lighter in a swimming pool?", back:"Buoyant force from the displaced water pushes upward, partially opposing gravity."}
   ]},
  {id:"phy-fluidflow", subject:"physics", title:"Fluid Flow & Viscosity", icon:"🩸",
   tag:"Fluids",
   explanation:"Fluids flow faster through narrow sections of a tube and slower through wider sections, since the same volume must pass through each section per second (continuity). Viscosity describes a fluid's internal resistance to flow — thick fluids like honey have high viscosity, while thin fluids like water have low viscosity, and higher viscosity means more resistance to flowing.",
   analogy:"Squeezing a hosepipe's nozzle narrows the opening and makes the water shoot out faster — the same amount of water has to pass through a smaller space per second, so it must speed up, just as blood speeds up through a narrowed artery.",
   keyTerms:["Fluid flow","Viscosity","Continuity","Laminar flow","Turbulent flow"],
   example:"Honey flows far more slowly than water when poured, because its much higher viscosity creates greater internal resistance to flow.",
   medicalConnection:"Blood viscosity affects how hard the heart must work to pump it — conditions that thicken the blood increase viscosity and cardiac workload, while narrowed arteries (as in atherosclerosis) force blood to speed up through the narrowed section, changing flow patterns in ways that can be detected on imaging.",
   memoryTrick:"\"Narrow = fast, wide = slow\" — for a fluid moving through a tube of varying width, keeping the same volume flowing per second.",
   commonMistake:"Assuming a fluid always flows smoothly (laminar flow) — beyond a certain speed or through irregular/narrowed passages, flow can become turbulent (chaotic), which is noisier, less efficient, and clinically significant, such as the turbulent blood flow that produces an audible heart murmur.",
   goingDeeper:"The relationship between flow speed and tube width isn't just a rough rule — it follows directly from the principle of continuity, which requires the same volume of fluid to pass any cross-section of a tube per second. Combined with viscosity effects, this is part of why narrowed blood vessels (as in atherosclerosis) don't just slow blood flow overall — they can locally speed up flow through the narrowed section enough to become turbulent, and that turbulence is often exactly what a clinician hears as an abnormal sound through a stethoscope.",
   testYourself:[
     {q:"In a tube of varying width, fluid moves fastest where the tube is:", options:["Widest","Narrowest","It doesn't change with width","Only affected by fluid colour"], answer:1, explain:"To keep the same volume flowing per second, fluid must speed up through narrower sections."},
     {q:"A fluid with high viscosity is best described as:", options:["Flowing very easily with little resistance","Having high internal resistance to flow, like honey","Always a gas","Having no mass"], answer:1, explain:"High viscosity means greater internal resistance to flow."},
     {q:"Turbulent blood flow through a narrowed artery can produce:", options:["Complete silence","An audible heart murmur","Increased blood viscosity only","No clinical significance"], answer:1, explain:"Turbulent flow through narrowed or irregular vessels can produce audible sounds, such as murmurs."}
   ],
   flashcards:[
     {front:"Why does fluid speed up through a narrower section of tube?", back:"The same volume of fluid must pass through each cross-section per second (continuity), so a smaller area requires higher speed."},
     {front:"What does viscosity describe?", back:"A fluid's internal resistance to flow."},
     {front:"Why can narrowed arteries produce audible murmurs?", back:"Blood speeds up and can become turbulent through the narrowed section, producing sound."}
   ]},
  {id:"phy-heattemp", subject:"physics", title:"Heat & Temperature", icon:"🌡️",
   tag:"Thermal Physics",
   explanation:"Temperature measures the average kinetic energy of particles in a substance — how 'hot' or 'cold' something is. Heat is the transfer of thermal energy between objects at different temperatures, always flowing from hotter to colder until they reach thermal equilibrium (equal temperature).",
   analogy:"Temperature is like the average speed of a crowd of people milling about; heat is like people from a fast-moving crowd bumping into and gradually speeding up a slower crowd next to them, until both crowds are moving at a similar average pace.",
   keyTerms:["Temperature","Heat","Thermal equilibrium","Specific heat capacity","Kelvin"],
   example:"A cup of hot tea left on a table transfers heat to the cooler surrounding air until both reach the same temperature (thermal equilibrium), at which point no more net heat transfer occurs.",
   medicalConnection:"The body carefully regulates its core temperature around 37°C through mechanisms like sweating and shivering; heat transfer principles also underlie how a fever develops and how cooling therapies are used to manage dangerously high body temperatures.",
   memoryTrick:"\"Heat flows hot to cold, always\" — never spontaneously the other way, without external work being done.",
   commonMistake:"Using 'heat' and 'temperature' interchangeably — temperature is a measure of particle energy (a property of a substance), while heat is the energy actually being transferred between substances (a process, not a static property).",
   goingDeeper:"Different substances require different amounts of heat energy to raise their temperature by the same amount — a property called specific heat capacity. Water has an unusually high specific heat capacity, meaning it can absorb or release a large amount of heat with only a small temperature change, which is exactly why water is so effective at regulating temperature in the body (making up roughly 60% of body mass) and why coastal areas have milder climates than inland areas at the same latitude.",
   testYourself:[
     {q:"Temperature is best described as a measure of:", options:["Total heat energy stored","The average kinetic energy of particles in a substance","The mass of an object","The pressure of a substance"], answer:1, explain:"Temperature reflects the average kinetic energy of particles, not total heat energy."},
     {q:"Heat naturally flows:", options:["From cold objects to hot objects","From hot objects to cold objects, until equilibrium","In both directions equally at all times","Only in liquids"], answer:1, explain:"Heat flows from hotter objects to colder objects until thermal equilibrium is reached."},
     {q:"Water's high specific heat capacity means it:", options:["Heats up and cools down very quickly","Can absorb or release a lot of heat with only a small temperature change","Cannot store thermal energy","Always stays at exactly the same temperature"], answer:1, explain:"A high specific heat capacity means a substance resists temperature change relative to the heat energy transferred."}
   ],
   flashcards:[
     {front:"What's the difference between heat and temperature?", back:"Temperature measures average particle kinetic energy; heat is the transfer of thermal energy between objects."},
     {front:"What does 'thermal equilibrium' mean?", back:"Two objects have reached the same temperature, so there's no more net heat transfer between them."},
     {front:"Why is water so effective at regulating body temperature?", back:"Its high specific heat capacity lets it absorb or release a lot of heat with only a small temperature change."}
   ]},
  {id:"phy-thermalexp", subject:"physics", title:"Thermal Expansion", icon:"📈",
   tag:"Thermal Physics",
   explanation:"Most materials expand when heated and contract when cooled, because higher temperature makes particles vibrate more and take up more space on average. Solids, liquids and gases all expand, but generally gases expand the most for a given temperature change, followed by liquids, then solids.",
   analogy:"Heated particles are like a crowd of people who, when given more energy, naturally spread out and take up more room than when they're calm and tightly packed together.",
   keyTerms:["Thermal expansion","Contraction","Expansion joints","Linear expansion"],
   example:"Railway tracks and bridges are built with small gaps (expansion joints) to allow the metal to expand safely in hot weather without buckling.",
   medicalConnection:"Thermal expansion principles are relevant to how some medical thermometers work (like the traditional mercury or alcohol thermometer, where the liquid visibly expands up a thin tube as temperature rises) and to storage guidelines for temperature-sensitive medicines and vaccines.",
   memoryTrick:"\"Hot expands, cold contracts\" — the basic rule for nearly all common materials.",
   commonMistake:"Assuming all materials expand by the same amount for the same temperature change — different materials expand at different rates, which is exactly why mismatched materials (like a metal lid on a glass jar) can jam or loosen unexpectedly with temperature changes.",
   goingDeeper:"Water is a notable exception to typical thermal expansion behaviour: unlike most substances, water actually expands as it approaches freezing and becomes less dense as ice, rather than more dense like typical solids. This unusual property is why ice floats rather than sinks, allowing a layer of ice to insulate the water below it in cold climates — without this quirk, bodies of water would freeze from the bottom up, with very different consequences for aquatic life.",
   testYourself:[
     {q:"Most materials, when heated, will:", options:["Contract","Expand","Stay exactly the same size","Turn to gas instantly"], answer:1, explain:"Most materials expand as particles vibrate more and spread out with increased temperature."},
     {q:"Expansion joints in bridges and railways exist to:", options:["Make construction cheaper","Allow safe expansion of materials in hot weather without buckling","Reduce the weight of the structure","Improve appearance only"], answer:1, explain:"Expansion joints accommodate thermal expansion, preventing structural damage."},
     {q:"Which substance famously expands (rather than contracts) as it approaches freezing?", options:["Iron","Water","Mercury","Glass"], answer:1, explain:"Water is unusual in that it expands as it freezes, which is why ice floats."}
   ],
   flashcards:[
     {front:"What happens to most materials when heated?", back:"They expand, as particles vibrate more and take up more space."},
     {front:"Why do bridges and railway tracks include expansion joints?", back:"To allow safe thermal expansion in hot weather without buckling or structural damage."},
     {front:"Why does ice float on water?", back:"Water expands and becomes less dense as it freezes, unlike most substances."}
   ]},
  {id:"phy-kinetictheory", subject:"physics", title:"The Kinetic Theory of Gases", icon:"💨",
   tag:"Thermal Physics",
   explanation:"The kinetic theory explains gas behaviour at the particle level: gas particles are in constant, random motion, colliding with each other and with the walls of their container. Gas pressure arises from the frequency and force of these collisions against the container walls, and temperature reflects the average kinetic energy of the particles.",
   analogy:"Imagine a room full of bouncing balls constantly hitting the walls — the more balls, the faster they move, or the smaller the room, the more often and harder the walls get hit, which is exactly what's happening (at a much smaller scale) with gas molecules creating pressure.",
   keyTerms:["Kinetic theory","Particle collision","Absolute zero","Average kinetic energy"],
   example:"Heating a sealed gas container increases the average speed of its particles, so they collide with the walls more frequently and forcefully, increasing pressure — even though the volume hasn't changed.",
   medicalConnection:"Kinetic theory explains why gases used in medicine (like oxygen or anaesthetic gases) behave predictably under pressure and temperature changes, which is essential for the safe design of gas cylinders, ventilators and anaesthesia delivery systems.",
   memoryTrick:"\"Pressure = particles bashing the walls\" — more frequent or harder collisions mean higher pressure.",
   commonMistake:"Thinking gas particles are stationary or evenly spread by design — gas particles are in constant, random, chaotic motion, and their apparent even spread is simply the statistical result of that randomness, not deliberate arrangement.",
   goingDeeper:"Absolute zero (0 Kelvin, approximately -273°C) is the theoretical temperature at which particle motion would reach an absolute minimum, meaning there's a genuine physical lower limit to how cold anything can get — unlike temperature scales like Celsius, which have no true 'zero point' tied to particle motion. This is exactly why gas law calculations require the Kelvin scale: because Kelvin is directly proportional to average particle kinetic energy, while Celsius (with its arbitrary zero point at water's freezing point) is not.",
   testYourself:[
     {q:"According to kinetic theory, gas pressure arises from:", options:["Gas particles attracting each other","Particles colliding with the walls of their container","The colour of the gas","The gas's chemical formula alone"], answer:1, explain:"Pressure results from the frequency and force of particle collisions against container walls."},
     {q:"Absolute zero refers to:", options:["0°C","0°F","The theoretical temperature of minimum particle motion (0 Kelvin)","Room temperature"], answer:2, explain:"Absolute zero (0 K, about -273°C) is the theoretical limit of minimum particle kinetic energy."},
     {q:"Why must gas law calculations use the Kelvin scale rather than Celsius?", options:["Kelvin is easier to write","Kelvin is directly proportional to average particle kinetic energy","Celsius is more accurate","There is no real reason"], answer:1, explain:"Kelvin's zero point corresponds to minimum particle motion, making it directly proportional to kinetic energy, unlike Celsius."}
   ],
   flashcards:[
     {front:"According to kinetic theory, what causes gas pressure?", back:"Particles colliding with the walls of their container."},
     {front:"What is absolute zero?", back:"The theoretical temperature (0 Kelvin, about -273°C) at which particle motion reaches an absolute minimum."},
     {front:"Why does temperature need to be in Kelvin for gas calculations?", back:"Kelvin is directly proportional to average particle kinetic energy, unlike Celsius."}
   ]},
  {id:"phy-thermodynamics", subject:"physics", title:"The Laws of Thermodynamics", icon:"🔥",
   tag:"Thermal Physics",
   explanation:"The first law of thermodynamics states that energy cannot be created or destroyed, only converted between forms or transferred as heat and work — a restatement of energy conservation applied to heat engines and systems. The second law states that heat naturally flows from hot to cold, and that the total disorder (entropy) of an isolated system tends to increase over time.",
   analogy:"The first law is like a strict household budget: you can move money between different accounts (forms of energy), but the total amount never magically increases or disappears. The second law is like a tidy room naturally becoming messier over time unless energy is deliberately put in to tidy it — order doesn't happen by itself.",
   keyTerms:["First law of thermodynamics","Second law of thermodynamics","Entropy","Energy conversion","Heat engine"],
   example:"A car engine converts the chemical energy in fuel into kinetic energy (motion) and heat, but never converts 100% of that chemical energy into useful motion — some is always lost as heat, consistent with the second law.",
   medicalConnection:"The human body obeys these same laws: it converts chemical energy from food into movement, heat, and cellular work, but can never be perfectly efficient — some energy is always lost as heat, which is part of why exercising raises body temperature.",
   memoryTrick:"\"1st law: energy is conserved. 2nd law: disorder increases.\"",
   commonMistake:"Assuming living organisms violate the second law by building complex, ordered structures — organisms maintain their internal order only by increasing disorder in their surroundings (releasing heat and waste), so the total entropy of the organism plus its environment still increases overall.",
   goingDeeper:"The second law of thermodynamics is really about probability at the particle level: there are vastly more possible disordered arrangements of particles than ordered ones, so systems naturally drift toward disorder simply because it's statistically far more likely, not because of any active 'force' pushing toward disorder. This same idea explains why heat never spontaneously flows from a cold object to a hot one without external work — it isn't physically impossible in principle, just astronomically improbable, and thermodynamics deals in these overwhelming probabilities rather than absolute impossibilities.",
   testYourself:[
     {q:"The first law of thermodynamics is essentially a restatement of:", options:["Newton's third law","The conservation of energy","The conservation of momentum","Gas pressure laws"], answer:1, explain:"The first law states energy cannot be created or destroyed, only converted or transferred."},
     {q:"The second law of thermodynamics states that, in an isolated system, entropy (disorder) tends to:", options:["Decrease over time","Stay exactly constant","Increase over time","Disappear entirely"], answer:2, explain:"Entropy in an isolated system tends to increase over time."},
     {q:"Living organisms appear to create order (e.g. growing complex structures) without violating the second law because:", options:["They are an exception to physical laws","They increase disorder in their surroundings, so total entropy still increases overall","Entropy doesn't apply to biology","They don't actually create order"], answer:1, explain:"Organisms maintain internal order at the cost of releasing heat and waste, increasing entropy in their surroundings overall."}
   ],
   flashcards:[
     {front:"State the first law of thermodynamics.", back:"Energy cannot be created or destroyed, only converted between forms or transferred."},
     {front:"State the second law of thermodynamics.", back:"The total entropy (disorder) of an isolated system tends to increase over time."},
     {front:"How do living organisms stay 'ordered' without violating the second law?", back:"They increase disorder in their surroundings (releasing heat and waste), so total entropy overall still increases."}
   ]},
  {id:"phy-sound", subject:"physics", title:"Sound Waves", icon:"🔊",
   tag:"Waves",
   explanation:"Sound is a longitudinal wave — it travels by particles vibrating back and forth in the same direction the wave moves, creating regions of compression (particles pushed together) and rarefaction (particles spread apart). Sound needs a physical medium (like air, water, or tissue) to travel through, unlike light, and cannot travel through a vacuum.",
   analogy:"Sound moving through air is like a long line of people passing a nudge down the line, each person bumping the next forward and then springing back to their original spot — the nudge (energy) travels down the line, but no single person actually walks the whole distance.",
   keyTerms:["Longitudinal wave","Compression","Rarefaction","Pitch","Loudness","Medium"],
   example:"Sound travels roughly four times faster through water than through air, because water's particles are much more tightly packed, allowing vibrations to pass between them more efficiently.",
   medicalConnection:"A stethoscope works by channelling and amplifying the sounds produced inside the body (heartbeats, breath sounds, bowel sounds) to the examiner's ear, relying entirely on how sound travels through and is transmitted between different media.",
   memoryTrick:"\"No medium, no sound\" — sound cannot travel through the vacuum of space.",
   commonMistake:"Assuming sound and light travel at similarly fast speeds — sound is dramatically slower than light (roughly 343 m/s in air versus about 300,000,000 m/s for light), which is why you see lightning well before you hear its thunder.",
   goingDeeper:"Pitch corresponds to a sound wave's frequency (higher frequency = higher pitch), while loudness corresponds to amplitude (larger amplitude = louder sound) — the two are independent of each other, so a sound can be high-pitched and quiet, or low-pitched and loud. The human ear typically detects frequencies roughly between 20 Hz and 20,000 Hz, a range that narrows with age; sounds above this range (ultrasound) are inaudible to humans but are exactly what medical ultrasound imaging deliberately uses, since these very high frequencies can be focused into precise beams that reflect off internal tissue boundaries.",
   testYourself:[
     {q:"Sound is classified as a:", options:["Transverse wave","Longitudinal wave","Electromagnetic wave","Standing wave only"], answer:1, explain:"Sound is a longitudinal wave, with particles vibrating in the same direction the wave travels."},
     {q:"Why can't sound travel through a vacuum?", options:["Sound doesn't need a medium, this is a myth","Sound requires a physical medium of particles to transmit vibrations","Vacuums are too cold for sound","Sound only travels through solids"], answer:1, explain:"Sound relies on particle-to-particle vibration, so it cannot travel through the particle-free vacuum of space."},
     {q:"The human audible range is roughly:", options:["0–10 Hz","20–20,000 Hz","1,000–100,000 Hz","No defined range"], answer:1, explain:"Humans typically hear frequencies from about 20 Hz to 20,000 Hz."}
   ],
   flashcards:[
     {front:"What type of wave is sound?", back:"A longitudinal wave."},
     {front:"Why can't sound travel through a vacuum?", back:"It needs a physical medium (particles) to transmit vibrations, which a vacuum lacks."},
     {front:"What is the typical human audible frequency range?", back:"Roughly 20 Hz to 20,000 Hz."}
   ]},
  {id:"phy-doppler", subject:"physics", title:"The Doppler Effect", icon:"🚑",
   tag:"Waves",
   explanation:"The Doppler effect is the apparent change in a wave's frequency (and pitch, for sound) caused by relative motion between the source and the observer. When a source moves toward an observer, waves bunch up, raising the perceived frequency; when it moves away, waves stretch out, lowering the perceived frequency.",
   analogy:"An ambulance siren sounds higher-pitched as it approaches you and suddenly drops in pitch as it passes and moves away — the siren itself isn't changing, but its relative motion toward then away from you compresses then stretches the sound waves reaching your ear.",
   keyTerms:["Doppler effect","Frequency shift","Relative motion","Source","Observer"],
   example:"A police radar gun uses the Doppler effect by bouncing radio waves off a moving car and measuring the frequency shift of the reflected waves to calculate the car's speed.",
   medicalConnection:"Doppler ultrasound uses this exact same principle to measure blood flow: sound waves reflected off moving red blood cells return at a shifted frequency, and the size of that shift reveals how fast (and in which direction) the blood is flowing — widely used to check for blood clots or assess heart valve function.",
   memoryTrick:"\"Toward you = higher pitch, away from you = lower pitch\" — the classic passing-siren effect.",
   commonMistake:"Assuming the Doppler effect changes the wave's actual speed — it doesn't; the wave's speed through the medium stays the same, only its perceived frequency (and wavelength) changes due to relative motion.",
   goingDeeper:"The size of a Doppler frequency shift depends on how fast the source and observer are moving relative to each other — a larger relative speed produces a larger shift. This is precisely why Doppler ultrasound can distinguish between slow venous blood flow and fast arterial flow, and even calculate approximate flow speeds, by carefully measuring exactly how much the reflected frequency has shifted from the original transmitted frequency, rather than simply detecting whether flow is present at all.",
   testYourself:[
     {q:"The Doppler effect describes:", options:["A change in a wave's actual speed","An apparent change in frequency due to relative motion between source and observer","A wave losing energy over distance","A wave changing from longitudinal to transverse"], answer:1, explain:"The Doppler effect is an apparent frequency shift caused by relative motion, not an actual change in wave speed."},
     {q:"As a sound source moves toward you, its perceived pitch:", options:["Rises","Falls","Stays exactly the same","Disappears"], answer:0, explain:"Waves bunch up as the source approaches, raising the perceived frequency (pitch)."},
     {q:"Doppler ultrasound measures blood flow by detecting:", options:["The colour of blood","A frequency shift in sound waves reflected off moving red blood cells","The temperature of blood","Blood pressure directly"], answer:1, explain:"Doppler ultrasound detects the frequency shift in sound reflected off moving blood cells to determine flow speed and direction."}
   ],
   flashcards:[
     {front:"What is the Doppler effect?", back:"An apparent change in a wave's frequency due to relative motion between the source and the observer."},
     {front:"Why does a siren's pitch drop as it passes and moves away from you?", back:"The sound waves stretch out as the source moves away, lowering the perceived frequency."},
     {front:"What does Doppler ultrasound measure in the body?", back:"Blood flow speed and direction, via the frequency shift of sound reflected off moving blood cells."}
   ]},
  {id:"phy-electricity", subject:"physics", title:"Electricity Basics", icon:"⚡",
   tag:"Electricity",
   explanation:"Electric current is the flow of electric charge, usually carried by electrons moving through a conductor, measured in amperes (A). Voltage (potential difference) is the 'push' that drives current through a circuit, measured in volts (V). Resistance opposes the flow of current, measured in ohms (Ω), and these three quantities are linked by Ohm's law: V = IR.",
   analogy:"Think of an electrical circuit like water flowing through pipes: voltage is like the water pressure pushing the flow, current is like the rate of water flow itself, and resistance is like a narrow section of pipe that restricts how easily the water can flow.",
   keyTerms:["Current (I)","Voltage (V)","Resistance (R)","Ohm's law","Conductor","Insulator"],
   example:"A circuit with a 12V battery and a 4Ω resistor carries a current of 3A, calculated using Ohm's law: I = V ÷ R = 12 ÷ 4 = 3.",
   medicalConnection:"The heart's own electrical activity — the signal that triggers each heartbeat — can be measured non-invasively using an ECG (electrocardiogram), which detects the tiny voltage changes on the skin produced by the heart's electrical conduction system.",
   memoryTrick:"\"V = IR\" — voltage equals current multiplied by resistance.",
